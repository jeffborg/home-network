---
# Nightly base backup. WAL is archived continuously by the plugin
# (isWALArchiver: true on the Cluster), so point-in-time recovery between base
# backups comes from the WAL rather than from this schedule.
#
# 01:30 is chosen to sit clear of the existing velero windows (minio 15:00,
# backblaze 17:00) and the etcd snapshot at 01:00.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-nightly
  namespace: database-system
spec:
  # CNPG cron is 6-field, seconds first.
  schedule: "0 30 1 * * *"
  backupOwnerReference: self
  cluster:
    name: postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
