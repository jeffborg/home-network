# S3 credentials for Postgres backups to the NAS minio, copied from velero's
# `minio-credentials` secret in the velero namespace.
#
# Why a copy rather than a reference: secrets are namespace-scoped, and the two
# consumers want different shapes. Velero stores an aws-style ini file under a
# single `minio` key; the barman cloud plugin wants the access key and secret
# as separate keys. So this is the same credential, reshaped.
#
# If the minio key is ever rotated, BOTH this and velero's copy need updating.
# That duplication is the cost of not running a credential broker; noted here so
# it is not a surprise later.
