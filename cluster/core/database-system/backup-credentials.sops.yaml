    ACCESS_KEY_ID: ENC[AES256_GCM,data:rdJHnPbF+w==,iv:XKgbQh7fBBaKCcPmJRxIS2vT9xtu437KJc3QkTh0gdE=,tag:4Ohs/Hp9XzvP25IrwFnMZg==,type:str]
