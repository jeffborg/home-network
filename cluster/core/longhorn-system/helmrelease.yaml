---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  chart:
    spec:
      # renovate: registryUrl=https://charts.longhorn.io
      chart: longhorn
      # Quoted, which the regex manager in renovate.json5 does not match -- so
      # Longhorn is deliberately untracked. Longhorn refuses to skip minors, so
      # renovate would only ever offer versions we cannot install. Unquote once
      # the staircase (#2833) reaches current.
      #
      # 1.12.2 SPECIFICALLY -- not 1.12.0 or 1.12.1, and never 1.11.3.
      #
      # longhorn/longhorn#14120: from 1.11.3 the in-process webhook TLS
      # bootstrap only parses a PKCS#8 RSA key, but the longhorn-webhook-ca
      # secret written by 1.11.2 and earlier (rancher dynamiclistener, which is
      # what k3s uses) holds an ECDSA P-256 key in SEC1 form. The first start on
      # an affected version fails to parse it, regenerates the CA and leaf, and
      # then writes resources through failurePolicy: Fail webhooks whose
      # caBundle still trusts the old CA. Every longhorn-manager exits, so none
      # serves the webhook and none can finish the upgrade step: a deadlock.
      # A Helm rollback does NOT recover it -- the webhook configurations have
      # to be deleted by hand.
      #
      # Our secret is an EC key, which is the exact pre-check in that issue:
      #   kubectl -n longhorn-system get secret longhorn-webhook-ca \
      #     -o jsonpath='{.data.tls\.key}' | base64 -d | head -1
      #   -----BEGIN EC PRIVATE KEY-----
      #
      # The fix is backported to 1.11.4 (#14191) and 1.12.2 (#14192) only. The
      # parent issue is still open against v1.14.0, and there is no 1.13.x
      # backport, so RE-CHECK the key type and that issue before any 1.13 hop.
      #
      # The provisioner constraint that originally pinned 1.11.2 is now moot --
      # k8s is 1.34, past the >= 1.34 that 1.11.3's csi-provisioner v6.3.0
      # wanted -- but 1.11.3 stays skipped because of the CA bug above, and
      # because 1.12.x is a single minor hop from 1.11.x either way.
      version: '1.12.2'
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  # Managers roll across six nodes and the engine images deploy behind them; the
  # 5m default is not enough, and with retries defaulting to 0 a single timeout
  # would wedge the release at "upgrade retries exhausted" until the spec changes.
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  interval: 10m0s
  values:
    ingress:
      enabled: true
      tls: true
      host: longhorn.${BASE_DOMAIN}
      annotations:
        cert-manager.io/cluster-issuer: ca-issuer
        # The UI can delete volumes, so it is gated by oauth2-proxy against
        # Authelia (#3097). Order is significant: the sign-in middleware must
        # be listed before the auth middleware so it can catch its 401 and
        # turn it into a login redirect. See oauth2-proxy-middlewares.yaml.
        traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd,longhorn-system-oauth2-signin-longhorn@kubernetescrd,longhorn-system-oauth2-auth-longhorn@kubernetescrd
    # startupapicheck:
    #   backoffLimit: 10
    # The manager has always served metrics on port 9500; this just creates the
    # ServiceMonitor so Prometheus actually scrapes them.
    # Longhorn 1.12 added six NetworkPolicies, and they appear even though
    # `networkPolicies.enabled` is still false: `restrictInternalTraffic`
    # defaults to true in 1.12 and is evaluated independently of it. Verified by
    # rendering the chart with stock values -- 1.11.2 produces 0 policies,
    # 1.12.2 produces 6, and 1.12.2 with restrictInternalTraffic=false produces
    # 0 again.
    #
    # The `longhorn-manager` policy admits only bare podSelectors, which means
    # same-namespace only, so Prometheus in monitoring-system lost its scrape of
    # TCP/9500 the moment 1.12.2 rolled -- all six targets went `connection
    # refused` and TargetDown + our own LonghornMetricsMissing (#3356) fired.
    #
    # Fixed the way upstream intends, with metricsScrapeSources, rather than by
    # turning restrictInternalTraffic off: that keeps the new isolation for
    # everything else. Scoped to namespace AND pod in a single peer, because
    # those are ANDed within one entry and 9500 also serves the Longhorn REST
    # API -- a namespaceSelector on its own would hand the whole of
    # monitoring-system an API it does not need. The chart's own documentation
    # for this value makes the same point.
    networkPolicies:
      metricsScrapeSources:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
    metrics:
      serviceMonitor:
        enabled: true
    longhornManager:
      nodeSelector:
        storage: longhorn
    defaultSettings:
      systemManagedComponentsNodeSelector: storage:longhorn
    #   defaultReplicaCount: '1'
      
