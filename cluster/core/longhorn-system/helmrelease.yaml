---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  chart:
    spec:
      # renovate: registryUrl=https://charts.longhorn.io
      chart: longhorn
      version: '1.6.4'
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install: {}
  interval: 10m0s
  values:
    ingress:
      enabled: true
      tls: true
      host: longhorn.${BASE_DOMAIN}
      annotations:
        cert-manager.io/cluster-issuer: ca-issuer
        traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
    # startupapicheck:
    #   backoffLimit: 10
    # The manager has always served metrics on port 9500; this just creates the
    # ServiceMonitor so Prometheus actually scrapes them.
    metrics:
      serviceMonitor:
        enabled: true
    longhornManager:
      nodeSelector:
        storage: longhorn
    defaultSettings:
      systemManagedComponentsNodeSelector: storage:longhorn
    #   defaultReplicaCount: '1'
      
