# Migrated into git, SOPS-encrypted, from the copy created by hand during the
# #3097 Authelia rollout on 2026-10-10. Before this these values existed only in
# the cluster and in velero, so a rebuild could not reproduce auth from the repo.
#
# `data` (base64) rather than `stringData`, deliberately: the values are copied
# verbatim from the live Secret with no re-encoding, so there is no transform that
# could corrupt them. `.sops.yaml` encrypts `^data$`.
#
# Flux adopts the existing Secret rather than recreating it -- same name, same
# namespace, same values -- so nothing restarts and no session is invalidated.
