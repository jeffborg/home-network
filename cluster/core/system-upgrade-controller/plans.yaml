---
# k3s rollout Plans, owned by Flux (#2837). Pinned, not channel-tracked.
#
# Renovate DOES manage the two `version:` fields below, but only within the minor
# the cluster is already on -- `.github/renovate.json5` caps it with
# an `allowedVersions` regex pinned to that minor -- because a minor is a
# staircase step gated on Longhorn, Flux and cert-manager (#2833). Patch bumps
# are routine and arrive as a PR; taking the next minor means lifting that cap
# by hand, which is the point. (This comment used to quote the regex literally
# and had already drifted two minors behind it, so it no longer does.)
# Nothing is automerged either way: every k3s change reboots all six nodes.
#
# What actually re-triggers a roll is the plan's HASH, not its name. SUC stores a
# hash of the plan spec in a plan.upgrade.cattle.io/<name> node label and compares
# it to `status.latestHash`, so changing `version:` alone is enough -- which is why
# a renovate PR that only edits these two lines works. (An earlier revision of this
# comment claimed the rename was what made nodes upgrade. It is not; verified
# against the live node labels.)
#
# The names are deliberately NOT versioned. They used to be (`server-plan134`
# and so on), renamed by hand each minor, and that was wrong for two reasons:
#
#  - SUC records each plan's hash under a `plan.upgrade.cattle.io/<name>` node
#    label, and never removes labels for plans that no longer exist. Thirteen
#    had accumulated on every server node, one per minor back to 1.23.
#  - renovate manages `version:` but cannot rename anything, so the name only
#    matched reality while a human remembered to change it -- two sources of
#    truth for one fact, and only one of them maintained automatically.
#
# A stable name costs nothing, because the roll is triggered by the spec hash
# either way (see above), and `kubectl get plans` shows the version in its own
# column.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
spec:
  version: v1.35.10+k3s1
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values: ["true"]
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
spec:
  version: v1.35.10+k3s1
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  # Holds the Pis until every server has completed server-plan.
  prepare:
    image: rancher/k3s-upgrade
    args: ["prepare", "server-plan"]
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
