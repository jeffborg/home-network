---
# k3s rollout Plans, owned by Flux (#2837). Pinned, not channel-tracked, and
# bumped by hand one minor at a time: the version here is a staircase step gated
# on Longhorn and Flux (#2833), so renovate must not offer it.
#
# Renaming the pair per minor is deliberate -- SUC records each plan's hash on
# the node as a plan.upgrade.cattle.io/<name> label, so a new name is what makes
# it treat every node as needing the new version. The previous pair is removed
# from this file in the same commit and the `core` Kustomization prunes it; the
# stale node labels it leaves behind are harmless.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan127
spec:
  version: v1.27.16+k3s1
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values: ["true"]
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan127
spec:
  version: v1.27.16+k3s1
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  # Holds the Pis until every server has completed server-plan127.
  prepare:
    image: rancher/k3s-upgrade
    args: ["prepare", "server-plan127"]
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
