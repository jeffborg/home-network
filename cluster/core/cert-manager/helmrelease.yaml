---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  chart:
    spec:
      # renovate: registryUrl=https://charts.jetstack.io
      chart: cert-manager
      version: v1.19.6
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install: {}
  interval: 10m0s
  values:
    # cert-manager already serves metrics on port 9402; this creates the
    # ServiceMonitor so they are scraped.
    #
    # Keep this block to exactly these two keys. 1.21 removes
    # servicemonitor.targetPort, servicemonitor.path and podmonitor.path, and the
    # values schema is additionalProperties:false -- so any of those keys present
    # becomes a hard schema failure whenever we do move past 1.19. Harmless to
    # stay minimal now.
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
    # startupapicheck:
    #   backoffLimit: 10