# Migrated into git, SOPS-encrypted, from the copy created by hand on
# 2026-10-10 (#3097). Holds the OIDC RSA signing key (oidc.jwk.RS256.pem) and
# the pbkdf2 hash of each OIDC client's secret.
#
# The signing key is the sensitive one: every ID token Authelia has issued is
# signed with it, so it is copied verbatim and never regenerated. Replacing it
# would invalidate outstanding tokens for all seven clients at once.
#
# The client hashes correspond to the oauth2-proxy secrets migrated in the
# companion PR; the two sets must stay in step, which is the main reason to have
# both in git rather than one in git and one only in the cluster.
#
# `data` (base64) rather than `stringData` so no re-encoding touches them -- the
# PEM in particular must survive byte-for-byte.
