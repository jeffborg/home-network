---
# Public record, DNS-only (the Cloudflare default). A proxied record gets an
# HTTPS/ECH record that clients prefer over the internal A, breaking split-horizon.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: auth
  namespace: auth-system
spec:
  endpoints:
    - dnsName: auth.${EXTERNAL_DOMAIN}
      recordType: CNAME
      recordTTL: 1
      targets:
        - link1.${EXTERNAL_DOMAIN}
