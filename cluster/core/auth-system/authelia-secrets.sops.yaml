# Migrated into git, SOPS-encrypted, from the copy created by hand on
# 2026-10-10 (#3097). Holds Authelia's four internal keys: the session and
# storage encryption keys, the reset-password JWT hmac key and the OIDC hmac
# key. Previously these lived only in the cluster and in velero.
#
# Rotating any of these has consequences beyond a restart: changing
# session.encryption.key invalidates every active session, and
# storage.encryption.key is used to encrypt rows already in db.sqlite3 -- it
# cannot be changed without Authelia's own storage re-encrypt command. These
# values are therefore copied verbatim, NOT regenerated.
#
# `data` (base64) rather than `stringData` so no re-encoding touches them.
