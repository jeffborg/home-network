---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: snmp-ubiquiti
  namespace: monitoring-system
spec:
  # Room for a few SNMP retries inside the 30s interval.
  scrapeTimeout: 25s
  staticConfigs:
    - targets:
      - 192.168.100.1
      labels:
        job: snmp-ucg-ultra
        __metrics_path__: /snmp
        __param_module: if_mib
        __param_auth: public_v1
    # airMAX radios, grouped by link; the alerts key their expected ethernet
    # speed off `link` (garage is an M-series with 100M ethernet).
    - targets:
      - 192.168.10.184
      - 192.168.10.185
      labels:
        job: snmp-airmax
        link: sam
        __metrics_path__: /snmp
        __param_module: airmax
        __param_auth: public_v1
    - targets:
      - 192.168.10.186
      - 192.168.10.187
      labels:
        job: snmp-airmax
        link: dad
        __metrics_path__: /snmp
        __param_module: airmax
        __param_auth: public_v1
    - targets:
      - 192.168.58.142
      labels:
        job: snmp-airmax
        link: garage
        __metrics_path__: /snmp
        __param_module: airmax
        __param_auth: public_v1
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: snmp-exporter-prometheus-snmp-exporter.monitoring-system:9116