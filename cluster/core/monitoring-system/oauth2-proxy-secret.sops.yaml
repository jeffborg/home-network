    name: oauth2-proxy
    namespace: monitoring-system
type: Opaque
data:
    client-secret: ENC[AES256_GCM,data:NPnuEDADcnyICDBf+NXFbDe0gSaRSKb65oGDzApZKjT9Nu3igSdLttOBiThmHL2mEDuLlWQs6g345Rs7ThfzOBFAtG/GUV35dxYA5N20A6rgx/Jdzd9i8g==,iv:qIoUlTFCi+/HrhHbcxqqt8gv1EpGOq9/eWsye5EztUo=,tag:NVKUPK/js3Hmqwv2wkn6ag==,type:str]
