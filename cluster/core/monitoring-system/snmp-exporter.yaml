---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snmp-exporter
  namespace: monitoring-system
spec:
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://prometheus-community.github.io/helm-charts
      chart: prometheus-snmp-exporter
      version: 9.18.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  # snmp.yml is a subPath mount, which never sees ConfigMap updates; the chart
  # has no Deployment annotations, so Reloader's is patched on.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /metadata/annotations/configmap.reloader.stakater.com~1reload
                value: snmp-exporter-config
  values:
    serviceMonitor:
      enabled: true
    extraConfigmapMounts:
      - name: snmp-exporter-config
        mountPath: /etc/snmp_exporter/snmp.yml
        subPath: snmp.yml
        configMap: snmp-exporter-config
        readOnly: true
        defaultMode: 420
    extraArgs:
      - --config.file=/etc/snmp_exporter/snmp.yml
