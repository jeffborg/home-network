---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snmp-exporter
  namespace: monitoring-system
spec:
  interval: 15m
  chart:
    spec:
      chart: prometheus-snmp-exporter
      version: 4.8.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  values:
    serviceMonitor:
      enabled: true
    config:
      modules:
        ubiquiti_unifi:
          walk:
            - 1.3.6.1.2.1.1
            - 1.3.6.1.2.1.2
            - 1.3.6.1.4.1.41112
          get:
            - 1.3.6.1.2.1.1.1.0
            - 1.3.6.1.2.1.1.5.0
          metrics:
            - name: ifTable
              oid: 1.3.6.1.2.1.2.2
              type: gauge
              help: The interface table
