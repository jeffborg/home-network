---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: snmp-exporter
  namespace: monitoring-system
spec:
  interval: 15m
  chart:
    spec:
      chart: prometheus-snmp-exporter
      version: 9.18.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  values:
    serviceMonitor:
      enabled: true
