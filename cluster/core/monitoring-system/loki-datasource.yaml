---
# Discovered by the Grafana datasource sidecar, which watches for
# ConfigMaps labelled grafana_datasource=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki
  namespace: monitoring-system
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.monitoring-system.svc.cluster.local:3100
        isDefault: false
        jsonData:
          maxLines: 2000
          # Loki registers /loki/api/v1/drilldown-limits outside the middleware
          # that injects the `fake` tenant when auth_enabled is false, so that
          # one route 401s with "no org id" and Logs Drilldown falls back to
          # default limits. The value is irrelevant -- Loki still forces every
          # query onto `fake` -- it just has to be present.
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: fake
