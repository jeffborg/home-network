---
# Discovered by the Grafana datasource sidecar, which watches for
# ConfigMaps labelled grafana_datasource=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki
  namespace: monitoring-system
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.monitoring-system.svc.cluster.local:3100
        isDefault: false
        jsonData:
          maxLines: 2000
