---
# One /oauth2 route per protected host: the login redirect lands here and
# the session cookie is set here, so it has to be served from the app's own
# hostname. No cert-manager annotation — each reuses the certificate the app
# already requests, so there is still only one Certificate per host.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy-prometheus
  namespace: monitoring-system
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - prometheus.${BASE_DOMAIN}
      secretName: prometheus-tls
  rules:
    - host: prometheus.${BASE_DOMAIN}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy-alertmanager
  namespace: monitoring-system
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - alertmanager.${BASE_DOMAIN}
      secretName: alertmanager-tls
  rules:
    - host: alertmanager.${BASE_DOMAIN}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180
