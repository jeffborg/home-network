---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring-system
spec:
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      version: 72.9.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 15m
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    # CRDs are managed by cluster/crds/kube-prometheus-stack (keep the git tag
    # there in lockstep with the chart version above).
    crds:
      enabled: false

    # k3s runs the control plane inside the server process: these components do
    # not expose scrapeable endpoints at the chart's default addresses, so both
    # the scrape targets and their alert rules stay off. Revisit if k3s is ever
    # started with --etcd-expose-metrics.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false

    defaultRules:
      rules:
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false
        etcd: false
        windows: false

    prometheus:
      # Needed so the "Source" link in an alert resolves to something a
      # browser can open.
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd,monitoring-system-oauth2-signin@kubernetescrd,monitoring-system-oauth2-auth@kubernetescrd
        hosts:
          - prometheus.${BASE_DOMAIN}
        paths:
          - /
        tls:
          - secretName: prometheus-tls
            hosts:
              - prometheus.${BASE_DOMAIN}
      prometheusSpec:
        externalUrl: https://prometheus.${BASE_DOMAIN}
        # Pick up ServiceMonitors/PodMonitors/Rules from every namespace, not
        # just ones labelled with this release — phase 2 adds them in-place in
        # longhorn-system, network-system, util-system, cert-manager, velero.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        retention: 30d
        retentionSize: 18GiB
        resources:
          requests:
            cpu: 300m
            memory: 2Gi
          limits:
            memory: 5Gi
        # The TSDB lives on node-local LVM, not Longhorn: it is high-churn
        # data that would otherwise be replicated 3x and dragged through
        # Longhorn's `default` recurring-job group (snapshots 5x/day plus a
        # nightly full backup to NFS), where existing low-churn config volumes
        # already sit at 2-3x their requested size. This pins Prometheus to
        # whichever of node1-3 provisions the volume, which is an acceptable
        # trade for data that can simply be rebuilt. Requires #3063.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-lvm
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 20Gi

    alertmanager:
      # Delivery goes through the cluster's own postfix relay
      # (network/smtp-mail), which already holds the SES credentials and
      # advertises no AUTH — so Alertmanager needs no secret of its own, which
      # is why email beats a Slack webhook here.
      #
      # This replaces the chart's default config wholesale, so the parts of it
      # that matter are reproduced: the inhibit rules, and routing Watchdog to
      # a null receiver. Watchdog fires permanently by design (it is the
      # dead-man's switch), so it must never reach a real receiver.
      config:
        global:
          resolve_timeout: 5m
          smtp_smarthost: smtp-mail.network.svc.cluster.local:587
          # The relay sets ALLOWED_SENDER_DOMAINS to ${EXTERNAL_DOMAIN}, so the
          # From address has to be in that domain or postfix rejects it.
          smtp_from: alertmanager@${EXTERNAL_DOMAIN}
          # No TLS on this hop. It is pod-to-pod inside the cluster, to a relay
          # that requires no authentication, so there is no credential to
          # protect and nothing is gained by encrypting it.
          #
          # The alternative was STARTTLS with verification skipped, which is
          # encryption that proves nothing about the peer — more moving parts
          # for no actual guarantee. Verified that the relay accepts cleartext
          # submission: a message sent with no STARTTLS went out as
          # dsn=2.0.0, status=sent.
          smtp_require_tls: false
        inhibit_rules:
          - source_matchers:
              - 'severity = critical'
            target_matchers:
              - 'severity =~ warning|info'
            equal: ['namespace', 'alertname']
          - source_matchers:
              - 'severity = warning'
            target_matchers:
              - 'severity = info'
            equal: ['namespace', 'alertname']
          - source_matchers:
              - 'alertname = InfoInhibitor'
            target_matchers:
              - 'severity = info'
            equal: ['namespace']
          - target_matchers:
              - 'alertname = InfoInhibitor'
        route:
          group_by: ['namespace', 'alertname']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: email
          routes:
            # Always first: the dead-man's switch must stay silent.
            - receiver: 'null'
              matchers:
                - alertname = "Watchdog"
            - receiver: email
              matchers:
                - severity = "critical"
              repeat_interval: 1h
        receivers:
          - name: 'null'
          - name: email
            email_configs:
              - to: jeffrey@${EXTERNAL_DOMAIN}
                send_resolved: true

                headers:
                  subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .Alerts | len }}) — home cluster'
        templates:
          - '/etc/alertmanager/config/*.tmpl'
      # Without an ingress and a matching externalUrl, every link in an alert
      # email pointed at http://kube-prometheus-stack-alertmanager.monitoring-system:9093
      # — a cluster-internal address that resolves nowhere from a phone or a
      # laptop. Same story for the "Source" link, which comes from Prometheus.
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd,monitoring-system-oauth2-signin@kubernetescrd,monitoring-system-oauth2-auth@kubernetescrd
        hosts:
          - alertmanager.${BASE_DOMAIN}
        paths:
          - /
        tls:
          - secretName: alertmanager-tls
            hosts:
              - alertmanager.${BASE_DOMAIN}
      alertmanagerSpec:
        externalUrl: https://alertmanager.${BASE_DOMAIN}
        # Stays on Longhorn: 2Gi of low-churn data, and silences are worth
        # replicating.
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
      # Slack delivery is deliberately not wired up here yet: it needs a sops
      # secret holding the webhook URL. See the PR / issue for the snippet.

    grafana:
      # RWO volume on a Deployment, so the rollout has to let go before it
      # takes hold. The chart defaults to RollingUpdate, which deadlocks:
      # the new pod cannot attach the volume while the old one holds it, and
      # with one replica maxUnavailable rounds down to 0, so the old pod is
      # never retired. The OIDC change above was the first thing to alter the
      # pod spec since this was deployed, and it wedged exactly like that:
      #
      #   Multi-Attach error for volume "pvc-835b46ce..." Volume is already
      #   used by pod(s) kube-prometheus-stack-grafana-5d845f484c-8b967
      #
      # Every other Deployment in this repo with an RWO PVC already sets
      # Recreate -- all 42 of them. Grafana was the only one that did not,
      # because it comes from a subchart whose default was never overridden.
      deploymentStrategy:
        type: Recreate
      # Login is Authelia over OIDC (#3097). Grafana is the one app here that
      # can do this natively, and the reason to bother rather than put a proxy
      # in front: a proxy can only answer yes/no, while OIDC carries the group
      # claim, so Authelia's `admins` becomes a Grafana *role*.
      #
      # The local login form stays enabled on purpose, as break-glass for when
      # Authelia is the thing that is broken, which has already happened twice.
      # That only works if the admin password is not the chart default, so it
      # now comes from a secret too; leaving admin/prom-operator live would
      # have made the OIDC gate decorative.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      # Supplies GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET.
      envFromSecret: grafana-oidc
      extraSecretMounts:
        # Grafana talks to Authelia over its real hostname, so it has to trust
        # the internal CA. Taken from the certificate this namespace already
        # holds for grafana.${BASE_DOMAIN}; only ca.crt is mounted, never the
        # private key.
        - name: internal-ca
          secretName: grafana-tls
          mountPath: /etc/ssl/internal
          readOnly: true
          defaultMode: 288
          items:
            - key: ca.crt
              path: ca.crt
      grafana.ini:
        server:
          # The chart only sets `domain`, which leaves root_url at its default
          # of http://<domain>:3000/ : wrong scheme, wrong port. Grafana builds
          # its OIDC redirect_uri from this, so without it the callback goes to
          # a URL that does not exist.
          root_url: https://grafana.${BASE_DOMAIN}
        auth:
          # Not auto-login: that would redirect straight past the form and make
          # the break-glass account unreachable from a browser.
          oauth_auto_login: false
          signout_redirect_url: https://auth.${BASE_DOMAIN}/logout
        auth.generic_oauth:
          enabled: true
          name: Authelia
          icon: signin
          client_id: grafana
          scopes: openid profile email groups
          auth_url: https://auth.${BASE_DOMAIN}/api/oidc/authorization
          token_url: https://auth.${BASE_DOMAIN}/api/oidc/token
          api_url: https://auth.${BASE_DOMAIN}/api/oidc/userinfo
          tls_client_ca: /etc/ssl/internal/ca.crt
          use_pkce: true
          allow_sign_up: true
          # Authelia group -> Grafana role. This is the capability a proxy
          # cannot provide. Not strict, so someone in neither group still gets
          # in as a Viewer rather than being refused outright.
          # GrafanaAdmin, not Admin: the local account is server admin, so mapping
          # to org Admin alone left the Authelia login with fewer options than the
          # break-glass user it was meant to replace.
          allow_assign_grafana_admin: true
          role_attribute_path: "contains(groups[*], 'admins') && 'GrafanaAdmin' || 'Viewer'"
          role_attribute_strict: false
      # Stays on Longhorn for the same reason as Alertmanager — small, and it
      # holds hand-made dashboards until phase 4 provisions them from git.
      persistence:
        enabled: true
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        size: 2Gi
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        hosts:
          - grafana.${BASE_DOMAIN}
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.${BASE_DOMAIN}

    prometheus-node-exporter:
      # Hardware metrics: hwmon temperatures, and fan RPM where the board
      # exposes one.
      extraArgs:
        - --collector.thermal_zone
        - --collector.hwmon
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
