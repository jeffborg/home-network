---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring-system
spec:
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      version: 93.11.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 15m
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    # CRDs are managed by cluster/crds/kube-prometheus-stack (keep the git tag
    # there in lockstep with the chart version above).
    crds:
      enabled: false

    # k3s runs the control plane inside the server process: these components do
    # not expose scrapeable endpoints at the chart's default addresses, so both
    # the scrape targets and their alert rules stay off. Revisit if k3s is ever
    # started with --etcd-expose-metrics.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false

    # The same single process also means one shared Prometheus registry served
    # whole on every listener, so :10250 and :6443 return identical content --
    # the kubelet scrape re-imports every apiserver_* and etcd_* series the
    # apiserver scrape already has. Upstream closed this as working as intended
    # (k3s-io/k3s#2262); the k3s docs say to scrape one endpoint only. We keep
    # both jobs because the stock apiserver rules select job="apiserver", and
    # split the families between them instead.
    #
    # Each list repeats the chart's own default rule verbatim: Helm replaces
    # lists rather than merging them, so omitting it would silently re-admit the
    # histogram buckets the chart deliberately drops.
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          # Chart default: drop excessively noisy apiserver buckets.
          - action: drop
            regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
            sourceLabels:
              - __name__
              - le
          # Kubelet metrics belong to the kubelet job, which honours labels. Here
          # they arrive with namespace="default" (the `kubernetes` Service's own
          # namespace) and the real one demoted to exported_namespace, so every
          # PVC on a server node shows up twice in dashboards.
          - action: drop
            regex: kubelet_.+
            sourceLabels:
              - __name__
    kubelet:
      serviceMonitor:
        # Applies to the /metrics path only -- cAdvisor and probes have their own
        # cAdvisorMetricRelabelings / probesMetricRelabelings keys and are untouched.
        metricRelabelings:
          # Chart default: reduce bucket cardinality of kubelet storage operations.
          - action: drop
            regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
            sourceLabels:
              - __name__
              - le
          # Control-plane families, owned by the apiserver job.
          - action: drop
            regex: (apiserver|etcd)_.+
            sourceLabels:
              - __name__

    defaultRules:
      rules:
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false
        etcd: false
        windows: false

    prometheus:
      # Needed so the "Source" link in an alert resolves to something a
      # browser can open.
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd,monitoring-system-oauth2-signin@kubernetescrd,monitoring-system-oauth2-auth@kubernetescrd
        hosts:
          - prometheus.${BASE_DOMAIN}
        paths:
          - /
        tls:
          - secretName: prometheus-tls
            hosts:
              - prometheus.${BASE_DOMAIN}
      prometheusSpec:
        externalUrl: https://prometheus.${BASE_DOMAIN}
        # Pick up ServiceMonitors/PodMonitors/Rules from every namespace, not
        # just ones labelled with this release — phase 2 adds them in-place in
        # longhorn-system, network-system, util-system, cert-manager, velero.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        retention: 30d
        retentionSize: 18GiB
        resources:
          requests:
            cpu: 300m
            memory: 2Gi
          limits:
            memory: 5Gi
        # The TSDB lives on node-local LVM, not Longhorn: it is high-churn
        # data that would otherwise be replicated 3x and dragged through
        # Longhorn's `default` recurring-job group (snapshots 5x/day plus a
        # nightly full backup to NFS), where existing low-churn config volumes
        # already sit at 2-3x their requested size. This pins Prometheus to
        # whichever of node1-3 provisions the volume, which is an acceptable
        # trade for data that can simply be rebuilt. Requires #3063.
        storageSpec:
          volumeClaimTemplate:
            metadata:
              # Full by design (retentionSize); prometheus-storage rules cover it.
              labels:
                excluded_from_alerts: "true"
            spec:
              storageClassName: local-lvm
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 20Gi

    alertmanager:
      # Email via the in-cluster postfix relay (network/smtp-mail) is the audit
      # trail; Pushover pages the phone. Keys come from the alertmanager-notify
      # secret, mounted under /etc/alertmanager/secrets/.
      #
      # This replaces the chart's default config wholesale, so the inhibit
      # rules are reproduced here. Watchdog fires permanently by design: it goes
      # only to the external healthchecks.io dead-man's switch.
      config:
        global:
          resolve_timeout: 5m
          smtp_smarthost: smtp-mail.network.svc.cluster.local:587
          # The relay sets ALLOWED_SENDER_DOMAINS to ${EXTERNAL_DOMAIN}, so the
          # From address has to be in that domain or postfix rejects it.
          smtp_from: alertmanager@${EXTERNAL_DOMAIN}
          # No TLS on this hop. It is pod-to-pod inside the cluster, to a relay
          # that requires no authentication, so there is no credential to
          # protect and nothing is gained by encrypting it.
          #
          # The alternative was STARTTLS with verification skipped, which is
          # encryption that proves nothing about the peer — more moving parts
          # for no actual guarantee. Verified that the relay accepts cleartext
          # submission: a message sent with no STARTTLS went out as
          # dsn=2.0.0, status=sent.
          smtp_require_tls: false
        inhibit_rules:
          - source_matchers:
              - 'severity = critical'
            target_matchers:
              - 'severity =~ warning|info'
            equal: ['namespace', 'alertname']
          - source_matchers:
              - 'severity = warning'
            target_matchers:
              - 'severity = info'
            equal: ['namespace', 'alertname']
          - source_matchers:
              - 'alertname = InfoInhibitor'
            target_matchers:
              - 'severity = info'
            equal: ['namespace']
          - target_matchers:
              - 'alertname = InfoInhibitor'
          # A dropped airMAX link is the root cause; mute what it takes down with it.
          - source_matchers:
              - 'alertname = AirmaxLinkDown'
            target_matchers:
              - 'alertname =~ SNMPDeviceDown|AirmaxEthernet.*|AirmaxSignalWeak|AirmaxCapacityLow|AirmaxLinkQualityLow|AirmaxReconnected'
            equal: ['link']
          - source_matchers:
              - 'alertname = SNMPDeviceDown'
            target_matchers:
              - 'alertname = TargetDown'
            equal: ['job']
          # UniFi APs behind each link, by AP name.
          - source_matchers:
              - 'alertname =~ AirmaxLinkDown|SNMPDeviceDown'
              - 'link = sam'
            target_matchers:
              - 'alertname =~ Unifi.*'
              - 'name =~ Sam|Sam kitchen'
          - source_matchers:
              - 'alertname =~ AirmaxLinkDown|SNMPDeviceDown'
              - 'link = dad'
            target_matchers:
              - 'alertname =~ Unifi.*'
              - 'name = Dad'
        route:
          group_by: ['namespace', 'alertname']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: email
          routes:
            # Always first: Watchdog must never page. A missed ping raises the
            # alarm at healthchecks.io, so it also catches a dead cluster.
            - receiver: healthchecks
              matchers:
                - alertname = "Watchdog"
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 1m
            # Everything else is copied to Slack as history, then routed on.
            - receiver: slack
              matchers:
                - alertname != "Watchdog"
              continue: true
            - receiver: pager
              matchers:
                - severity = "critical"
              repeat_interval: 1h
            - receiver: pager
              matchers:
                - severity = "warning"
        receivers:
          - name: healthchecks
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-notify/healthchecks-url
                # A resolved Watchdog means Prometheus stopped; it must not ping.
                send_resolved: false
          - name: slack
            slack_configs:
              - api_url_file: /etc/alertmanager/secrets/alertmanager-notify/slack-webhook-url
                send_resolved: true
                color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'
                title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .Alerts | len }})'
                # Matches the email detail: summary, description, labels, and links.
                text: |-
                  {{ range .Alerts -}}
                  *{{ or .Annotations.summary .Labels.alertname }}*
                  {{ with .Annotations.description }}{{ . }}
                  {{ end -}}
                  {{ range .Labels.SortedPairs }}{{ if not (match "^(alertname|prometheus)$" .Name) }}`{{ .Name }}={{ .Value }}` {{ end }}{{ end }}
                  <{{ .GeneratorURL }}|Source>{{ with .Annotations.runbook_url }} · <{{ . }}|Runbook>{{ end }}

                  {{ end }}
          - name: pager
            email_configs:
              - to: jeffrey@${EXTERNAL_DOMAIN}
                send_resolved: true
                headers:
                  subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .Alerts | len }}) — home cluster'
            pushover_configs:
              - user_key_file: /etc/alertmanager/secrets/alertmanager-notify/pushover-user-key
                token_file: /etc/alertmanager/secrets/alertmanager-notify/pushover-token
                send_resolved: true
                title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .Alerts | len }})'
                # Emergency (repeats until acknowledged) only for firing criticals.
                priority: '{{ if and (eq .Status "firing") (eq .CommonLabels.severity "critical") }}2{{ else }}0{{ end }}'
                retry: 2m
                # Matches the critical repeat_interval, so a stale emergency dies first.
                expire: 1h
          - name: email
            email_configs:
              - to: jeffrey@${EXTERNAL_DOMAIN}
                send_resolved: true

                headers:
                  subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .Alerts | len }}) — home cluster'
        templates:
          - '/etc/alertmanager/config/*.tmpl'
      # Without an ingress and a matching externalUrl, every link in an alert
      # email pointed at http://kube-prometheus-stack-alertmanager.monitoring-system:9093
      # — a cluster-internal address that resolves nowhere from a phone or a
      # laptop. Same story for the "Source" link, which comes from Prometheus.
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd,monitoring-system-oauth2-signin@kubernetescrd,monitoring-system-oauth2-auth@kubernetescrd
        hosts:
          - alertmanager.${BASE_DOMAIN}
        paths:
          - /
        tls:
          - secretName: alertmanager-tls
            hosts:
              - alertmanager.${BASE_DOMAIN}
      alertmanagerSpec:
        externalUrl: https://alertmanager.${BASE_DOMAIN}
        secrets:
          - alertmanager-notify
        # Stays on Longhorn: 2Gi of low-churn data, and silences are worth
        # replicating.
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
      # Slack delivery is deliberately not wired up here yet: it needs a sops
      # secret holding the webhook URL. See the PR / issue for the snippet.

    grafana:
      # RWO volume: RollingUpdate deadlocks on multi-attach.
      deploymentStrategy:
        type: Recreate
      # Login is Authelia over OIDC (#3097). Grafana is the one app here that
      # can do this natively, and the reason to bother rather than put a proxy
      # in front: a proxy can only answer yes/no, while OIDC carries the group
      # claim, so Authelia's `admins` becomes a Grafana *role*.
      #
      # The local login form stays enabled on purpose, as break-glass for when
      # Authelia is the thing that is broken, which has already happened twice.
      # That only works if the admin password is not the chart default, so it
      # now comes from a secret too; leaving admin/prom-operator live would
      # have made the OIDC gate decorative.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      # Supplies GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET.
      envFromSecret: grafana-oidc
      # Infinity reads Alertmanager's API, the only source that knows about
      # silences; ALERTS in Prometheus and the alertmanager_alerts gauge don't.
      # Unpinned: pluginsAutoUpdate upgrades it anyway, and a pin made every
      # start downgrade then re-upgrade it mid datasource provisioning.
      plugins:
        - yesoreyeram-infinity-datasource
      additionalDataSources:
        - name: Alertmanager API
          type: yesoreyeram-infinity-datasource
          uid: alertmanager-api
          access: proxy
          url: http://kube-prometheus-stack-alertmanager.monitoring-system:9093
          jsonData:
            allowedHosts:
              - http://kube-prometheus-stack-alertmanager.monitoring-system:9093
      extraSecretMounts:
        # Grafana talks to Authelia over its real hostname, so it has to trust
        # the internal CA. Taken from the certificate this namespace already
        # holds for grafana.${BASE_DOMAIN}; only ca.crt is mounted, never the
        # private key.
        - name: internal-ca
          secretName: grafana-tls
          mountPath: /etc/ssl/internal
          readOnly: true
          defaultMode: 288
          items:
            - key: ca.crt
              path: ca.crt
      grafana.ini:
        # Grafana installs its preinstalled apps (the logs/metrics/traces
        # drilldowns) at runtime into the plugins dir, which here is the PVC,
        # and the installer skips anything already there -- so the version that
        # first landed is frozen across every Grafana upgrade. That left Logs
        # Drilldown on 1.0.41 from the 11.x era, reading React 18 internals
        # that React 19 removed, which crashed the page on drill-down. This
        # lets the update checker install the updates it already detects.
        feature_toggles:
          enable: pluginsAutoUpdate
        server:
          # The chart only sets `domain`, which leaves root_url at its default
          # of http://<domain>:3000/ : wrong scheme, wrong port. Grafana builds
          # its OIDC redirect_uri from this, so without it the callback goes to
          # a URL that does not exist.
          root_url: https://grafana.${BASE_DOMAIN}
        auth:
          # Not auto-login: that would redirect straight past the form and make
          # the break-glass account unreachable from a browser.
          oauth_auto_login: false
          signout_redirect_url: https://auth.${BASE_DOMAIN}/logout
        auth.generic_oauth:
          enabled: true
          name: Authelia
          icon: signin
          client_id: grafana
          scopes: openid profile email groups
          auth_url: https://auth.${BASE_DOMAIN}/api/oidc/authorization
          token_url: https://auth.${BASE_DOMAIN}/api/oidc/token
          api_url: https://auth.${BASE_DOMAIN}/api/oidc/userinfo
          tls_client_ca: /etc/ssl/internal/ca.crt
          use_pkce: true
          allow_sign_up: true
          # Authelia group -> Grafana role. This is the capability a proxy
          # cannot provide. Not strict, so someone in neither group still gets
          # in as a Viewer rather than being refused outright.
          # GrafanaAdmin, not Admin: the local account is server admin, so mapping
          # to org Admin alone left the Authelia login with fewer options than the
          # break-glass user it was meant to replace.
          allow_assign_grafana_admin: true
          role_attribute_path: "contains(groups[*], 'admins') && 'GrafanaAdmin' || 'Viewer'"
          role_attribute_strict: false
      # Stays on Longhorn for the same reason as Alertmanager — small, and it
      # holds hand-made dashboards until phase 4 provisions them from git.
      persistence:
        enabled: true
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        size: 2Gi
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        hosts:
          - grafana.${BASE_DOMAIN}
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.${BASE_DOMAIN}

    prometheus-node-exporter:
      # Rewrite instance from the scrape address to the node name, so panels,
      # tables and alert summaries read node1 or pi2 rather than
      # 192.168.10.161:9100. Every panel on the overview that shows instance is
      # node_* based, so this one relabel covers all of them.
      prometheus:
        monitor:
          relabelings:
            - action: replace
              sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: instance
      # Hardware metrics: hwmon temperatures, and fan RPM where the board
      # exposes one.
      extraArgs:
        - --collector.thermal_zone
        - --collector.hwmon
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
    # Flux 2.5 stopped exporting gotk_reconcile_condition and gotk_suspend_status
    # from the controllers -- helm-controller v1.2.0 serves only
    # gotk_reconcile_duration_seconds_*. That silently blanked every Flux alert
    # and dashboard panel here the moment the controllers rolled (#3307).
    # Upstream's replacement is this kube-state-metrics custom-resource config,
    # which rebuilds the same signal as gotk_resource_info{ready,stalled,suspended}.
    kube-state-metrics:
      # Feeds the upstream excluded_from_alerts opt-out in the PVC alerts.
      metricLabelsAllowlist:
        - persistentvolumeclaims=[excluded_from_alerts]
      rbac:
        # kube-state-metrics reads these through the apiserver, so it needs its
        # own grant -- the chart's built-in rules cover core resources only.
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
              - notification.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - ocirepositories
              - buckets
              - helmrepositories
              - helmcharts
              - kustomizations
              - helmreleases
              - alerts
              - providers
              - receivers
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        # Upstream's example pairs this with `collectors: []` and
        # `--custom-resource-state-only=true`. Both are deliberately omitted
        # here: they stop kube-state-metrics exporting kube_* at all, which
        # would take most of this stack's alerts and dashboards with it.
        #
        # Only the labels the alerts and the overview actually read are mapped.
        # `revision` is left out on purpose -- it changes on every commit, so it
        # would churn a new series per resource per deploy for no gain, and the
        # metric it replaces never carried it. image.toolkit.fluxcd.io is absent
        # because the image-automation controllers are not installed.
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Kustomization resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      stalled: [status, conditions, "[type=Stalled]", status]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRelease resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      stalled: [status, conditions, "[type=Stalled]", status]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux GitRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1beta2
                  kind: OCIRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux OCIRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: Bucket
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Bucket resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmChart resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1
                  kind: Receiver
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Receiver resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1beta3
                  kind: Alert
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Alert resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1beta3
                  kind: Provider
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Provider resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      suspended: [spec, suspend]
