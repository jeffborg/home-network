---
apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-config
  namespace: monitoring-system
data:
  snmp.yml: |
    modules:
      if_mib:
        walk:
          - 1.3.6.1.2.1.2.2.1.1  # ifIndex
          - 1.3.6.1.2.1.2.2.1.2  # ifDescr
          - 1.3.6.1.2.1.2.2.1.3  # ifType
          - 1.3.6.1.2.1.2.2.1.4  # ifMtu
          - 1.3.6.1.2.1.2.2.1.5  # ifSpeed
          - 1.3.6.1.2.1.2.2.1.6  # ifPhysAddress
          - 1.3.6.1.2.1.2.2.1.7  # ifAdminStatus
          - 1.3.6.1.2.1.2.2.1.8  # ifOperStatus
          - 1.3.6.1.2.1.2.2.1.10 # ifInOctets
          - 1.3.6.1.2.1.2.2.1.16 # ifOutOctets
          - 1.3.6.1.2.1.2.2.1.14 # ifInErrors
          - 1.3.6.1.2.1.2.2.1.20 # ifOutErrors
          - 1.3.6.1.2.1.2.2.1.15 # ifInDiscards
          - 1.3.6.1.2.1.2.2.1.19 # ifOutDiscards
        version: 2
        auth:
          community: public
        timeout: 15s
        retries: 3
      airmax:
        walk:
          - 1.3.6.1.2.1.2.2.1.1
          - 1.3.6.1.2.1.2.2.1.2
          - 1.3.6.1.2.1.2.2.1.7
          - 1.3.6.1.2.1.2.2.1.8
          - 1.3.6.1.2.1.2.2.1.10
          - 1.3.6.1.2.1.2.2.1.16
        version: 2
        auth:
          community: public
        timeout: 10s
        retries: 2
      ubiquiti_unifi:
        walk:
          - 1.3.6.1.2.1.1
          - 1.3.6.1.2.1.2
          - 1.3.6.1.4.1.41112
        get:
          - 1.3.6.1.2.1.1.1.0
          - 1.3.6.1.2.1.1.5.0
        metrics:
          - name: ifTable
            oid: 1.3.6.1.2.1.2.2
            type: gauge
            help: The interface table
        version: 2
        auth:
          community: public
        timeout: 10s
        retries: 3