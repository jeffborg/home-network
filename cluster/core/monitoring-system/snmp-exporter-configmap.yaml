---
apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-config
  namespace: monitoring-system
data:
  snmp.yml: |
    auths:
      public_v1:
        community: public
        version: 1
    modules:
      if_mib:
        walk:
          - 1.3.6.1.2.1.2.2.1.1
          - 1.3.6.1.2.1.2.2.1.2
          - 1.3.6.1.2.1.2.2.1.3
          - 1.3.6.1.2.1.2.2.1.4
          - 1.3.6.1.2.1.2.2.1.5
          - 1.3.6.1.2.1.2.2.1.6
          - 1.3.6.1.2.1.2.2.1.7
          - 1.3.6.1.2.1.2.2.1.8
          - 1.3.6.1.2.1.2.2.1.10
          - 1.3.6.1.2.1.2.2.1.16
          - 1.3.6.1.2.1.2.2.1.14
          - 1.3.6.1.2.1.2.2.1.20
          - 1.3.6.1.2.1.2.2.1.15
          - 1.3.6.1.2.1.2.2.1.19
        metrics:
          - name: ifIndex
            oid: 1.3.6.1.2.1.2.2.1.1
            type: gauge
            help: Interface index
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: gauge
            help: Interface description
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifType
            oid: 1.3.6.1.2.1.2.2.1.3
            type: gauge
            help: Interface type
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifMtu
            oid: 1.3.6.1.2.1.2.2.1.4
            type: gauge
            help: Interface MTU
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifSpeed
            oid: 1.3.6.1.2.1.2.2.1.5
            type: gauge
            help: Interface speed
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
          - name: ifPhysAddress
            oid: 1.3.6.1.2.1.2.2.1.6
            type: gauge
            help: Interface physical address
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifAdminStatus
            oid: 1.3.6.1.2.1.2.2.1.7
            type: gauge
            help: Interface admin status
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifOperStatus
            oid: 1.3.6.1.2.1.2.2.1.8
            type: gauge
            help: Interface operational status
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifInOctets
            oid: 1.3.6.1.2.1.2.2.1.10
            type: counter
            help: Inbound octets
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
          - name: ifInUcastPkts
            oid: 1.3.6.1.2.1.2.2.1.11
            type: counter
            help: Inbound unicast packets
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifInDiscards
            oid: 1.3.6.1.2.1.2.2.1.13
            type: counter
            help: Inbound discards
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
          - name: ifInErrors
            oid: 1.3.6.1.2.1.2.2.1.14
            type: counter
            help: Inbound errors
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
          - name: ifOutOctets
            oid: 1.3.6.1.2.1.2.2.1.16
            type: counter
            help: Outbound octets
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
          - name: ifOutUcastPkts
            oid: 1.3.6.1.2.1.2.2.1.17
            type: counter
            help: Outbound unicast packets
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifOutDiscards
            oid: 1.3.6.1.2.1.2.2.1.19
            type: counter
            help: Outbound discards
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
          - name: ifOutErrors
            oid: 1.3.6.1.2.1.2.2.1.20
            type: counter
            help: Outbound errors
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
        timeout: 30s
        retries: 5
      airmax:
        get:
          - 1.3.6.1.2.1.1.1.0
          - 1.3.6.1.2.1.1.5.0
          - 1.3.6.1.2.1.2.2.1.5.2
          - 1.3.6.1.2.1.2.2.1.10.2
          - 1.3.6.1.2.1.2.2.1.16.2
        walk:
          - 1.3.6.1.2.1.2.2.1.1
          - 1.3.6.1.2.1.2.2.1.2
        metrics:
          - name: ifIndex
            oid: 1.3.6.1.2.1.2.2.1.1
            type: gauge
            help: Interface index
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifSpeed
            oid: 1.3.6.1.2.1.2.2.1.5
            type: gauge
            help: Interface speed
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
          - name: ifInOctets
            oid: 1.3.6.1.2.1.2.2.1.10
            type: counter
            help: Inbound octets
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
          - name: ifOutOctets
            oid: 1.3.6.1.2.1.2.2.1.16
            type: counter
            help: Outbound octets
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
        timeout: 30s
        retries: 5
      ubiquiti_unifi:
        walk:
          - 1.3.6.1.2.1.1
          - 1.3.6.1.2.1.2
          - 1.3.6.1.4.1.41112
        get:
          - 1.3.6.1.2.1.1.1.0
          - 1.3.6.1.2.1.1.5.0
        metrics:
          - name: ifTable
            oid: 1.3.6.1.2.1.2.2
            type: gauge
            help: The interface table
        timeout: 10s
        retries: 3