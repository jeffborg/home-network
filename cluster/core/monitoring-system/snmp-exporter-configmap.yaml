---
apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-config
  namespace: monitoring-system
data:
  snmp.yml: |
    auths:
      public_v1:
        community: public
        version: 1
      public_v2:
        community: public
        version: 2
    modules:
      if_mib:
        walk:
          - 1.3.6.1.2.1.2.2.1.1
          - 1.3.6.1.2.1.2.2.1.2
          - 1.3.6.1.2.1.2.2.1.3
          - 1.3.6.1.2.1.2.2.1.4
          - 1.3.6.1.2.1.2.2.1.5
          - 1.3.6.1.2.1.2.2.1.6
          - 1.3.6.1.2.1.2.2.1.7
          - 1.3.6.1.2.1.2.2.1.8
          - 1.3.6.1.2.1.2.2.1.10
          - 1.3.6.1.2.1.2.2.1.16
          - 1.3.6.1.2.1.2.2.1.14
          - 1.3.6.1.2.1.2.2.1.20
          - 1.3.6.1.2.1.2.2.1.15
          - 1.3.6.1.2.1.2.2.1.19
        metrics:
          - name: ifIndex
            oid: 1.3.6.1.2.1.2.2.1.1
            type: gauge
            help: Interface index
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: gauge
            help: Interface description
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifType
            oid: 1.3.6.1.2.1.2.2.1.3
            type: gauge
            help: Interface type
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifMtu
            oid: 1.3.6.1.2.1.2.2.1.4
            type: gauge
            help: Interface MTU
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifSpeed
            oid: 1.3.6.1.2.1.2.2.1.5
            type: gauge
            help: Interface speed
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
          - name: ifPhysAddress
            oid: 1.3.6.1.2.1.2.2.1.6
            type: gauge
            help: Interface physical address
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifAdminStatus
            oid: 1.3.6.1.2.1.2.2.1.7
            type: gauge
            help: Interface admin status
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifOperStatus
            oid: 1.3.6.1.2.1.2.2.1.8
            type: gauge
            help: Interface operational status
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifInOctets
            oid: 1.3.6.1.2.1.2.2.1.10
            type: counter
            help: Inbound octets
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
          - name: ifInUcastPkts
            oid: 1.3.6.1.2.1.2.2.1.11
            type: counter
            help: Inbound unicast packets
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifInDiscards
            oid: 1.3.6.1.2.1.2.2.1.13
            type: counter
            help: Inbound discards
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
          - name: ifInErrors
            oid: 1.3.6.1.2.1.2.2.1.14
            type: counter
            help: Inbound errors
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
          - name: ifOutOctets
            oid: 1.3.6.1.2.1.2.2.1.16
            type: counter
            help: Outbound octets
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
          - name: ifOutUcastPkts
            oid: 1.3.6.1.2.1.2.2.1.17
            type: counter
            help: Outbound unicast packets
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifOutDiscards
            oid: 1.3.6.1.2.1.2.2.1.19
            type: counter
            help: Outbound discards
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
          - name: ifOutErrors
            oid: 1.3.6.1.2.1.2.2.1.20
            type: counter
            help: Outbound errors
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
        # Per packet, not per scrape: a dropped UDP reply is retried after 2s,
        # not left to hang past Prometheus's scrape timeout.
        timeout: 2s
        retries: 5
      # POWER-ETHERNET-MIB (RFC 3621).
      poe:
        walk:
          - 1.3.6.1.2.1.105.1.1.1.6
          - 1.3.6.1.2.1.105.1.3.1.1.2
          - 1.3.6.1.2.1.105.1.3.1.1.4
        metrics:
          - name: pethPsePortDetectionStatus
            oid: 1.3.6.1.2.1.105.1.1.1.6
            type: gauge
            help: PoE detection status (1 disabled, 2 searching, 3 delivering, 4 fault, 5 test, 6 other fault)
            indexes:
              - labelname: pethPsePortGroupIndex
                type: Integer
              - labelname: pethPsePortIndex
                type: Integer
          - name: pethMainPsePower
            oid: 1.3.6.1.2.1.105.1.3.1.1.2
            type: gauge
            help: PSE nominal power budget in watts
            indexes:
              - labelname: pethMainPseGroupIndex
                type: Integer
          - name: pethMainPseConsumptionPower
            oid: 1.3.6.1.2.1.105.1.3.1.1.4
            type: gauge
            help: PSE power drawn in watts
            indexes:
              - labelname: pethMainPseGroupIndex
                type: Integer
        timeout: 2s
        retries: 5
      # ifXTable: 64-bit counters (SNMPv2c only) and port names.
      if_x:
        walk:
          - 1.3.6.1.2.1.31.1.1.1.6
          - 1.3.6.1.2.1.31.1.1.1.10
          - 1.3.6.1.2.1.31.1.1.1.18
        metrics:
          - name: ifAlias
            oid: 1.3.6.1.2.1.31.1.1.1.18
            type: DisplayString
            help: Interface name set on the device
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifHCInOctets
            oid: 1.3.6.1.2.1.31.1.1.1.6
            type: counter
            help: Inbound octets (64-bit)
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifHCOutOctets
            oid: 1.3.6.1.2.1.31.1.1.1.10
            type: counter
            help: Outbound octets (64-bit)
            indexes:
              - labelname: ifIndex
                type: Integer
        timeout: 2s
        retries: 5
      # LLDP-MIB remote systems: one series per neighbour, value 1.
      lldp:
        walk:
          - 1.0.8802.1.1.2.1.4.1.1.9
          - 1.0.8802.1.1.2.1.4.1.1.10
        metrics:
          - name: lldpRemSysName
            oid: 1.0.8802.1.1.2.1.4.1.1.9
            type: DisplayString
            help: LLDP neighbour system name
            indexes: &lldp_rem_indexes
              - labelname: lldpRemTimeMark
                type: Integer
              - labelname: lldpRemLocalPortNum
                type: Integer
              - labelname: lldpRemIndex
                type: Integer
          - name: lldpRemSysDesc
            oid: 1.0.8802.1.1.2.1.4.1.1.10
            type: DisplayString
            help: LLDP neighbour system description
            indexes: *lldp_rem_indexes
        timeout: 2s
        retries: 5
      # ARP cache of the routed VLAN interfaces (one series per IP, value 1), plus
      # the switch's own interface IPs to map each entry back to its VLAN; the
      # ARP ifIndex can't be used for that, it packs the port into the high bits.
      arp:
        walk:
          - 1.3.6.1.2.1.4.20.1.2
          - 1.3.6.1.2.1.4.22.1.2
        metrics:
          - name: ipAdEntIfIndex
            oid: 1.3.6.1.2.1.4.20.1.2
            type: gauge
            help: ifIndex owning one of the switch's own IP addresses
            indexes:
              - labelname: ipAdEntAddr
                type: InetAddressIPv4
          - name: ipNetToMediaPhysAddress
            oid: 1.3.6.1.2.1.4.22.1.2
            type: PhysAddress48
            help: MAC address for an IP in the ARP cache
            indexes:
              - labelname: ipNetToMediaIfIndex
                type: Integer
              - labelname: ipNetToMediaNetAddress
                type: InetAddressIPv4
        timeout: 2s
        retries: 5
      # Q-BRIDGE-MIB forwarding table: one series per learned MAC, value =
      # bridge port (equal to ifIndex on this switch; 0 = the switch itself).
      fdb:
        walk:
          - 1.3.6.1.2.1.17.7.1.2.2.1.2
        metrics:
          - name: dot1qTpFdbPort
            oid: 1.3.6.1.2.1.17.7.1.2.2.1.2
            type: gauge
            help: Bridge port a MAC was learned on
            indexes:
              - labelname: dot1qFdbId
                type: Integer
              - labelname: dot1qTpFdbAddress
                type: PhysAddress48
        timeout: 2s
        retries: 5
      airmax:
        get:
          - 1.3.6.1.2.1.1.1.0
          - 1.3.6.1.2.1.1.5.0
          - 1.3.6.1.2.1.2.2.1.5.2
          - 1.3.6.1.2.1.2.2.1.10.2
          - 1.3.6.1.2.1.2.2.1.16.2
        walk:
          - 1.3.6.1.2.1.2.2.1.1
          - 1.3.6.1.2.1.2.2.1.2
        metrics:
          - name: ifIndex
            oid: 1.3.6.1.2.1.2.2.1.1
            type: gauge
            help: Interface index
            indexes:
              - labelname: ifIndex
                type: Integer
          - name: ifSpeed
            oid: 1.3.6.1.2.1.2.2.1.5
            type: gauge
            help: Interface speed
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
          - name: ifInOctets
            oid: 1.3.6.1.2.1.2.2.1.10
            type: counter
            help: Inbound octets
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
          - name: ifOutOctets
            oid: 1.3.6.1.2.1.2.2.1.16
            type: counter
            help: Outbound octets
            indexes:
              - labelname: ifIndex
                type: Integer
            lookups:
              - labels:
                  - ifIndex
                labelname: ifDescr
                oid: 1.3.6.1.2.1.2.2.1.2
                type: DisplayString
        timeout: 2s
        retries: 5
      ubiquiti_unifi:
        walk:
          - 1.3.6.1.2.1.1
          - 1.3.6.1.2.1.2
          - 1.3.6.1.4.1.41112
        get:
          - 1.3.6.1.2.1.1.1.0
          - 1.3.6.1.2.1.1.5.0
        metrics:
          - name: ifTable
            oid: 1.3.6.1.2.1.2.2
            type: gauge
            help: The interface table
        timeout: 10s
        retries: 3