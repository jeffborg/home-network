---
# A second Alloy, dedicated to receiving syslog from devices on the LAN that
# cannot ship logs any other way, and forwarding them into the existing Loki.
#
# Separate release rather than extra listeners on the node-log DaemonSet, for
# two reasons. A DaemonSet behind a LoadBalancer gives six listeners and
# non-deterministic routing, where syslog wants exactly one endpoint. And the
# node-log pipeline is load-bearing for every pod in the cluster -- a bad
# listener config here should not be able to stop it.
#
# The LoadBalancer is a hand-written Service in syslog-service.yaml, not this
# chart's. The chart's Service also carries the Alloy UI port, which has no
# business being reachable from the LAN.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-syslog
  namespace: monitoring-system
spec:
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://grafana.github.io/helm-charts
      chart: alloy
      version: 1.16.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      # One receiver, not one per node: the Service has a single external
      # address and the senders each point at exactly that.
      type: deployment
      replicas: 1
    alloy:
      # No call-home.
      enableReporting: false
      # Nothing here is a tailed file, so no positions to persist and no
      # storage mount -- unlike the node-log release.
      clustering:
        enabled: false
      # Declared so the pod advertises the listeners; 1514 rather than 514
      # because binding below 1024 would need NET_BIND_SERVICE. The Service
      # publishes the privileged port and maps it here, so senders that cannot
      # change their destination port still work.
      # Needed for the receivers below: otelcol.receiver.syslog is
      # public-preview and otelcol.receiver.tcplog is experimental, and the
      # level is process-wide. Contained to this release -- the node-log
      # DaemonSet is a separate one and stays generally-available.
      stabilityLevel: experimental
      extraPorts:
        - name: syslog-udp
          port: 1514
          targetPort: 1514
          protocol: UDP
        - name: syslog-tcp
          port: 1514
          targetPort: 1514
          protocol: TCP
        - name: siem-tcp
          port: 1601
          targetPort: 1601
          protocol: TCP
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      configMap:
        content: |-
          // Three entry points, one instance:
          //   udp/1514  syslog from the LAN devices (the main drain)
          //   tcp/1514  same, for senders that prefer a stream
          //   tcp/1601  the gateway's SIEM export, which is JSON and not syslog
          //
          // This replaces loki.source.syslog. That component parses the header
          // and then DISCARDS it: the __syslog_* labels it documents are
          // stripped before anything downstream sees them, so loki.relabel
          // cannot promote them. Verified by attaching loki.echo directly to
          // the source -- only the static labels arrive, and the entry is the
          // message body with the header already gone, so it cannot be
          // recovered later either. Every device landed in one unidentifiable
          // stream.
          //
          // otelcol.receiver.syslog keeps the parsed fields as attributes,
          // which is the whole reason for the switch.
          //
          // UDP and TCP need SEPARATE receivers. With both a `udp` and a `tcp`
          // block in one receiver only the TCP socket binds -- the UDP half
          // silently does not listen, which would have dropped every device.
          otelcol.receiver.syslog "lan_udp" {
            protocol = "rfc3164"
            udp {
              listen_address = "0.0.0.0:1514"
            }
            output {
              logs = [otelcol.processor.attributes.syslog.input]
            }
          }

          otelcol.receiver.syslog "lan_tcp" {
            protocol = "rfc3164"
            tcp {
              listen_address = "0.0.0.0:1514"
            }
            output {
              logs = [otelcol.processor.attributes.syslog.input]
            }
          }

          // Raw newline-delimited lines, no syslog framing. The gateway's SIEM
          // export sends JSON, which a syslog parser rejects outright
          // ("invalid or unsupported framing. first byte: '{'").
          otelcol.receiver.tcplog "siem" {
            listen_address = "0.0.0.0:1601"
            output {
              logs = [otelcol.processor.attributes.siem.input]
            }
          }

          // loki.attribute.labels is what promotes attributes to Loki labels.
          // hostname is the one that matters -- it is how ten devices on one
          // endpoint are told apart. Message content is never a label.
          //
          // loki.format = raw emits the log line as the body rather than a
          // JSON envelope of the whole record.
          otelcol.processor.attributes "syslog" {
            action {
              key    = "job"
              action = "insert"
              value  = "syslog"
            }
            action {
              key    = "loki.attribute.labels"
              action = "insert"
              value  = "job,hostname,facility_text"
            }
            action {
              key    = "loki.format"
              action = "insert"
              value  = "raw"
            }
            output {
              logs = [otelcol.processor.transform.receive_time.input]
            }
          }

          otelcol.processor.attributes "siem" {
            action {
              key    = "job"
              action = "insert"
              value  = "siem"
            }
            action {
              key    = "loki.attribute.labels"
              action = "insert"
              value  = "job"
            }
            action {
              key    = "loki.format"
              action = "insert"
              value  = "raw"
            }
            output {
              logs = [otelcol.processor.transform.receive_time.input]
            }
          }

          // Use receive time, not the sender's.
          //
          // Not a preference -- without it Loki rejects everything. RFC3164
          // carries no year and no timezone, so a device sending local time has
          // it parsed as UTC and lands hours in the future:
          //
          //   has timestamp too new: ... (400, batch dropped)
          //
          // Also rewrites the body to the parsed message, so a line reads
          // "port 3 link down" instead of repeating the whole frame. Guarded
          // because the SIEM stream has no `message` attribute.
          otelcol.processor.transform "receive_time" {
            error_mode = "ignore"
            log_statements {
              context = "log"
              statements = [
                "set(time, observed_time)",
                "set(body, attributes[\"message\"]) where attributes[\"message\"] != nil",
              ]
            }
            output {
              logs = [otelcol.processor.batch.default.input]
            }
          }

          otelcol.processor.batch "default" {
            output {
              logs = [otelcol.exporter.loki.default.input]
            }
          }

          otelcol.exporter.loki "default" {
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring-system.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
