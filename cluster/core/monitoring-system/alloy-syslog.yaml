---
# A second Alloy, dedicated to receiving syslog from devices on the LAN that
# cannot ship logs any other way, and forwarding them into the existing Loki.
#
# Separate release rather than extra listeners on the node-log DaemonSet, for
# two reasons. A DaemonSet behind a LoadBalancer gives six listeners and
# non-deterministic routing, where syslog wants exactly one endpoint. And the
# node-log pipeline is load-bearing for every pod in the cluster -- a bad
# listener config here should not be able to stop it.
#
# The LoadBalancer is a hand-written Service in syslog-service.yaml, not this
# chart's. The chart's Service also carries the Alloy UI port, which has no
# business being reachable from the LAN.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-syslog
  namespace: monitoring-system
spec:
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://grafana.github.io/helm-charts
      chart: alloy
      version: 1.16.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      # One receiver, not one per node: the Service has a single external
      # address and the senders each point at exactly that.
      type: deployment
      replicas: 1
    alloy:
      # No call-home.
      enableReporting: false
      # Nothing here is a tailed file, so no positions to persist and no
      # storage mount -- unlike the node-log release.
      clustering:
        enabled: false
      # Declared so the pod advertises the listeners; 1514 rather than 514
      # because binding below 1024 would need NET_BIND_SERVICE. The Service
      # publishes the privileged port and maps it here, so senders that cannot
      # change their destination port still work.
      # Needed for the receivers below: otelcol.receiver.syslog is
      # public-preview and otelcol.receiver.tcplog is experimental, and the
      # level is process-wide. Contained to this release -- the node-log
      # DaemonSet is a separate one and stays generally-available.
      stabilityLevel: experimental
      extraPorts:
        - name: syslog-udp
          port: 1514
          targetPort: 1514
          protocol: UDP
        - name: syslog-tcp
          port: 1514
          targetPort: 1514
          protocol: TCP
        - name: siem-tcp
          port: 1601
          targetPort: 1601
          protocol: TCP
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      configMap:
        content: |-
          // Three entry points, one instance:
          //   udp/1514  syslog from the LAN devices (the main drain)
          //   tcp/1514  same, for senders that prefer a stream
          //   tcp/1601  raw lines, for a sender that is not syslog at all
          //
          // The gateway's SIEM export turned out to arrive on udp/1514, as CEF
          // carried over RFC3164 without a <PRI>. tcp/1601 stays for the JSON form
          // seen once ("invalid or unsupported framing. first byte: '{'"), but has
          // received nothing since.
          //
          // This replaces loki.source.syslog. That component parses the header
          // and then DISCARDS it: the __syslog_* labels it documents are
          // stripped before anything downstream sees them, so loki.relabel
          // cannot promote them. Verified by attaching loki.echo directly to
          // the source -- only the static labels arrive, and the entry is the
          // message body with the header already gone, so it cannot be
          // recovered later either. Every device landed in one unidentifiable
          // stream.
          //
          // otelcol.receiver.syslog keeps the parsed fields as attributes,
          // which is the whole reason for the switch.
          //
          // UDP and TCP need SEPARATE receivers. With both a `udp` and a `tcp`
          // block in one receiver only the TCP socket binds -- the UDP half
          // silently does not listen, which would have dropped every device.
          otelcol.receiver.syslog "lan_udp" {
            protocol = "rfc3164"
            // Two senders on this drain cannot be parsed and cannot be fixed at
            // source: an access point duplicates every kernel line as fragments with
            // a non-syslog prefix, and the switch sends uptime where a timestamp
            // belongs. The parser logged ~29 errors a minute for them -- ~42k lines a
            // day of known, unactionable noise, which the node-log DaemonSet then
            // ships into Loki as well.
            //
            // send_quiet keeps the default behaviour of forwarding the entry (so the
            // switch keeps its recovered level and the AP keeps its real lines) and
            // only stops the logging. Measured: 15 error lines -> 0, with all 18 test
            // records still delivered.
            //
            // The trade-off is that a NEW malformed sender no longer announces itself
            // in the log. That is an acceptable swap because the entries themselves are
            // the better signal anyway -- an unparsed entry arrives with no hostname,
            // so `{job="syslog", hostname=""}` lists every sender in this state and
            // names it by source_ip, which the log line never did.
            on_error = "send_quiet"
            // Both senders on this drain omit the <PRI> header: the gateway's CEF
            // export and an access point's kernel log. Without this the parser fails
            // with "expecting a priority value within angle brackets" and then
            // forwards the entry anyway (action=send), so nothing was lost but
            // nothing was labelled either -- no hostname, no facility -- and it cost
            // ~12k error lines an hour. Compliant senders are unaffected; this only
            // permits the header to be absent. Severity and facility are genuinely
            // unavailable for those two, so facility_text is empty for them.
            allow_skip_pri_header = true
            udp {
              listen_address = "0.0.0.0:1514"
              // Adds net.peer.* -- the sender's address. Without it there is no
              // way to tell apart senders that omit a hostname, and no way to
              // identify a device sending malformed lines, since the parse
              // error does not name the source.
              add_attributes = true
            }
            output {
              logs = [otelcol.processor.attributes.syslog.input]
            }
          }

          otelcol.receiver.syslog "lan_tcp" {
            protocol = "rfc3164"
            // Two senders on this drain cannot be parsed and cannot be fixed at
            // source: an access point duplicates every kernel line as fragments with
            // a non-syslog prefix, and the switch sends uptime where a timestamp
            // belongs. The parser logged ~29 errors a minute for them -- ~42k lines a
            // day of known, unactionable noise, which the node-log DaemonSet then
            // ships into Loki as well.
            //
            // send_quiet keeps the default behaviour of forwarding the entry (so the
            // switch keeps its recovered level and the AP keeps its real lines) and
            // only stops the logging. Measured: 15 error lines -> 0, with all 18 test
            // records still delivered.
            //
            // The trade-off is that a NEW malformed sender no longer announces itself
            // in the log. That is an acceptable swap because the entries themselves are
            // the better signal anyway -- an unparsed entry arrives with no hostname,
            // so `{job="syslog", hostname=""}` lists every sender in this state and
            // names it by source_ip, which the log line never did.
            on_error = "send_quiet"
            // Both senders on this drain omit the <PRI> header: the gateway's CEF
            // export and an access point's kernel log. Without this the parser fails
            // with "expecting a priority value within angle brackets" and then
            // forwards the entry anyway (action=send), so nothing was lost but
            // nothing was labelled either -- no hostname, no facility -- and it cost
            // ~12k error lines an hour. Compliant senders are unaffected; this only
            // permits the header to be absent. Severity and facility are genuinely
            // unavailable for those two, so facility_text is empty for them.
            allow_skip_pri_header = true
            tcp {
              listen_address = "0.0.0.0:1514"
              // Adds net.peer.* -- the sender's address. Without it there is no
              // way to tell apart senders that omit a hostname, and no way to
              // identify a device sending malformed lines, since the parse
              // error does not name the source.
              add_attributes = true
            }
            output {
              logs = [otelcol.processor.attributes.syslog.input]
            }
          }

          // Raw newline-delimited lines, no syslog framing. The gateway's SIEM
          // export sends JSON, which a syslog parser rejects outright
          // ("invalid or unsupported framing. first byte: '{'").
          otelcol.receiver.tcplog "siem" {
            listen_address = "0.0.0.0:1601"
            output {
              logs = [otelcol.processor.attributes.siem.input]
            }
          }

          // loki.attribute.labels is what promotes attributes to Loki labels.
          // hostname is the one that matters -- it is how ten devices on one
          // endpoint are told apart. Message content is never a label.
          //
          // loki.format = raw emits the log line as the body rather than a
          // JSON envelope of the whole record.
          otelcol.processor.attributes "syslog" {
            // net.peer.ip -> source_ip. The rename is required, not cosmetic:
            // a Loki label name cannot contain dots, so the attribute cannot be
            // promoted under its own name.
            action {
              key            = "source_ip"
              action         = "insert"
              from_attribute = "net.peer.ip"
            }
            // The rest of what add_attributes brings is noise here. net.peer.name
            // in particular is a reverse-DNS lookup of every sender, which is a
            // dependency this has no reason to take on.
            action {
              key    = "net.peer.ip"
              action = "delete"
            }
            action {
              key    = "net.peer.name"
              action = "delete"
            }
            action {
              key    = "net.peer.port"
              action = "delete"
            }
            action {
              key    = "net.host.ip"
              action = "delete"
            }
            action {
              key    = "net.host.name"
              action = "delete"
            }
            action {
              key    = "net.host.port"
              action = "delete"
            }
            action {
              key    = "net.transport"
              action = "delete"
            }
            action {
              key    = "job"
              action = "insert"
              value  = "syslog"
            }
            action {
              key    = "loki.attribute.labels"
              action = "insert"
              value  = "job,hostname,facility_text,source_ip,format,cef_name,cef_class_id,cef_severity"
            }
            action {
              key    = "loki.format"
              action = "insert"
              value  = "raw"
            }
            output {
              logs = [otelcol.processor.transform.receive_time.input]
            }
          }

          otelcol.processor.attributes "siem" {
            action {
              key    = "job"
              action = "insert"
              value  = "siem"
            }
            action {
              key    = "loki.attribute.labels"
              action = "insert"
              value  = "job"
            }
            action {
              key    = "loki.format"
              action = "insert"
              value  = "raw"
            }
            output {
              logs = [otelcol.processor.transform.receive_time.input]
            }
          }

          // Use receive time, not the sender's.
          //
          // Not a preference -- without it Loki rejects everything. RFC3164
          // carries no year and no timezone, so a device sending local time has
          // it parsed as UTC and lands hours in the future:
          //
          //   has timestamp too new: ... (400, batch dropped)
          //
          // Also rewrites the body to the parsed message, so a line reads
          // "port 3 link down" instead of repeating the whole frame. Guarded
          // because the SIEM stream has no `message` attribute.
          otelcol.processor.transform "receive_time" {
            error_mode = "ignore"
            log_statements {
              context = "log"
              statements = [
                "set(log.time, log.observed_time)",
                "set(log.body, log.attributes[\"message\"]) where log.attributes[\"message\"] != nil",
                // The CEF header, per the ArcSight CEF implementation standard:
                //
                //   CEF:Version|Vendor|Product|Version|ClassID|Name|Severity|Extensions
                //
                // Parsed with a regex rather than by splitting on "|", because the
                // standard escapes a literal pipe inside a header field as \| -- and a
                // split then shifts every field after it with no error at all. A product
                // of "UniFi\|Net" puts the class id where the event name should be.
                // Hence (?:\\.|[^|\\])* per field, which consumes escape pairs.
                //
                // ClassID is the stable machine id for an event (401); Name is display
                // text that can change between firmware versions, so both are kept.
                // Severity stays a string -- the standard permits 0-10 or one of
                // Low/Medium/High/Very-High.
                //
                // The extensions are deliberately not parsed. They are standard
                // key=value pairs and could be, but they carry client MACs, IPs and byte
                // counts, none of which belong in an index. The readable text is in
                // msg=, which a query can pull out when it wants it.
                "set(log.cache[\"cef\"], ExtractPatterns(log.body, \"^CEF:(?P<cef_version>\\\\d+)\\\\|(?:\\\\\\\\.|[^|\\\\\\\\])*\\\\|(?:\\\\\\\\.|[^|\\\\\\\\])*\\\\|(?:\\\\\\\\.|[^|\\\\\\\\])*\\\\|(?P<cef_class_id>(?:\\\\\\\\.|[^|\\\\\\\\])*)\\\\|(?P<cef_name>(?:\\\\\\\\.|[^|\\\\\\\\])*)\\\\|(?P<cef_severity>(?:\\\\\\\\.|[^|\\\\\\\\])*)\\\\|\"))",
                "set(log.attributes[\"format\"], \"cef\") where log.cache[\"cef\"][\"cef_name\"] != nil",
                "set(log.attributes[\"cef_name\"], log.cache[\"cef\"][\"cef_name\"]) where log.cache[\"cef\"][\"cef_name\"] != nil",
                "set(log.attributes[\"cef_class_id\"], log.cache[\"cef\"][\"cef_class_id\"]) where log.cache[\"cef\"][\"cef_class_id\"] != nil",
                "set(log.attributes[\"cef_severity\"], log.cache[\"cef\"][\"cef_severity\"]) where log.cache[\"cef\"][\"cef_severity\"] != nil",
                // Senders whose <PRI> is valid but whose header defeats the parser.
                // An old switch sends uptime ("02:22:21:28") where RFC3164 wants a
                // timestamp, and no hostname at all, so the entry is forwarded raw with
                // the <PRI> still on the front of the body. The level is recoverable
                // from it even though the timestamp and hostname are not -- and
                // receive-time is the better clock anyway.
                //
                // Scoped to job=syslog on purpose. This transform is shared with the
                // raw tcplog receiver, and these statements are the only ones that
                // REWRITE the body rather than only adding attributes -- stripping bytes
                // off a line delivered to a raw endpoint would defeat the point of
                // having one. Guarding the first statement is enough: every statement
                // after it keys off the cache this sets.
                //
                // The IsMatch guard is not redundant with ExtractPatterns: on a body with
                // no <PRI> that converter returns an EMPTY MAP, and indexing it raises
                // "key not found in map" -- which error_mode=ignore swallows but still
                // logs, once per entry. Since most entries parse fine and have had their
                // PRI consumed, that was ~170 warn lines a minute for nothing. Testing it
                // first means the converter only runs where it can succeed.
                //
                // Also self-guarding: a successfully parsed entry has had its <PRI>
                // consumed, so this only matches entries that failed.
                //
                // severity = pri mod 8. OTTL has no modulo operator, hence n - 8*Int(n/8),
                // which works because Int() truncates. facility (Int(n/8)) is deliberately
                // not turned into facility_text: that needs a 24-entry lookup for a name
                // nothing is filtering on.
                "set(log.cache[\"pri\"], ExtractPatterns(log.body, \"^<(?P<p>[0-9]{1,3})>\")[\"p\"]) where log.attributes[\"job\"] == \"syslog\" and IsMatch(log.body, \"^<[0-9]{1,3}>\")",
                "set(log.cache[\"n\"], Int(log.cache[\"pri\"])) where log.cache[\"pri\"] != nil",
                "set(log.cache[\"sev\"], log.cache[\"n\"] - 8 * Int(log.cache[\"n\"] / 8)) where log.cache[\"n\"] != nil",
                // emerg, alert and crit collapse to fatal; notice reads as info.
                "set(log.severity_text, \"fatal\") where log.cache[\"sev\"] != nil and log.cache[\"sev\"] < 3",
                "set(log.severity_text, \"error\") where log.cache[\"sev\"] == 3",
                "set(log.severity_text, \"warn\")  where log.cache[\"sev\"] == 4",
                "set(log.severity_text, \"info\")  where log.cache[\"sev\"] != nil and log.cache[\"sev\"] > 4 and log.cache[\"sev\"] < 7",
                "set(log.severity_text, \"debug\") where log.cache[\"sev\"] == 7",
                // once decoded the <PRI> is just noise on the front of the line
                "replace_pattern(log.body, \"^<[0-9]{1,3}>\", \"\") where log.cache[\"pri\"] != nil",
                // CEF severity -> log level, so Grafana colours and filters these like
                // any other log. The standard defines severity as 0-10 OR one of
                // Low/Medium/High/Very-High, with 0-3 low, 4-6 medium, 7-8 high and
                // 9-10 very high; both spellings are matched in one pattern each.
                //
                // severity_text is what matters: the Loki exporter turns it into the
                // `level` label and Loki derives detected_level from that. Without it
                // every CEF event reads detected_level=unknown. severity_number is set
                // alongside because it is the field OTel consumers expect.
                "set(log.severity_text, \"info\")     where IsMatch(log.attributes[\"cef_severity\"], \"^([0-3]|Low)$\")",
                "set(log.severity_text, \"warn\")     where IsMatch(log.attributes[\"cef_severity\"], \"^([4-6]|Medium)$\")",
                "set(log.severity_text, \"error\")    where IsMatch(log.attributes[\"cef_severity\"], \"^([78]|High)$\")",
                "set(log.severity_text, \"fatal\")    where IsMatch(log.attributes[\"cef_severity\"], \"^(9|10|Very-High)$\")",
                "set(log.severity_number, SEVERITY_NUMBER_DEBUG) where log.severity_text == \"debug\"",
                "set(log.severity_number, SEVERITY_NUMBER_INFO)  where log.severity_text == \"info\"",
                "set(log.severity_number, SEVERITY_NUMBER_WARN)  where log.severity_text == \"warn\"",
                "set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.severity_text == \"error\"",
                "set(log.severity_number, SEVERITY_NUMBER_FATAL) where log.severity_text == \"fatal\"",
              ]
            }
            output {
              logs = [otelcol.processor.filter.drop_fragments.input]
            }
          }

          // Two access points duplicate every kernel line as fragments, each one
          // prefixed with a per-AP hex marker and carrying a piece of a line rather
          // than a line: "{2f1a e517} 0xdead", "{334c e517} ,", "{2f1a e517}  )".
          // They are unparseable by construction -- no PRI, no timestamp, no
          // hostname -- and they cannot be turned off: syslog.level and the remote
          // target are both pushed by the controller site-wide, the console is
          // UniFi OS 4 where config.properties no longer exists, and `grep -ci
          // fwlog` on the device returns 0, so there is no device-side knob at all.
          //
          // At measurement they were ~57% of everything this drain ingested
          // (772 of 1358 lines in an 8-minute window, and the larger of the two APs
          // had tripled inside that window).
          //
          // The pattern is deliberately narrow -- two 4-digit hex groups in braces,
          // anchored, with the trailing space -- so near misses are NOT dropped.
          // Verified: "{2f1a} one group", "{zzzz e517} not hex" and
          // "prefix {2f1a e517} not at the start" all survive.
          //
          // This is NOT silent: otelcol_processor_filter_logs_filtered_total counts
          // every drop, per component_id, and this release is scraped as of #3501.
          // So the APs getting noisier is still visible, just not stored.
          //
          // Scoped to job=syslog for the same reason the PRI recovery is: the raw
          // tcplog endpoint must stay raw.
          otelcol.processor.filter "drop_fragments" {
            error_mode = "ignore"
            logs {
              log_record = [
                "log.attributes[\"job\"] == \"syslog\" and IsMatch(log.body, \"^\\\\{[0-9a-f]{4} [0-9a-f]{4}\\\\} \")",
              ]
            }
            output {
              logs = [otelcol.processor.batch.default.input]
            }
          }
          otelcol.processor.batch "default" {
            output {
              logs = [otelcol.exporter.loki.default.input]
            }
          }

          otelcol.exporter.loki "default" {
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring-system.svc.cluster.local:3100/loki/api/v1/push"
            }
          }

    # Alloy serves its own metrics on port 12345; scrape them so accepted and
    # refused record counts are queryable and alertable. Without this the only
    # way to tell whether a sender's format is being rejected is to exec into
    # the pod -- the existing ServiceMonitor selects instance=alloy, which is
    # the node-log DaemonSet, not this release.
    serviceMonitor:
      enabled: true
