---
# A second Alloy, dedicated to receiving syslog from devices on the LAN that
# cannot ship logs any other way, and forwarding them into the existing Loki.
#
# Separate release rather than extra listeners on the node-log DaemonSet, for
# two reasons. A DaemonSet behind a LoadBalancer gives six listeners and
# non-deterministic routing, where syslog wants exactly one endpoint. And the
# node-log pipeline is load-bearing for every pod in the cluster -- a bad
# listener config here should not be able to stop it.
#
# The LoadBalancer is a hand-written Service in syslog-service.yaml, not this
# chart's. The chart's Service also carries the Alloy UI port, which has no
# business being reachable from the LAN.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-syslog
  namespace: monitoring-system
spec:
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://grafana.github.io/helm-charts
      chart: alloy
      version: 1.16.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      # One receiver, not one per node: the Service has a single external
      # address and the senders each point at exactly that.
      type: deployment
      replicas: 1
    alloy:
      # No call-home.
      enableReporting: false
      # Nothing here is a tailed file, so no positions to persist and no
      # storage mount -- unlike the node-log release.
      clustering:
        enabled: false
      # Declared so the pod advertises the listeners; 1514 rather than 514
      # because binding below 1024 would need NET_BIND_SERVICE. The Service
      # publishes the privileged port and maps it here, so senders that cannot
      # change their destination port still work.
      extraPorts:
        - name: syslog-udp
          port: 1514
          targetPort: 1514
          protocol: UDP
        - name: syslog-tcp
          port: 1514
          targetPort: 1514
          protocol: TCP
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      configMap:
        content: |-
          // Two listeners on the same port, one per transport.
          //
          // UDP is the one that matters: most of the senders here are old
          // enough that UDP/514 in BSD format is all they can do. TCP exists
          // for the one sender that can use it, where it buys reliable
          // delivery instead of fire-and-forget datagrams.
          //
          // rfc3164 (BSD), not rfc5424: nothing on this network emits 5424.
          // Picking the wrong one here does not error, it silently mangles
          // every line, so it is stated per listener rather than defaulted.
          //
          // use_incoming_timestamp = false deliberately. RFC3164 carries no
          // year and no timezone, and several of these devices have no working
          // time source -- trusting their clocks produces entries Loki rejects
          // outright as too old or too far in the future. Receive time is
          // approximately right and always ingestible.
          loki.source.syslog "lan" {
            listener {
              address                = "0.0.0.0:1514"
              protocol               = "udp"
              syslog_format          = "rfc3164"
              use_incoming_timestamp = false
              labels                 = { job = "syslog", transport = "udp" }
            }
            listener {
              address                = "0.0.0.0:1514"
              protocol               = "tcp"
              syslog_format          = "rfc3164"
              use_incoming_timestamp = false
              labels                 = { job = "syslog", transport = "tcp" }
            }
            forward_to = [loki.relabel.syslog.receiver]
          }

          // Promote the parsed header into labels. The syslog component emits
          // these as __-prefixed internal labels, which are dropped unless
          // something relabels them.
          //
          // source_ip is included because it is the only identity that can be
          // relied on: some of these devices send no hostname, or send a
          // useless one. Message content is never a label -- that is what
          // turns a Loki index into a cardinality problem.
          loki.relabel "syslog" {
            forward_to = [loki.write.default.receiver]

            rule {
              source_labels = ["__syslog_connection_ip_address"]
              target_label  = "source_ip"
            }
            rule {
              source_labels = ["__syslog_message_hostname"]
              target_label  = "host"
            }
            rule {
              source_labels = ["__syslog_message_severity"]
              target_label  = "severity"
            }
            rule {
              source_labels = ["__syslog_message_facility"]
              target_label  = "facility"
            }
            rule {
              source_labels = ["__syslog_message_app_name"]
              target_label  = "app"
            }
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring-system.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
