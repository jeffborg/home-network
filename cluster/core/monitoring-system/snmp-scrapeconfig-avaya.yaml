---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: snmp-avaya
  namespace: monitoring-system
spec:
  staticConfigs:
    - targets:
      - 192.168.100.2
      labels:
        job: snmp-avaya
        __metrics_path__: /snmp
        __param_module: if_mib
        __param_auth: public_v1
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: snmp-exporter-prometheus-snmp-exporter.monitoring-system:9116