---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: lvm-localpv
  namespace: storage-system
spec:
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://openebs.github.io/lvm-localpv
      chart: lvm-localpv
      version: 1.10.1
      sourceRef:
        kind: HelmRepository
        name: openebs-lvm-localpv
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # No call-home.
    analytics:
      enabled: false

    # Only node1-3 have the vgdata volume group; the arm64 Pis have no LVM
    # storage, so the node plugin would find nothing there.
    lvmNode:
      nodeSelector:
        node-class: faster
    lvmController:
      nodeSelector:
        node-class: faster
      # The chart's default sidecars are current-generation (provisioner v6,
      # resizer v2, snapshotter v8) and are newer than this cluster's k8s 1.24.
      # Pin to the last generation that documents 1.20+ support, and keep the
      # snapshotter in step with the cluster's external-snapshotter CRDs
      # (pinned at v7.0.2 in cluster/crds/external-snapshotter).
      provisioner:
        image:
          tag: v5.2.0
      resizer:
        image:
          tag: v1.11.2
      snapshotter:
        image:
          tag: v7.0.0
      # The cluster already runs exactly one snapshot-controller, in this
      # namespace — do not deploy a second.
      snapshotController:
        enabled: false

    crds:
      csi:
        volumeSnapshots:
          # Owned by cluster/crds/external-snapshotter (v7.0.2).
          enabled: false
