---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: metallb
  namespace: network-system
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://metallb.github.io/metallb
      chart: metallb
      version: 0.16.1
      sourceRef:
        kind: HelmRepository
        name: metallb-charts
        namespace: flux-system
      interval: 5m
  values:
    # crds installed in crds step  for 0.13+
    crds:
      enabled: false
    prometheus:
      # Both of these are required: the chart refuses to render a podMonitor
      # without them, because it creates RBAC letting Prometheus scrape the
      # speaker and controller pods.
      serviceAccount: kube-prometheus-stack-prometheus
      namespace: monitoring-system
      # podMonitor rather than serviceMonitor: the serviceMonitor path scrapes
      # through kube-rbac-proxy over TLS, which needs a serviceAccount and
      # namespace configured. The pods expose 7472 directly.
      podMonitor:
        enabled: true
      # Ships rules for stale/not-loaded config, address pool exhaustion and
      # pool usage thresholds - the things that silently break LoadBalancers.
      prometheusRule:
        enabled: true

    speaker:
      tolerations:
        - effect: "NoExecute"
          operator: "Exists"
        - effect: "NoSchedule"
          operator: "Exists"
