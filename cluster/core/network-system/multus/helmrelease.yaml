---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
  namespace: network-system
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://k8s-at-home.com/charts/
      chart: multus
      version: 3.5.2
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
        namespace: flux-system
      interval: 5m
  # The multus DaemonSet was upgraded to v4.1.1 by hand on 2024-09-25 and this
  # HelmRelease was suspended so Flux couldn't revert it. The values below
  # reproduce that live DaemonSet exactly, so the release can be resumed without
  # changing anything that is running. See issue #3055.
  values:
    image:
      repository: ghcr.io/k8snetworkplumbingwg/multus-cni
      tag: v4.3.1
    cni:
      image:
        repository: ghcr.io/k8s-at-home/cni-plugins
        tag: v1.1.1
      # multus v4 renders `--cni-version=1.0.0`; the chart default is 0.3.1
      version: "1.0.0"
      # These must live under `cni.paths` -- the chart reads
      # .Values.cni.paths.{bin,config} (templates/common.yaml). A top-level
      # `paths:` block, which this release carried until now, is silently
      # ignored; it went unnoticed only because its values happened to match the
      # chart defaults.
      paths:
        # -- CNI config folder for k3s. `/etc/cni/net.d` for non-k3s.
        config: /var/lib/rancher/k3s/agent/etc/cni/net.d

        # -- CNI plugin binaries folder. k3s 1.28 moved this from the versioned
        # data/<hash>/bin (reached via the `current` symlink) to a stable
        # data/cni, and containerd now looks only in the latter. Without this,
        # every new pod fails with `plugin type="multus" failed (add): failed to
        # find plugin "multus" in path [/var/lib/rancher/k3s/data/cni]`.
        # `/opt/cni/bin` for non-k3s.
        #
        # The stable path also cures the recurring post-upgrade breakage: a
        # hostPath bind mount resolves the `current` symlink at mount time, so a
        # long-running multus pod kept writing into the pre-upgrade directory
        # after every k3s hop and needed a DaemonSet restart. data/cni does not
        # move between versions.
        bin: /var/lib/rancher/k3s/data/cni
  # The chart hardcodes `command: [/entrypoint.sh]` via mergeOverwrite, so it
  # cannot be set through values. multus v4 images renamed that binary to
  # /thin_entrypoint, so without this patch a resumed release would roll out a
  # CrashLoopBackOff on every node.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: multus
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: multus
              spec:
                template:
                  spec:
                    containers:
                      - name: multus
                        command:
                          - /thin_entrypoint
