---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
  namespace: network-system
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://rke2-charts.rancher.io
      chart: rke2-multus
      # Chart versions do not track the app version here: chart v4.3.118 ships
      # multus v4.3.1. Read the appVersion, not the chart version, when bumping.
      version: v4.3.118
      sourceRef:
        kind: HelmRepository
        name: rke2-charts
        namespace: flux-system
      interval: 5m
  # Off the archived k8s-at-home chart (#3265). This is the chart the k3s docs
  # themselves point at for multus (docs.k3s.io/networking/multus-ipams), which
  # is also why the CNI paths below are expressed as first-class values rather
  # than patched in afterwards.
  #
  # Still the THIN plugin, as before: thickPlugin.enabled defaults to false.
  # Thin keeps the CNI invocation self-contained -- containerd runs the multus
  # binary directly -- so pod creation does not depend on a multus daemon being
  # up. Moving to thick is a separate decision, not a side effect of changing
  # chart.
  #
  # The /thin_entrypoint postRenderer this release used to carry is gone: that
  # existed because the k8s-at-home chart hardcoded /entrypoint.sh, which multus
  # v4 images do not have. This chart sets the command correctly itself.
  values:
    config:
      cni_conf:
        # k3s paths, not the chart's non-k3s defaults.
        confDir: &confdir /var/lib/rancher/k3s/agent/etc/cni/net.d
        # k3s 1.28 moved the plugin dir from the versioned data/<hash>/bin
        # (reached via the `current` symlink) to a stable data/cni, and
        # containerd looks only in the latter. The stable path also cures the
        # recurring post-upgrade breakage: a hostPath bind mount resolves
        # `current` at mount time, so a long-running multus pod kept writing
        # into the pre-upgrade directory after every k3s hop.
        binDir: /var/lib/rancher/k3s/data/cni
        multusAutoconfigDir: *confdir
        kubeconfig: /var/lib/rancher/k3s/agent/etc/cni/net.d/multus.d/multus.kubeconfig
        multusConfFile: auto
        # multus v4 renders --cni-version=1.0.0; the chart default is 0.3.1.
        cniVersion: 1.0.0
        cleanupConfigOnExit: true
