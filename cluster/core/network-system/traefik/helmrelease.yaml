---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: network-system
spec:
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://helm.traefik.io/traefik
      chart: traefik
      version: 42.4.0
      sourceRef:
        kind: HelmRepository
        name: traefik-charts
        namespace: flux-system
      interval: 10m

  # The 5m default timed out waiting on this release during the 1.25 hop, and with
  # retries defaulting to 0 that one timeout wedged it at "upgrade retries
  # exhausted" until the spec changed.
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Chart is capped at 41.x (42 needs k8s 1.30, see renovate.json5); the Traefik
    # image can be upgraded independently.
    image:
      repository: traefik
      tag: "v3.7.19"
    deployment:
      kind: Deployment
      replicas: 2

    service:
      enabled: true
      spec:
        # Chart 41 moved `type` under `spec`; the old top-level key is silently ignored.
        type: LoadBalancer
        externalTrafficPolicy: Local
    # Chart 41 split `logs.general` into `log` and `logs.access` into `accessLog`,
    # and the values schema rejects the old `logs` key outright.
    log:
      format: json
      level: DEBUG
    accessLog:
      enabled: true
      format: json

    ingressClass:
      enabled: true
      isDefaultClass: true
      # fallbackApiVersion: v1

    ingressRoute:
      dashboard:
        enabled: false

    # The chart creates the GatewayClass the Gateway below references. Named
    # `traefik`, matching the IngressClass this instance already owns, and
    # distinct from `traefik-external`.
    gatewayClass:
      enabled: true
      name: traefik

    gateway:
      enabled: true
      name: internal
      namespace: network-system
      listeners:
        # HTTP, kept so a host can carry its own redirect route the way the
        # published hosts do (#3453) rather than relying on an entrypoint-wide
        # redirect. from: All because those routes live beside their apps.
        web:
          port: 8000
          protocol: HTTP
          namespacePolicy:
            from: All
        websecure:
          port: 8443
          protocol: HTTPS
          # Traefik selects by SNI, so a route for an internal-only
          # ${EXTERNAL_DOMAIN} host is served from the Let's Encrypt wildcard --
          # publicly trusted, no browser warning, no extra Certificate
          # Transparency entry -- while a ${BASE_DOMAIN} host is served from its
          # own internal-CA certificate.
          #
          # Both Secrets live in this namespace, which is where a listener's
          # certificateRefs are resolved, so neither needs a ReferenceGrant.
          certificateRefs:
            # *.${EXTERNAL_DOMAIN} serves internal-only ${EXTERNAL_DOMAIN} names
            # and is valid -- two labels follow the wildcard.
            - name: wildcard-external-tls
            # ${BASE_DOMAIN} hosts get one certificate each. A
            # `*.${BASE_DOMAIN}` wildcard was tried and CANNOT work: only one
            # label follows the wildcard, so it spans the whole TLD and every
            # validating client rejects it with a hostname mismatch. See
            # gateway-certificates-internal.yaml.
            - name: signtools-home-tls
          namespacePolicy:
            from: All

    providers:
      # Gateway API on the INTERNAL instance, for hostnames that should resolve on
      # the LAN and nowhere else -- including ${EXTERNAL_DOMAIN} names that are
      # deliberately not published.
      #
      # SCOPED to the `internal` Gateway, and that is not optional. Both Traefik
      # instances share the controllerName `traefik.io/gateway-controller`, so an
      # unscoped provider here would also claim network-system/external and two
      # controllers would fight over the same Gateway's status and routes.
      # traefik-external is scoped the same way, to `external`.
      kubernetesGateway:
        enabled: true
        gateways:
          - name: internal
            namespace: network-system
      kubernetesIngress:
        publishedService:
          enabled: true
          
    additionalArguments:
      - "--api.insecure=true"
      - "--serverstransport.insecureskipverify=true"
      # - "--providers.kubernetesingress.ingressclass=traefik"
      - "--entryPoints.websecure.forwardedHeaders.trustedIPs=10.0.0.0/8,192.168.0.0/16,172.16.0.0/12"
    metrics:
      prometheus:
        # The chart emits --metrics.prometheus itself once this is set; the
        # metrics entryPoint on 8082 already exists in ports above.
        entryPoint: metrics
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        service:
          labels:
            job: traefik
          enabled: true
        serviceMonitor:
          jobLabel: job
          enabled: true
    ports:
      websecure:
        http3:
          enabled: true
        # tls:
        #   enabled: true
        #   options: "default"
      traefik:
        port: 9000
        expose:
          default: true
        exposedPort: 9000
      metrics:
        port: 8082
        expose:
          default: false
        exposedPort: 8082

    tlsOptions:
      default:
        minVersion: VersionTLS12
        maxVersion: VersionTLS13
        sniStrict: true

    # pilot:
    #   enabled: false

    experimental:
      plugins: {}
        # enabled: true
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - traefik
            topologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: "200m"
        memory: "128Mi"
      limits:
        cpu: "1"
        memory: "512Mi"
