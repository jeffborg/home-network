---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: network-system
spec:
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://helm.traefik.io/traefik
      chart: traefik
      version: 42.3.2
      sourceRef:
        kind: HelmRepository
        name: traefik-charts
        namespace: flux-system
      interval: 10m

  # The 5m default timed out waiting on this release during the 1.25 hop, and with
  # retries defaulting to 0 that one timeout wedged it at "upgrade retries
  # exhausted" until the spec changed.
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Chart is capped at 41.x (42 needs k8s 1.30, see renovate.json5); the Traefik
    # image can be upgraded independently.
    image:
      repository: traefik
      tag: "v3.7.18"
    deployment:
      kind: Deployment
      replicas: 2

    service:
      enabled: true
      spec:
        # Chart 41 moved `type` under `spec`; the old top-level key is silently ignored.
        type: LoadBalancer
        externalTrafficPolicy: Local
    # Chart 41 split `logs.general` into `log` and `logs.access` into `accessLog`,
    # and the values schema rejects the old `logs` key outright.
    log:
      format: json
      level: DEBUG
    accessLog:
      enabled: true
      format: json
      fields:
        # defaultmode=keep already records ClientHost, which is the real client
        # IP once forwardedHeaders trusts the source -- confirmed in the live
        # access log (ClientHost=192.168.58.133 and friends for LAN requests).
        #
        # Headers are dropped by default, which threw away the two that matter
        # for tunnel traffic: Cf-Connecting-Ip is Cloudflare's own view of the
        # client, and Cf-Ray is the request id that makes an entry here joinable
        # with Cloudflare's own logs. Without Cf-Ray the two sides of a request
        # cannot be correlated at all.
        headers:
          defaultMode: drop
          names:
            Cf-Connecting-Ip: keep
            Cf-Ray: keep
            Cf-Ipcountry: keep

    ingressClass:
      enabled: true
      isDefaultClass: true
      # fallbackApiVersion: v1

    ingressRoute:
      dashboard:
        enabled: false

    providers:
      kubernetesIngress:
        publishedService:
          enabled: true
          
    additionalArguments:
      - "--api.insecure=true"
      - "--serverstransport.insecureskipverify=true"
      # - "--providers.kubernetesingress.ingressclass=traefik"
      # Narrowed from 10.0.0.0/8,192.168.0.0/16,172.16.0.0/12 to the pod CIDR
      # alone, because this instance becomes the cloudflared tunnel's origin and
      # therefore sees internet traffic.
      #
      # trustedIPs decides whose X-Forwarded-For Traefik BELIEVES. cloudflared
      # runs in the pod network, so 10.42.0.0/16 is what must be trusted for real
      # client IPs to survive the tunnel. The other two ranges were doing harm:
      #   192.168.0.0/16 is the LAN, and those clients ARE the client -- trusting
      #                  an XFF they send lets any LAN device forge its own source
      #                  address in the access log.
      #   172.16.0.0/12  matches nothing here; checked, 0 services in that range.
      - "--entryPoints.websecure.forwardedHeaders.trustedIPs=10.42.0.0/16"
    metrics:
      prometheus:
        # The chart emits --metrics.prometheus itself once this is set; the
        # metrics entryPoint on 8082 already exists in ports above.
        entryPoint: metrics
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        service:
          labels:
            job: traefik
          enabled: true
        serviceMonitor:
          jobLabel: job
          enabled: true
    ports:
      websecure:
        http3:
          enabled: true
        # tls:
        #   enabled: true
        #   options: "default"
      traefik:
        port: 9000
        expose:
          default: true
        exposedPort: 9000
      metrics:
        port: 8082
        expose:
          default: false
        exposedPort: 8082

    tlsOptions:
      default:
        minVersion: VersionTLS12
        maxVersion: VersionTLS13
        sniStrict: true

    # pilot:
    #   enabled: false

    experimental:
      plugins: {}
        # enabled: true
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - traefik
            topologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: "200m"
        memory: "128Mi"
      limits:
        cpu: "1"
        memory: "512Mi"
