---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-external
  namespace: network-system
spec:
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://helm.traefik.io/traefik
      chart: traefik
      version: 42.3.2
      sourceRef:
        kind: HelmRepository
        name: traefik-charts
        namespace: flux-system
      interval: 10m

  # The 5m default timed out waiting on this release during the 1.25 hop, and with
  # retries defaulting to 0 that one timeout wedged it at "upgrade retries
  # exhausted" until the spec changed.
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Chart is capped at 41.x (42 needs k8s 1.30, see renovate.json5); the Traefik
    # image can be upgraded independently.
    image:
      repository: traefik
      tag: "v3.7.18"
    deployment:
      kind: Deployment
      replicas: 1

    service:
      enabled: true
      spec:
        # Chart 41 moved `type` under `spec`; the old top-level key is silently ignored.
        type: LoadBalancer
        externalTrafficPolicy: Local
    # Chart 41 split `logs.general` into `log` and `logs.access` into `accessLog`,
    # and the values schema rejects the old `logs` key outright.
    log:
      format: json
      level: DEBUG
    accessLog:
      enabled: true
      format: json

    ingressClass:
      enabled: true
      isDefaultClass: false
      # fallbackApiVersion: v1

    ingressRoute:
      dashboard:
        enabled: false

    # The chart creates the GatewayClass the Gateway below references.
    gatewayClass:
      enabled: true
      name: traefik-external

    gateway:
      enabled: true
      # Must match the provider scoping above and the parentRefs on every
      # HTTPRoute.
      name: external
      namespace: network-system
      listeners:
        # The chart ships a `web` HTTP listener on 8000 by default and it renders
        # whether we ask for it or not, so it is explicitly nulled. HTTPS only:
        # the only two ways in are the cloudflared tunnel and a router
        # port-forward, and both can be pointed straight at 443. An HTTP listener
        # would exist solely to redirect, and would be one more thing reachable
        # from the internet.
        web: null
        websecure:
          port: 8443
          protocol: HTTPS
          # No hostname: the listener serves whatever the attached HTTPRoutes
          # claim, and the wildcard certificate covers all of them.
          certificateRefs:
            - name: wildcard-external-tls
          # Routes default to the Gateway's own namespace. These live beside
          # their apps, so cross-namespace attachment must be allowed -- and it
          # is the GATEWAY that grants it, not the route. That is the opt-in: a
          # route cannot expose itself here unless this permits its namespace AND
          # it names this Gateway in parentRefs.
          namespacePolicy:
            from: All

    providers:
      kubernetesIngress:
        ingressClass: traefik-external
        publishedService:
          enabled: true
      # Gateway API, for the externally-published hosts.
      #
      # This is what makes ONE wildcard certificate workable. A TLS Secret is
      # namespaced and an Ingress can only reference one in its own namespace, so
      # per-host certs meant either an identical *.borgs.net Certificate per
      # namespace -- hitting Let's Encrypt's 5-duplicates-per-week limit around
      # the sixth -- or a replication controller copying one private key
      # everywhere. A Gateway holds the certificate ONCE, in its own namespace,
      # and HTTPRoutes from any namespace attach to it.
      #
      # SCOPED to a single Gateway, which matters: both Traefik instances share
      # the controllerName `traefik.io/gateway-controller`, so without scoping
      # they would both claim every Gateway in the cluster. Traefik 3.8 added
      # --providers.kubernetesgateway.gatewayClassName for exactly this; we are
      # on 3.7.18, which instead documents `gateways[n].name/.namespace` as
      # "Scopes the provider to specific Gateways." Same outcome, and verified
      # present in this image's flag list.
      kubernetesGateway:
        enabled: true
        gateways:
          - name: external
            namespace: network-system
          
    additionalArguments:
      - "--api.insecure=true"
      - "--serverstransport.insecureskipverify=true"
      # - "--providers.kubernetesingress.ingressclass=traefik"
      # forwardedHeaders REMOVED, not narrowed -- the opposite of what the main
      # instance needs, and for the opposite reason.
      #
      # This instance is reached by a router port-forward, so the TCP peer IS the
      # internet client. Nothing legitimately forwards to it, which means any
      # X-Forwarded-For it receives is attacker-supplied. Trusting a range here
      # would let a remote client set its own apparent source address --
      # poisoning the access log, and defeating any ClientIP() matching used to
      # decide whether auth applies.
      #
      # With no trustedIPs, ClientHost is always the real peer. The main instance
      # keeps 10.42.0.0/16 because there cloudflared genuinely is a trustworthy
      # forwarder and its XFF is the only way to see past it.
    metrics:
      prometheus:
        # The chart emits --metrics.prometheus itself once this is set; the
        # metrics entryPoint on 8082 already exists in ports above.
        entryPoint: metrics
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        service:
          labels:
            job: traefik-external
          enabled: true
        serviceMonitor:
          jobLabel: job
          enabled: true
    ports:
      traefik:
        port: 9000
        expose:
          default: true
        exposedPort: 9000
      web: {}
        # redirections:
        #   entryPoint:
        #     to: websecure
        #     scheme: https
      websecure: {}
        # tls:
        #   enabled: true
        #   options: "default"
      metrics:
        port: 8082
        expose:
          default: false
        exposedPort: 8082

    # tlsOptions:
    #   default:
    #     minVersion: VersionTLS12
    #     maxVersion: VersionTLS13
    #     sniStrict: true

    # pilot:
    #   enabled: false

    experimental:
      plugins: {}
        # enabled: true
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - traefik
            topologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: "100m"
        memory: "50Mi"
      limits:
        cpu: "300m"
        memory: "512Mi"
