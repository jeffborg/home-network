metadata:
  name: sonarr-home
  namespace: network-system
spec:
  secretName: sonarr-home-tls
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
  commonName: sonarr.${BASE_DOMAIN}
  dnsNames:
    - sonarr.${BASE_DOMAIN}
