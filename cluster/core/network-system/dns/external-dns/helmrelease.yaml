---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: network-system
spec:
  chart:
    spec:
      # renovate: registryUrl=https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install: {}
  interval: 10m0s
  values:
    # 1.23.0 removed the chart default for policy and made it required in
    # values.schema.json, so the render fails outright without it. upsert-only
    # is what the live deployment has always run: external-dns adds and updates
    # records but never deletes, so a bad reconcile leaves a stale record rather
    # than taking DNS down for the house.
    policy: upsert-only

    # HTTPRoutes as well as services and ingresses, so an externally-published
    # host gets its INTERNAL record automatically and with no annotation.
    #
    # external-dns resolves an HTTPRoute's target from the GATEWAY's
    # status.addresses, not from the route -- so a route attached to
    # external/network-system resolves to traefik-external's load-balancer
    # address, which is exactly where a LAN client should be sent. The route
    # itself says nothing about DNS.
    #
    # This is also what removes the collision that killed the annotation-based
    # design. Previously both instances read the same
    # external-dns.alpha.kubernetes.io/target off one Ingress, so setting the
    # public target broke the internal record. Now the internal records come from
    # HTTPRoutes (this instance) and the public ones from DNSEndpoint CRDs (the
    # cloudflare instance, --source=crd). Different source kinds, no shared
    # annotation, so neither can misread the other's intent.
    #
    # Scoping is available if it is ever wanted -- --gateway-name and
    # --gateway-namespace "Limit Gateways of Route endpoints to..." -- but it is
    # not needed while there is one Gateway. policy stays upsert-only, so a
    # removed route leaves a stale internal record rather than deleting one.
    sources:
      - service
      - ingress
      - gateway-httproute

    # external-dns already serves metrics on port 7979; this creates the
    # ServiceMonitor so they are scraped.
    serviceMonitor:
      enabled: true
    provider:
      name: webhook
      webhook:
        # renovate: datasource=github-releases depName=home-operations/external-dns-unifi-webhook
        image:
          repository: ghcr.io/home-operations/external-dns-unifi-webhook
          tag: 0.11.0
        env:
          - name: UNIFI_HOST
            value: https://192.168.100.1
          - name: UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: external-dns-unifi-secret
                key: api-key
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
