---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  chart:
    spec:
      # renovate: registryUrl=https://vmware-tanzu.github.io/helm-charts
      chart: velero
      version: 8.7.2
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
  install: {}
  interval: 10m0s
  values:
    initContainers:
      - name: velero-plugin-for-aws
        # Must track the server version: velero's compatibility matrix runs the
        # plugin four minors behind the server (1.17<->1.13, 1.16<->1.12), so
        # 1.15.x server <-> plugin 1.11.x. Renovate is capped at <1.12 to match;
        # raise both together, never the plugin alone. The matrix no longer
        # lists velero 1.15, so the row is extrapolated from the offset -- which
        # the live pairing confirms: 1.13.2 ran plugin v1.9.2 for months.
        #
        # History worth keeping, because it is the reason for the cap: v1.14.4
        # was merged while the chart was briefly on v12, and the chart revert
        # left it behind - after which every minio backup failed with
        #   XAmzContentSHA256Mismatch: the provided 'x-amz-content-sha256'
        #   header does not match what was computed
        # Upstream documents it under "Non-AWS S3 compatible provider known
        # issues" for Ceph S3 and Backblaze B2, fixed with checksumAlgorithm=""
        # on the storage location.
        #
        # This block used to claim v1.9.x predates aws-sdk-go-v2 and is therefore
        # unaffected. That was wrong, and it cost a backup: the first minio run
        # after the 1.13.2 upgrade failed with the same error. v1.9.2 is already
        # aws-sdk-go-v2 -- verified by extracting the image, which carries only
        # aws-sdk-go-v2 modules (config@v1.18.42, service/internal/checksum@
        # v1.1.36) and no aws-sdk-go v1 at all. The README's "plugin v1.13.x"
        # heading tracks a different numbering from the plugin tags themselves,
        # which is what made it look like a future problem.
        #
        # So the fix is applied now, on the minio location only -- see
        # backup-location-freenas.yaml.
        image: velero/velero-plugin-for-aws:v1.11.1
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
    metrics:
      # Was disabled, so velero exposed nothing and the chart created neither a
      # port nor a Service. Metric names verified against the 1.9.4 binary.
      enabled: true
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        spec:
          - alert: VeleroBackupFailed
            expr: increase(velero_backup_failure_total[6h]) > 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: 'Velero schedule {{ $labels.schedule }} has a failed backup in the last 6h'
          - alert: VeleroBackupPartiallyFailed
            expr: increase(velero_backup_partial_failure_total[6h]) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: 'Velero schedule {{ $labels.schedule }} partially failed - some volumes were not backed up'
          # 36h, against daily schedules at 15:00 and 17:00, so one missed run is
          # not an alert but two are. Only fires once a schedule has succeeded at
          # least once: the counters above cover a schedule that never works.
          - alert: VeleroNoRecentBackup
            expr: time() - velero_backup_last_successful_timestamp > 129600
            for: 1h
            labels:
              severity: critical
            annotations:
              summary: 'Velero schedule {{ $labels.schedule }} has not completed a backup in 36h'
    # No VolumeSnapshotLocation. This cluster has never taken a CSI/cloud volume
    # snapshot: both schedules set `snapshotVolumes: false`, 0 of 60 backups
    # reference a VSL, and the lifetime volumeSnapshotsAttempted count is 0. All
    # backup data goes through restic.
    #
    # It has to be said explicitly now because chart 4.x made
    # volumeSnapshotLocation a list needing its own `provider`, where 2.x took it
    # from the now-removed `configuration.provider`. Leaving it on produced a
    # post-upgrade hook that failed the whole release:
    #
    #   VolumeSnapshotLocation.velero.io "default" is invalid:
    #     spec.provider: Required value
    #
    # Giving the VSL a provider would also have worked, but this removes an
    # object nothing uses rather than fabricating config for it.
    #
    # Note the two schedules reference `volumeSnapshotLocations: [backblaze]` and
    # `[minio]`, which have never existed as VSLs -- those names are BSLs. The
    # references are inert while snapshotVolumes is false, and have been for
    # years.
    snapshotsEnabled: false
    configuration:
      # Chart 4.x made backupStorageLocation a LIST and moved `provider` into
      # each entry; `configuration.provider` no longer exists. The chart detects
      # the old shape and refuses to render rather than silently dropping it.
      #
      # `name: default` is explicit now. Chart 2.x defaulted the name when none
      # was given, which is what the live `default` BSL is. Spelling it out keeps
      # this entry pointing at the same object instead of creating a second one.
      # The `backblaze` and `minio` locations are separate standalone manifests
      # in this directory and are untouched by the chart.
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: ${VELERO_BACKUP_BUCKET}
          default: false
          config:
            region: ${AWS_REGION}
      # Switched from restic to kopia (#3378). This was deliberately pinned to
      # restic when the chart was first adopted, because switching would orphan
      # the existing repositories and re-upload everything. That cost was paid
      # for a dated reason, and this upgrade is the date: restic is DEPRECATED
      # as of the 1.15 we now run, and velero's deprecation policy retires a
      # deprecated path two minors later, so 1.17 removes it.
      #
      # Deprecated is not gone. 1.15 still backs up AND restores via restic,
      # emitting a warning when it does -- so the restic backups still on the
      # shelf stay restorable here, noisily. We no longer create any.
      #
      # Existing restic backups stay restorable. Velero records the uploader
      # per backup, not globally -- `PodVolumeBackup.spec.uploaderType` is an
      # enum of kopia/restic/"" -- so a restore reads it from the backup rather
      # than from this flag. Verified against the live objects: 192 PVBs are
      # explicitly `restic` and 637 are unset (pre-1.10, which velero treats as
      # restic). BackupRepository also carries `repositoryType` per repo and
      # encodes it in the name (home-automation-backblaze-restic-7zh7j), so
      # kopia creates its own repositories alongside rather than touching these.
      #
      # So no migration step: new backups go to kopia, the 60 existing restic
      # backups expire on their own 720h (30 day) TTL, and the restic
      # repositories become inert once the last backup referencing them is gone.
      # Nothing here deletes them -- see the PR for the cleanup afterwards.
      #
      # Cost: the first kopia backup re-uploads everything, because kopia cannot
      # read restic data. The most recent backup covered 15 volumes / 15.7 GiB,
      # so that is roughly the one-off upload per destination (minio and
      # backblaze), not the 178 GiB quoted below -- that figure is the deduped
      # repository across all historical snapshots, not one backup. Storage is
      # temporarily both repositories until the restic TTL runs out.
      uploaderType: kopia
      # New in velero 1.14: repository maintenance (prune/GC) left the server
      # pod and now runs as its own Job. The chart ships NO requests or limits
      # for it, which makes the Job BestEffort -- first in line for eviction
      # under node pressure, on a cluster whose Pi nodes have little to spare.
      #
      # So the headroom that used to sit on the server is carried over to where
      # the work actually happens. 2Gi is not arbitrary: 512Mi is the value that
      # OOM-killed restic prune on the 522k blob / 178 GiB backblaze repo, and
      # that repo still needs maintaining until the last restic backup expires
      # around 2026-12-11. Requests stay small so the Job schedules easily.
      #
      # Both numbers are transplanted rather than measured, and the request in
      # particular is a guess -- expect it to need raising once the Job has run a
      # few times. Tracked in #3412.
      repositoryMaintenanceJob:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 2Gi
    # Velero server. These limits exist because on v1.9 restic repository
    # maintenance (prune) ran INSIDE this pod against a 522k blob / 178 GiB
    # repo, and the chart default of 512Mi was OOM-killing it during index
    # rebuild (stderr=: signal: killed) so it retried forever.
    #
    # As of THIS upgrade that reason no longer applies here: 1.14 moves
    # maintenance into its own Job, so the headroom belongs there instead and is
    # set under configuration.repositoryMaintenanceJob below. These numbers are
    # left alone rather than trimmed to match, because the right new value is a
    # measurement and not a guess -- the server still does backup orchestration,
    # and kopia's profile differs from restic's. Measured 2026-11-11 on 1.13: an
    # 834 MiB peak against this 2Gi, with maintenance still in-pod. Re-measure
    # once it is out and set the limit from that -- #3412 has the baseline, the
    # queries and the rest of the tuning work.
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: 2000m
        memory: 2Gi
    # Renamed in chart 4.x: velero 1.10 replaced the restic daemonset with the
    # node-agent. Same component, same job; `uploaderType` above is what decides
    # which uploader it runs, and it now says kopia.
    deployNodeAgent: true
    credentials:
      useSecret: true
      existingSecret: ${VELERO_SECRET_NAME}
    # Was `restic:` before chart 4.x - see deployNodeAgent above.
    #
    # 1.15 adds a hostPath mount to this DaemonSet on its own, with no value of
    # ours involved: /var/lib/kubelet/plugins -> /host_plugins, HostToContainer.
    # Safe here because that path is already in use on every node, Pis included
    # -- longhorn-csi-plugin and lvm-localpv both mount under it.
    nodeAgent:
      # Same failure the server hit, one tier down: pod volume backups were
      # OOM-killed at 512Mi (stderr=: signal: killed), and the two busiest
      # pods measured 510Mi and 505Mi peaks against that limit.
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 2Gi
    kubectl:
      # Image for the pre-upgrade `velero-upgrade-crds` hook Job, which applies
      # the CRDs before the server rolls. Chart 5.0.0 dropped the other CR
      # hooks; this one remains, so a bad image here fails the whole release.
      #
      # TWO constraints, and both are easy to miss because neither is about
      # kubectl's version. The hook never runs kubectl from this image: an
      # initContainer runs
      #   /bin/sh -c 'cp `which sh` /tmp && cp `which kubectl` /tmp'
      # and the VELERO container then execs
      #   /tmp/sh -c '/velero install --crds-only --dry-run -o yaml | /tmp/kubectl apply -f -'
      # So the two binaries are lifted out of this image and run inside
      # velero/velero. Therefore this image must:
      #
      #  1. CONTAIN A SHELL. Distroless kubectl images cannot even start the
      #     initContainer: registry.k8s.io/kubectl and rancher/kubectl both fail
      #     with `stat /bin/sh: no such file or directory`.
      #  2. BE glibc-BASED, to match velero/velero. An alpine-based image copies
      #     musl-linked binaries, and the velero container then dies on
      #     `exec /tmp/sh: no such file or directory` -- the same message for a
      #     missing ELF interpreter, which is what makes this one so confusing.
      #     alpine/kubectl:1.33.4 failed exactly here.
      #
      # The chart's own default, docker.io/bitnami/kubectl, satisfied both but
      # its tags no longer pull since Bitnami moved to the archived namespace.
      #
      # appscode/kubectl is Debian-based with a shell and publishes five arches
      # (the job has no nodeSelector, so it can land on a Pi). 1.26 against a
      # 1.33 API server is outside kubectl's supported +/-1 skew, but the only
      # operation is `apply` of 13 velero CRDs, verified by running the full
      # pipeline above against velero/velero:v1.13.2. Prefer a newer glibc
      # kubectl with a shell if one turns up; do not "fix" the skew with a
      # distroless or alpine image.
      image:
        repository: appscode/kubectl
        tag: "1.26"
    schedules:
      daily:
        disabled: true
    #     # labels:
    #     #   myenv: foo
    #     # annotations:
    #     #   myenv: foo
    #     schedule: "0 17 * * *" # approx 3am
    #     useOwnerReferencesInBackup: true
    #     template:          
    #       ttl: "720h"
    #       # includedNamespaces:
    #       # - '*'
    #       includedResources:
    #         - pod
    #         - persistentvolumes
    #         # - persistentvolumeclaims
    #       snapshotVolumes: false
    #       defaultVolumesToRestic: false
