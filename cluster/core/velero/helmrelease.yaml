---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  chart:
    spec:
      # renovate: registryUrl=https://vmware-tanzu.github.io/helm-charts
      chart: velero
      version: 2.32.6
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
  install: {}
  interval: 10m0s
  values:
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.7.1
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
      - name: velero-plugin-for-csi
        image: raspbernetes/velero-csi-plugin:v0.2.0
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
    metrics:
      enabled: false
    configuration:
      provider: aws
      backupStorageLocation:
        bucket: ${VELERO_BACKUP_BUCKET}
        default: false
        config:
          region: ${AWS_REGION}
      volumeSnapshotLocation:
        provider: csi
    # Velero server. On v1.9 restic repository maintenance (prune) runs
    # INSIDE this pod, and the backblaze repo is 522k blobs / 178 GiB.
    # The chart default limit of 512Mi was OOM-killing prune during index
    # rebuild (stderr=: signal: killed), so it never completed and retried
    # forever.
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: 2000m
        memory: 2Gi
    deployRestic: true
    credentials:
      useSecret: true
      existingSecret: ${VELERO_SECRET_NAME}
    restic:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 1000m
          memory: 512Mi
    kubectl:
      image:
        repository: appscode/kubectl
        tag: "1.26"
    schedules:
      daily:
        disabled: true
