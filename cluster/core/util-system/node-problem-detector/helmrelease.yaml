---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-problem-detector
  namespace: util-system
spec:
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://charts.deliveryhero.io/
      chart: node-problem-detector
      version: 2.3.14
      sourceRef:
        kind: HelmRepository
        name: deliveryhero-charts
        namespace: flux-system
      interval: 10m
  values:
    image:
      repository: registry.k8s.io/node-problem-detector/node-problem-detector
      # NPD renumbered straight from v0.8.25 to the v1.34+ line; v1.37.0 is the
      # current release and the version digits are not tied to a k8s version.
      # Still multi-arch amd64 + arm64, which is what keeps the Pis covered.
      tag: v1.37.0
    # The amd64 nodeSelector was dropped so the three Pis are covered too -
    # kernel-log problems, OOM and task hangs are exactly what bit pi2.
    metrics:
      # Was serviceMonitor-only, which produced no metrics at all: the chart gates
      # the metrics *Service* on this flag, so the ServiceMonitor was selecting
      # `app: node-problem-detector` against a Service that was never created.
      # problem_counter and problem_gauge both had zero series.
      enabled: true
      serviceMonitor:
        enabled: true
      # 16 upstream alerts on problem_counter/problem_gauge -- TaskHung, OOMKilling,
      # KernelOops, IOError, FilesystemIsReadOnly, Ext4Error and friends, i.e. the
      # pi2 failure class. They only work because metrics.enabled now creates the
      # Service they scrape.
      prometheusRule:
        enabled: true
        defaultRules:
          create: true
