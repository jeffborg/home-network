---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-problem-detector
  namespace: util-system
spec:
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://charts.deliveryhero.io/
      chart: node-problem-detector
      version: 2.3.14
      sourceRef:
        kind: HelmRepository
        name: deliveryhero-charts
        namespace: flux-system
      interval: 10m
  values:
    image:
      repository: registry.k8s.io/node-problem-detector/node-problem-detector
      tag: v0.8.25
    # The amd64 nodeSelector was dropped so the three Pis are covered too -
    # kernel-log problems, OOM and task hangs are exactly what bit pi2. The
    # image is multi-arch (amd64 + arm64 on v0.8.25).
    metrics:
      serviceMonitor:
        enabled: true
