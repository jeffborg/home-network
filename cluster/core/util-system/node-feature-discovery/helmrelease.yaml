---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: util-system
spec:
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://kubernetes-sigs.github.io/node-feature-discovery/charts
      chart: node-feature-discovery
      version: 0.20.1
      sourceRef:
        kind: HelmRepository
        name: kubernetes-sigs-nfd-charts
        namespace: flux-system
      interval: 10m
  values:
    topologyUpdater:
      createCRDs: true
    master:
      tolerations:
        - effect: "NoExecute"
          operator: "Exists"
        - effect: "NoSchedule"
          operator: "Exists"

      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: "node-role.kubernetes.io/master"
                    operator: In
                    values: [""]

    worker:
      config:
        core:
          labelSources:
          # `local` reads the feature files under
          # /etc/kubernetes/node-feature-discovery/features.d/ — that is how the
          # nfd-lvm-feature DaemonSet publishes the LVM volume groups per node.
          - local
          - custom
          - pci
          - usb

        sources:
          usb:
            deviceClassWhitelist:
            - "02"
            - "03"
            - "0a"
            - "ef"
            - "fe"
            - "ff"
            deviceLabelFields:
            - "class"
            - "vendor"
            - "device"

          custom:
            # - name: "intel-gpu"
            #   matchFeatures:
            #     - feature: pci.device
            #       matchExpressions:
            #         vendor: {op: In, value: ["8086"]}
            #         class: {op: In, value: ["0300"]}
            # - name: "coral-tpu"
            #   matchFeatures:
            #     - feature: usb.device
            #       matchExpressions:
            #         vendor: {op: In, value: ["1a6e", "18d1"]}
            # - name: "ender3"
            #   matchFeatures:
            #     - feature: usb.device
            #       matchExpressions:
            #         vendor: {op: In, value: ["1a86"]}
            #         class: {op: In, value: ["ff"]}
            #         device: {op: In, value: ["7523"]}
            - name: "dvb_usb_dib0700"
              labels:
                feature.node.kubernetes.io/custom-dvb_usb_dib0700: 'true'
              matchFeatures:
                - feature: kernel.loadedmodule
                  matchExpressions:
                    dvb_usb_dib0700: {op: Exists}
            - name: "dvb"
              labels:
                feature.node.kubernetes.io/custom-dvb_core: 'true'
              matchFeatures:
                - feature: kernel.loadedmodule
                  matchExpressions:
                    dvb_core: {op: Exists}
            - name: rtl2832_sdr
              labels:
                feature.node.kubernetes.io/custom-rtl2832_sdr: 'true'
              matchFeatures:
                - feature: kernel.loadedmodule
                  matchExpressions:
                    rtl2832_sdr: {op: Exists}
            # OpenVINO's GPU plugin needs Intel's compute runtime, which supports
            # Gen9 (Skylake) and newer. Device IDs below are the closed set of
            # pre-Gen9 iGPUs, so new GPUs get the label without a rule change.
            # Seed: rule.matched must exist for DoesNotExist to match.
            - name: "rule-matched-seed"
              vars:
                rule-matched-seed: "true"
              matchFeatures:
                - feature: kernel.version
                  matchExpressions:
                    major: {op: Exists}
            - name: "intel-gpu-pre-gen9"
              vars:
                intel-gpu-pre-gen9: "true"
              matchFeatures:
                - feature: pci.device
                  matchExpressions:
                    vendor: {op: In, value: ["8086"]}
                    class: {op: In, value: ["0300", "0380"]}
                    # Gen2-5, SNB/IVB/VLV, HSW, BDW, CHV.
                    device: {op: InRegexp, value: ["^(004[26]|01|0[4acd][0-2]|0f3|16|2|35|a0[01]1)"]}
            - name: "openvino"
              labels:
                feature.node.kubernetes.io/custom-openvino: 'true'
              matchFeatures:
                - feature: pci.device
                  matchExpressions:
                    vendor: {op: In, value: ["8086"]}
                    class: {op: In, value: ["0300", "0380"]}
                - feature: rule.matched
                  matchExpressions:
                    intel-gpu-pre-gen9: {op: DoesNotExist}
            - name: "vlan18"
              labels:
                feature.node.kubernetes.io/custom-vlan18: 'true'
              matchFeatures:
                - feature: network.virtual
                  matchExpressions:
                    name: {op: In, value: ["eth0.18"]}
            - name: "vlan22"
              labels:
                feature.node.kubernetes.io/custom-vlan22: 'true'
              matchFeatures:
                - feature: network.virtual
                  matchExpressions:
                    name: {op: In, value: ["eth0.22"]}
            - name: "vlan58"
              labels:
                feature.node.kubernetes.io/custom-vlan58: 'true'
              matchFeatures:
                - feature: network.virtual
                  matchExpressions:
                    name: {op: In, value: ["eth0.58"]}
            # - name: "aukey_webcam"
            #   labels:
            #     feature.node.kubernetes.io/custom-rtl2832_sdr: 'true'
            #   matchFeatures:
            #     - feature: usb.device
            #       matchExpressions:
            #         vendor: {op: In, value: ["0c45"]}
            #         class: {op: In, value: ["ef"]}
            #         device: {op: In, value: ["636d"]}

      annotations:
        configmap.reloader.stakater.com/reload: "node-feature-discovery-worker-conf"

      tolerations:
        - effect: "NoExecute"
          operator: "Exists"
        - effect: "NoSchedule"
          operator: "Exists"
