---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: util-system
spec:
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://kubernetes-sigs.github.io/node-feature-discovery/charts
      chart: node-feature-discovery
      version: 0.15.4
      sourceRef:
        kind: HelmRepository
        name: kubernetes-sigs-nfd-charts
        namespace: flux-system
      interval: 10m
  values:
    featureGates:
      NodeFeatureAPI: false
    topologyUpdater:
      createCRDs: true
    master:
      tolerations:
        - effect: "NoExecute"
          operator: "Exists"
        - effect: "NoSchedule"
          operator: "Exists"

      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: "node-role.kubernetes.io/master"
                    operator: In
                    values: [""]

    worker:
      config:
        core:
          sources:
          - custom
          - pci
          - usb

        sources:
          usb:
            deviceClassWhitelist:
            - "02"
            - "03"
            - "0a"
            - "ef"
            - "fe"
            - "ff"
            deviceLabelFields:
            - "class"
            - "vendor"
            - "device"

          custom:
            - name: "intel-gpu"
              matchFeatures:
                - feature: pci.device
                  matchExpressions:
                    vendor: {op: In, value: ["8086"]}
                    class: {op: In, value: ["0300"]}
            - name: "coral-tpu"
              matchFeatures:
                - feature: usb.device
                  matchExpressions:
                    vendor: {op: In, value: ["1a6e", "18d1"]}
            - name: "ender3"
              matchFeatures:
                - feature: usb.device
                  matchExpressions:
                    vendor: {op: In, value: ["1a86"]}
                    class: {op: In, value: ["ff"]}
                    device: {op: In, value: ["7523"]}
            - name: "dvb_usb_dib0700"
              matchFeatures:
                - feature: kernel.loadedmodule
                  matchExpressions:
                    dvb_usb_dib0700: {op: Exists}
            - name: "dvb"
              matchFeatures:
                - feature: kernel.loadedmodule
                  matchExpressions:
                    dvb_core: {op: Exists}
            - name: rtl2832_sdr
              matchFeatures:
                - feature: kernel.loadedmodule
                  matchExpressions:
                    rtl2832_sdr: {op: Exists}
            - name: "aukey_webcam"
              matchFeatures:
                - feature: usb.device
                  matchExpressions:
                    vendor: {op: In, value: ["0c45"]}
                    class: {op: In, value: ["ef"]}
                    device: {op: In, value: ["636d"]}

      annotations:
        configmap.reloader.stakater.com/reload: "node-feature-discovery-worker-conf"

      tolerations:
        - effect: "NoExecute"
          operator: "Exists"
        - effect: "NoSchedule"
          operator: "Exists"
