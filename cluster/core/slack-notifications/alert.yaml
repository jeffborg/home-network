apiVersion: notification.toolkit.fluxcd.io/v1beta1
kind: Alert
metadata:
  name: on-call-webapp
  namespace: flux-system
spec:
  providerRef:
    name: slack
  # error, not info: at info this fired on every successful reconcile of every
  # GitRepository, Kustomization, HelmRepository, HelmChart and HelmRelease in
  # the cluster — constant chatter that buried anything real. Health is now
  # covered properly by the Flux PrometheusRule in monitoring-system
  # (reconciliation failures, stalled resources, suspended resources), so this
  # only needs to carry actual errors.
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: Kustomization
      name: '*'
    - kind: HelmRepository
      name: '*'
    - kind: HelmChart
      name: '*'
    - kind: HelmRelease
      name: '*'
