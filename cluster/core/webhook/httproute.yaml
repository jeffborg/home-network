---
# The GitHub webhook that triggers Flux, published through the cloudflared tunnel
# instead of a router port-forward.
#
# Before: GitHub -> WAN:port -> port-forward -> MetalLB 192.168.10.172 (svc/receiver)
# After:  GitHub -> Cloudflare edge -> tunnel -> traefik-external -> this route
#
# The point is removing an inbound hole. The old path needed a port open on the
# router to a LoadBalancer address, reachable by anyone who found it; the tunnel
# path has no listening port at all, and puts Cloudflare's WAF and rate limiting
# in front of an endpoint whose only protection is the secrecy of a token in a
# URL.
#
# Backend is `webhook-receiver`, the ClusterIP Service that ships with Flux --
# not the LoadBalancer `receiver` in receiver.yaml next door. Both select
# app: notification-controller, so they reach the same pod; using the ClusterIP
# one keeps in-cluster routing off the MetalLB address entirely.
#
# PATH-RESTRICTED to /hook on purpose. notification-controller serves nothing
# else on this port today, but the restriction means a future endpoint on that
# container is not published by accident just because this route exists.
#
# No NetworkPolicy change needed: flux-system's `allow-webhooks` already admits
# namespaceSelector {} to notification-controller on all ports, so traefik-external
# in network-system is already permitted. Checked, because selector-only
# NetworkPolicies have silently broken this deploy trigger before.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook-external
  namespace: flux-system
spec:
  parentRefs:
    - name: external
      namespace: network-system
      sectionName: websecure
  hostnames:
    - flux-webhook.${EXTERNAL_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hook
      backendRefs:
        - name: webhook-receiver
          port: 80
