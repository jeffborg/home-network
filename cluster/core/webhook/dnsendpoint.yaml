---
# Through the tunnel (proxied), unlike the other public hosts: only GitHub calls
# it, so split-horizon doesn't matter and it exercises the tunnel path.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  endpoints:
    - dnsName: flux-webhook.${EXTERNAL_DOMAIN}
      recordType: CNAME
      recordTTL: 1
      targets:
        - 69cd25d6-e34b-4db4-b97d-b22af0200d8c.cfargotunnel.com
      providerSpecific:
        - name: cloudflare/proxied
          value: "true"
