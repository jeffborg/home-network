---
# The Flux Operator web UI, gated by oauth2-proxy.
#
# Defined here rather than through the chart's own `web.ingress` values, because
# the chart lives in cluster/base, which the flux-system Kustomization applies
# WITHOUT postBuild substitution -- `${BASE_DOMAIN}` would be emitted literally
# there. Everything host-dependent therefore lives under cluster/core, which the
# `core` Kustomization substitutes, even though it targets the flux-system
# namespace.
#
# Middleware order matters and is outermost-first: signin must precede auth so
# the 401 becomes a redirect rather than a blank page. See the comments in
# oauth2-proxy-middlewares.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flux-web
  namespace: flux-system
  annotations:
    # One line, no spaces after the commas: every other ingress in this repo
    # writes it that way and traefik parses the list literally.
    traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd,flux-system-oauth2-signin-flux@kubernetescrd,flux-system-oauth2-auth-flux@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - flux.${BASE_DOMAIN}
      secretName: flux-tls
  rules:
    - host: flux.${BASE_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flux-operator
                port:
                  # the operator chart serves the UI on 9080 (http-web); 8080 is
                  # metrics and must not be exposed here
                  number: 9080
