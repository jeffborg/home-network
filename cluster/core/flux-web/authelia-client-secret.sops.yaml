# pbkdf2 hash of the client-secret in oauth2-proxy-secret.sops.yaml, which
# Authelia reads as a file via `client_secret.path`.
#
# Mounted at its own path rather than added to the pre-existing `authelia-oidc`
# secret, because that one is not in git: adding a key there would mean
# re-encrypting all eight of its values, including the OIDC signing key, to
# bring them into the repo. A second mount adds only the key needed and leaves
# existing key material untouched.
#
# Generated AND verified by the running Authelia, so the parameters match what
# it checks against:
#   authelia crypto hash generate pbkdf2 --variant sha512 --password <secret>
#   authelia crypto hash validate <digest> --password <secret>
#     -> "The password matches the digest."
apiVersion: v1
kind: Secret
metadata:
    name: authelia-oidc-flux
    namespace: auth-system
type: Opaque
stringData:
    oidc.client.flux-system.hash: ENC[AES256_GCM,data:wBSqYo+KSV3i3/nh+V8LVwmAdQ24vR0zLx1slKhgD4a2oMLz48SVbFhSazXPgxMSVi3Sd+Twoj9bpkK3QRvmvBBGUF+qAdAtZp5743yHYeV4JfbSV4MmxPTVJ4orXLGc37u3/trOgyk7cr5wsi3JkyiGF6kAFB/JHzjyUvH/UyoG0uk=,iv:ydozkdSiLxDKEaRBgLA5uVsz9JSDOUhm7dXI1VZ/p2o=,tag:0moRbW4g/2dLALuEoE7ljA==,type:str]
