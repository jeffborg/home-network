---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api-source
  namespace: flux-system
spec:
  interval: 30m
  # renovate: datasource=github-releases
  url: https://github.com/kubernetes-sigs/gateway-api.git
  ref:
    tag: v1.7.0
  # config/crd/kustomization.yaml lists the standard channel only.
  ignore: |
    /*
    !/config/crd/
    /config/crd/experimental/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 15m
  path: ./config/crd
  # Pruning these would delete every Gateway and HTTPRoute.
  prune: false
  sourceRef:
    kind: GitRepository
    name: gateway-api-source
  healthChecks:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: gateways.gateway.networking.k8s.io
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: httproutes.gateway.networking.k8s.io
