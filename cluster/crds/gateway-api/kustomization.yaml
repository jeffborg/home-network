---
# Gateway API CRDs, standard channel, from upstream via a GitRepository (see
# crd.yaml) so renovate tracks the tag. A bump that drops a version still in a
# CRD's status.storedVersions is rejected by the API server, failing only
# gateway-api-crds.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crd.yaml
