---
# The Barman Cloud plugin's ObjectStore CRD, applied before core. Same reasoning
# as cluster/crds/cloudnative-pg next door -- see that file for why the chart
# cannot install it in time.
#
# KEEP THE TAG IN LOCKSTEP with the chart appVersion in
# cluster/core/database-system/plugin-barman-cloud.yaml -- chart 0.9.0 is
# appVersion v0.16.0. The chart is told `crds.create: false`.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: plugin-barman-cloud
  namespace: flux-system
spec:
  interval: 12h
  url: https://github.com/cloudnative-pg/plugin-barman-cloud.git
  ref:
    # renovate: registryUrl=https://cloudnative-pg.github.io/charts chart=plugin-barman-cloud
    tag: v0.16.0
  ignore: |
    # exclude all
    /*
    # include only the plain CRD definition
    !/config/crd/bases/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plugin-barman-cloud-crds
  namespace: flux-system
spec:
  interval: 10m0s
  prune: false
  path: ./config/crd/bases
  sourceRef:
    kind: GitRepository
    name: plugin-barman-cloud
    namespace: flux-system
  timeout: 2m
  healthChecks:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: objectstores.barmancloud.cnpg.io
