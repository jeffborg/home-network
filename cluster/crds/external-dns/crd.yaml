---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: external-dns-source
  namespace: flux-system
spec:
  interval: 30m
  # renovate: datasource=github-releases
  url: https://github.com/kubernetes-sigs/external-dns.git
  ref:
    tag: v0.24.0
  ignore: |
    # exclude all
    /*
    # include upstream's standard CRD dir, matching how the traefik and
    # kube-prometheus-stack CRD sources here are written. The old path
    # (docs/contributing/crd-source/crd-manifest.yaml) has not existed upstream
    # for several releases, so this produced an empty artifact and the
    # Kustomization sat Ready with a 0-entry inventory -- the live DNSEndpoint
    # CRD was a 2021 leftover that only survived because prune is false.
    !/config/crd/standard/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-crds
  namespace: flux-system
spec:
  interval: 15m
  prune: false
  sourceRef:
    kind: GitRepository
    name: external-dns-source
  healthChecks:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: dnsendpoints.externaldns.k8s.io
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: dnsrecords.externaldns.k8s.io
