---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core
  namespace: flux-system
spec:
  dependsOn:
    - name: crds
    # `crds` only guarantees the CRD *Kustomization objects* exist, not that
    # their CRDs have been applied. core contains resources that need the
    # prometheus-operator CRDs (the Flux PodMonitor and PrometheusRule in
    # monitoring-system), and without this it fails its dry-run on them until
    # the CRDs happen to land.
    - name: prometheus-operator-crds
    # Same reason, learned the hard way in #3396: core carries the CNPG Cluster,
    # ScheduledBackup and ObjectStore CRs, and a dry-run failure on any one
    # object rejects core's whole apply stage -- including the HelmReleases that
    # would have installed the CRDs. That standoff is permanent, not transient.
    - name: cloudnative-pg-crds
    - name: plugin-barman-cloud-crds
    - name: flux-system
    - name: config
  interval: 10m0s
  path: ./cluster/core
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  postBuild:
    substitute: {}
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
      - kind: ConfigMap
        name: cluster-config-settings
      - kind: Secret
        name: cluster-config-secrets
