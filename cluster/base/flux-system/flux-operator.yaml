---
# Flux Operator (#2833 follow-up). Installed here, in flux-system, because the
# migration guide requires it in the same namespace as Flux.
#
# THIS IS STAGE 1 OF 2, AND ON ITS OWN IT CHANGES NOTHING.
#
# The operator only acts on a FluxInstance resource, and this commit does not
# create one. Flux keeps managing itself from gotk-components.yaml exactly as
# before. That split is deliberate: the handover is the part that can go wrong,
# so it gets its own commit that can be reverted without also uninstalling the
# operator.
#
# Stage 2 adds a FluxInstance and drops gotk-components.yaml/gotk-sync.yaml from
# this directory's kustomization. See the PR for the exact manifest.
#
# Why bother at all: two of the last three Flux upgrades needed work outside git.
# 2.8 refused to apply until `ocirepositories` had `v1beta2` removed from
# status.storedVersions by hand, and regenerating gotk-components.yaml needs a
# CLI matching the target version (the installed one refuses to export others).
# The operator's controller does the storedVersions migration itself -- it
# migrates the stored CRs first, then patches the status, which is strictly more
# than the manual patch did and is the only safe route when the collection is
# not empty -- and replaces the regenerate-with-matching-CLI step with a single
# `spec.distribution.version`.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      # renovate: registryUrl=oci://ghcr.io/controlplaneio-fluxcd/charts
      chart: flux-operator
      version: 0.62.1
      sourceRef:
        kind: HelmRepository
        name: controlplaneio-fluxcd
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The operator is in the critical path for Flux itself once stage 2 lands,
    # so keep it on an amd64 control-plane node rather than a Pi -- same
    # reasoning as #3364 for Prometheus/Alertmanager.
    nodeSelector:
      kubernetes.io/arch: amd64
    serviceMonitor:
      create: true
