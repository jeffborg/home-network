---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
  namespace: media
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 10m0s
  values:
    defaultPodOptions:
      securityContext:
        supplementalGroups:
          - 816
    controllers:
      sabnzbd:  
        containers:
          app:
            env:
              TZ: Australia/Sydney
              PUID: "921"
              PGID: "816"
              UMASK: "002"
            image:
              repository: ghcr.io/linuxserver/sabnzbd
              tag: "5.1.3"
    global:
      # app-template 5 only appends an identifier to a generated resource name
      # when more than one of that kind exists; 3.7.3 always appended it. Without
      # this the PVC would be created fresh as `sabnzbd` and the bound
      # `sabnzbd-config` left orphaned with its data.
      #
      # The flag on its own would then suffix the Service and Ingress -- but
      # naming their keys after the release avoids that, because the chart does
      # not append an identifier that already equals the release name. Net
      # result: not one renamed object.
      alwaysAppendIdentifierToResourceName: true
    service:
      # Keyed `sabnzbd` rather than `app`: the key becomes the identifier
      # suffix, and one matching the release name is dropped. See the global
      # block above.
      sabnzbd:
        controller: sabnzbd
        ports:
          http:
            port: 8080
    ingress:
      # Keyed `sabnzbd` for the same reason as the service above. Keeping the
      # Ingress name also keeps its cert-manager Certificate: the ingress-shim
      # owns Certificates by ownerReference, so a renamed Ingress gets pruned
      # and the Certificate garbage-collected with it (#3265).
      sabnzbd:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        hosts:
          - host: sabnzbd.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: sabnzbd
                  port: 8080
        tls:
          - secretName: tls.sabnzbd
            hosts:
              - sabnzbd.${BASE_DOMAIN}
    persistence:
      config:
        # Keeps the claim if the chart ever stops rendering it -- which is exactly
        # what the app-template 5 migration does (#3265), where the PVC moves to
        # `existingClaim` and would otherwise be pruned with its data.
        retain: true
        enabled: true
        storageClass: longhorn
        size: 1Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /config
      downloads:
        enabled: true
        type: nfs
        server: nas
        path: /mnt/tank/media/downloads_nzb
        globalMounts:
          - path: /media/downloads_nzb
