---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: transmission
  namespace: vpn
spec:
  dependsOn:
    - name: vpn-gateway
      namespace: network
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 10m
  values:
    global:
      # app-template 5 only appends an identifier to a generated resource name
      # when more than one of that kind exists; the old chart always appended it.
      # Without this the PVC would be created fresh as `transmission` and the
      # bound `transmission-config2` orphaned with its settings and torrent
      # state.
      #
      # The flag on its own would then suffix the Service, Ingress and
      # Deployment -- but naming their keys after the release avoids that,
      # because the chart does not append an identifier that already equals the
      # release name. Net result: not one renamed object.
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      hostname: transmission
      annotations:
        # Routes this pod's traffic through the vpn-gateway. The pod-gateway
        # mutating webhook keys off this annotation, so it must stay on the pod
        # template -- same as qbittorrent.
        setGateway: "true"
        backup.velero.io/backup-volumes: config2
      # The old chart left this at the Kubernetes default of true; app-template
      # defaults it to false. Keep the old behaviour rather than quietly
      # changing the container's environment.
      enableServiceLinks: true
      # 816 is the NAS media group; without it the downloads NFS mount is not
      # writable.
      securityContext:
        supplementalGroups:
          - 816
    controllers:
      # Keyed `transmission`, not `main`: see the global block above.
      transmission:
        type: deployment
        containers:
          # Keyed `transmission` so the container keeps its name, which is the
          # `container` label on every log line in Loki and the argument to
          # `kubectl exec -c transmission`.
          transmission:
            image:
              repository: ghcr.io/linuxserver/transmission
              tag: 4.0.6-r4-ls291
              pullPolicy: IfNotPresent
            env:
              TZ: "Australia/Sydney"
              TRANSMISSION_WEB_HOME: /usr/share/transmission/public_html
              PUID: "921"
              PGID: "816"
              UMASK: "002"
              TRANSMISSION_DOWNLOAD_DIR: /media/downloads/complete
              TRANSMISSION_INCOMPLETE_DIR: /media/downloads/incomplete
              TRANSMISSION_INCOMPLETE_DIR_ENABLED: "true"
              DOCKER_MODS: linuxserver/mods:transmission-trguing-v1.5.1
              # These three came from the old chart's own defaults rather than
              # from this file. Declared explicitly so the pod's environment is
              # unchanged by the migration -- the watch directory stays off, and
              # the RPC password stays the placeholder it has always been (the
              # real one lives in /config, and AuthSubnetWhitelist is what
              # actually gates the web UI).
              TRANSMISSION_RPC_PASSWORD: CHANGEME
              TRANSMISSION_WATCH_DIR: /watch
              TRANSMISSION_WATCH_DIR_ENABLED: "false"
            # app-template does not generate container ports from services, so
            # this is declared explicitly to keep the pod spec identical.
            ports:
              - name: http
                containerPort: 9091
                protocol: TCP
            # Replicating the old chart's defaults exactly, including its 30s
            # probe timeouts: transmission runs the web UI and I/O on the same
            # thread, so heavy bandwidth use stalls the UI and a 1s timeout
            # restarts the pod.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9091
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9091
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 30
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9091
                  initialDelaySeconds: 0
                  failureThreshold: 30
                  periodSeconds: 5
                  timeoutSeconds: 1
            resources:
              requests:
                cpu: "100m"
                memory: "1000Mi"
              limits:
                memory: "4000Mi"
          # Was `addons.netshoot.enabled: true`; app-template 5 has no addons,
          # so the sidecar is declared directly. Image tag and NET_ADMIN are the
          # old chart's own defaults, kept as-is so the pod spec is unchanged.
          netshoot:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.16
              pullPolicy: IfNotPresent
            command:
              - /bin/sh
              - -c
              - sleep infinity
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN

    service:
      # Keyed `transmission` so the Service keeps its name under the flag above.
      transmission:
        controller: transmission
        ports:
          http:
            port: 9091
            targetPort: http

    ingress:
      # Keyed `transmission` for the same reason as the service above. Keeping
      # the Ingress name also keeps its cert-manager Certificate: the
      # ingress-shim owns Certificates by ownerReference, so a renamed Ingress
      # gets pruned and tls.transmission garbage-collected with it (#3265).
      transmission:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          hajimari.io/enable: 'true'
          hajimari.io/icon: 'download'
          hajimari.io/appName: 'Transmission'
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        #   external-dns.alpha.kubernetes.io/target: ingress.$${DOMAIN_1}
        #   traefik.ingress.kubernetes.io/router.entrypoints: websecure
        #   traefik.ingress.kubernetes.io/router.middlewares: system-ingress-rfc1918-ips@kubernetescrd
        hosts:
          - host: transmission.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: transmission
                  port: 9091
        tls:
          - secretName: tls.transmission
            hosts:
              - transmission.${BASE_DOMAIN}

    persistence:
      # Migration to Longhorn complete (verified byte-identical). The old
      # democratic-csi NFS volume is no longer mounted; its PVC is retained
      # out-of-band via helm.sh/resource-policy=keep and deleted separately.
      #
      # Identifier `config2` (not `config`) renders as `transmission-config2`
      # under the global flag above, matching the live claim.
      config2:
        type: persistentVolumeClaim
        storageClass: longhorn
        size: 1Gi
        accessMode: ReadWriteOnce
        # Keeps the claim if the chart ever stops rendering it, so a future
        # identifier change cannot delete the data.
        retain: true
        # advancedMounts, not globalMounts: the old chart mounted nothing into
        # the netshoot sidecar, and a global mount would.
        advancedMounts:
          transmission:
            transmission:
              - path: /config
      downloads:
        type: nfs
        server: nas
        path: /mnt/tank/media/downloads
        advancedMounts:
          transmission:
            transmission:
              - path: /media/downloads
