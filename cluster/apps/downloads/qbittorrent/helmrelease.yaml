---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: vpn
spec:
  dependsOn:
    - name: vpn-gateway
      namespace: network
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 10m
  values:
    global:
      # app-template 5 only appends an identifier to a generated resource name
      # when more than one of that kind exists; 3.7.3 always appended it. Without
      # this the PVC would be created fresh as `qbittorrent` and the bound
      # `qbittorrent-config` orphaned with its data.
      #
      # The controller and service keys are already named after the release, and
      # the ingress key now is too, so nothing gains a suffix: zero renamed
      # objects.
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      hostname: qbittorrent
      annotations:
        setGateway: "true"
      enableServiceLinks: true
      securityContext:
        supplementalGroups:
          - 816
    controllers:
      qbittorrent:
        containers:
          qbittorrent:
            image:
              repository: ghcr.io/linuxserver/qbittorrent
              tag: "5.3.0"
              pullPolicy: IfNotPresent
            env:
              TZ: "Australia/Sydney"
              QBT_Preferences__WebUI__AuthSubnetWhitelist: 10.42.0.0/16
              QBT_Preferences__Downloads__SavePath: /media/downloads
              QBT_Preferences__Downloads__TempPath: /media/downloads/temp/
              QBT_Preferences__WebUI__AuthSubnetWhitelistEnabled: 'true'
              PUID: "921"
              PGID: "816"
              UMASK: "002"
              DOCKER_MODS: ghcr.io/vuetorrent/vuetorrent-lsio-mod:2.37.0
            ports:
              - name: http
                containerPort: 8080
                protocol: TCP
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  timeoutSeconds: 1
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  timeoutSeconds: 1
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 0
                  failureThreshold: 30
                  timeoutSeconds: 1
                  periodSeconds: 5
            resources:
              requests:
                cpu: "0.3"
                memory: "256Mi"
              limits:
                memory: "400Mi"
          netshoot:
            image:
              repository: ghcr.io/nicolaka/netshoot
              tag: v0.16
            command:
              - /bin/sh
              - -c
              - sleep infinity
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
    service:
      qbittorrent:
        controller: qbittorrent
        ports:
          http:
            port: 8080
            targetPort: http
    ingress:
      # Keyed `qbittorrent` so the Ingress keeps its name under the flag above.
      qbittorrent:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          hajimari.io/enable: 'true'
          hajimari.io/icon: 'download'
          hajimari.io/appName: 'QBittorrent'
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        hosts:
            - host: qbittorrent.${BASE_DOMAIN}
              paths:
                - path: /
                  service:
                    identifier: qbittorrent
                    port: 8080
        tls:
          - secretName: tls.qbittorrent
            hosts:
              - qbittorrent.${BASE_DOMAIN}
    persistence:
      config:
        # Keeps the claim if the chart ever stops rendering it -- which is exactly
        # what the app-template 5 migration does (#3265), where the PVC moves to
        # `existingClaim` and would otherwise be pruned with its data.
        retain: true
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          qbittorrent:
            qbittorrent:
              - path: /config
      downloads:
        enabled: true
        type: nfs
        server: nas
        path: /mnt/tank/media/downloads
        advancedMounts:
          qbittorrent:
            qbittorrent:
              - path: /media/downloads
