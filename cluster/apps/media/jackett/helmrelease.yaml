---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: jackett
  namespace: media
spec:
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://k8s-at-home.com/charts/
      chart: jackett
      version: 11.7.2
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
        namespace: flux-system
      interval: 10m
  values:
    podAnnotations:
      backup.velero.io/backup-volumes: config,config2
    image:
      repository: ghcr.io/linuxserver/jackett
      tag: "0.24.2713"
      pullPolicy: IfNotPresent

    env:
      TZ: "Australia/Sydney"

    persistence:
      # Old democratic-csi NFS volume. Kept enabled and chart-managed so Helm never
      # drops it from the manifest; only the init container reads it now.
      config:
        enabled: true
        mountPath: /config-old
        readOnly: true
      # New Longhorn volume, mounted where the app expects its config.
      config2:
        enabled: true
        mountPath: /config
        storageClass: longhorn
        size: 1Gi
        accessMode: ReadWriteOnce

    # One-shot copy NFS -> Longhorn on first boot. Guarded by a sentinel file so a
    # partial copy is retried rather than silently treated as done. Remove this
    # block (and disable the `config` volume) once the migration is confirmed.
    initContainers:
      migrate-config:
        name: migrate-config
        image: busybox:1.36.1
        command:
          - /bin/sh
          - -c
          - |
            if [ -f /new/.migration-complete ]; then
              echo "already migrated, nothing to do"
              exit 0
            fi
            echo "copying /old -> /new"
            cp -a /old/. /new/
            touch /new/.migration-complete
            echo "migration complete"
        volumeMounts:
          - name: config
            mountPath: /old
            readOnly: true
          - name: config2
            mountPath: /new
    # service:
    #   main:
    #     annotations:
    #       external-dns.alpha.kubernetes.io/hostname: jackettsvc.${BASE_DOMAIN}
    #     type: LoadBalancer
    #     externalTrafficPolicy: Local

    ingress:
      main:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        hosts:
          - host: jackett.${BASE_DOMAIN}
            paths:
              - path: /
        tls:
          - secretName: tls.jackett
            hosts:
              - jackett.${BASE_DOMAIN}

    resources:
      requests:
        cpu: "0.02"
        memory: "256M"
      limits:
        memory: "512M"
