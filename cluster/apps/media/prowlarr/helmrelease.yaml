---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: media
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 10m0s
  values:
    global:
      # app-template 5 only appends an identifier to a generated resource name
      # when more than one of that kind exists; the k8s-at-home charts always
      # appended it. Without this the PVC renders as `prowlarr` instead of
      # `prowlarr-config`, so the live claim is orphaned and a fresh empty one
      # bound -- and the Longhorn StorageClass reclaims with Delete, so the
      # indexer config and API key go with it.
      #
      # The flag would normally also suffix the Deployment, Service and Ingress,
      # but app-template never appends an identifier that already equals the
      # release name, so naming those keys `prowlarr` keeps every one of them
      # exactly as it is today. The Ingress name in particular has to hold: the
      # `tls.prowlarr` Certificate is owned by an ownerReference to it, so a
      # rename would have Kubernetes garbage-collect the Certificate and TLS
      # would then quietly stop renewing. See #3265.
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      # The k8s-at-home common library left this at the Kubernetes default of
      # true; app-template defaults it to false. Kept so the container still
      # sees the <SERVICE>_PORT_* variables for the namespace.
      enableServiceLinks: true
      annotations:
        # Names the pod volume, which app-template still calls `config` after
        # the persistence key below -- so the Velero hook keeps working.
        backup.velero.io/backup-volumes: config
      securityContext:
        supplementalGroups:
          - 816
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-class
                    operator: In
                    values:
                      - faster
    controllers:
      # Keyed `prowlarr`, not `main`: see the global block above.
      prowlarr:
        containers:
          # Keyed `prowlarr` so the container keeps its name, which is the
          # `container` label on every log line in Loki.
          prowlarr:
            image:
              repository: ghcr.io/linuxserver/prowlarr
              tag: "2.7.0"
              pullPolicy: IfNotPresent
            env:
              TZ: "Australia/Sydney"
            # app-template does not derive container ports from services, so the
            # port the Service targets by name is declared explicitly.
            ports:
              - name: http
                containerPort: 9696
                protocol: TCP
            # Replicating the old chart's defaults exactly: TCP checks against
            # 9696, startup allowed 150s before it gives up.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9696
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  timeoutSeconds: 1
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9696
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  timeoutSeconds: 1
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9696
                  initialDelaySeconds: 0
                  failureThreshold: 30
                  timeoutSeconds: 1
                  periodSeconds: 5
    service:
      # Keyed `prowlarr` so the Service keeps its name -- sonarr, radarr and
      # lidarr reach this at http://prowlarr:9696 from config stored in their
      # own databases, not in this repo.
      prowlarr:
        controller: prowlarr
        ports:
          http:
            port: 9696
            targetPort: http
    ingress:
      # Keyed `prowlarr` so the Ingress keeps its name and the shim-owned
      # `tls.prowlarr` Certificate is not garbage-collected.
      prowlarr:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        hosts:
          - host: prowlarr.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: prowlarr
                  port: 9696
        tls:
          - secretName: tls.prowlarr
            hosts:
              - prowlarr.${BASE_DOMAIN}
    persistence:
      config:
        # Adds helm.sh/resource-policy: keep. The live claim carries no such
        # annotation (#3266 only covered the app-template releases), so until
        # this lands a chart that stops rendering the PVC would have Helm delete
        # it -- and Longhorn would then destroy the volume.
        retain: true
        enabled: true
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /config
      # Both disabled in the old values and so never mounted; carried across
      # unchanged so this stays a pure chart migration.
      downloads:
        enabled: false
        type: nfs
        server: nas
        path: /mnt/tank/media/downloads
        globalMounts:
          - path: /media/downloads
      downloads-nzb:
        enabled: false
        type: nfs
        server: nas
        path: /mnt/tank/media/downloads_nzb
        globalMounts:
          - path: /media/downloads_nzb
