apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: jellyfin
  namespace: media
spec:
  endpoints:
    - dnsName: jellyfin.${EXTERNAL_DOMAIN}
      recordType: CNAME
      recordTTL: 300
      targets:
        - link1.${EXTERNAL_DOMAIN}
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
