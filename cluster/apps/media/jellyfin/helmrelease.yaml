---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 10m
  values:
    global:
      # app-template 5 only appends an identifier to a generated resource name
      # when more than one of that kind exists; the k8s-at-home charts always
      # appended it. Without this the PVC renders as `jellyfin` instead of
      # `jellyfin-data`, so the live claim is orphaned and a fresh empty one
      # bound -- and the Longhorn StorageClass reclaims with Delete, so the
      # library database, users and watch history go with it.
      #
      # The flag would normally also suffix the Deployment, Service and Ingress,
      # but app-template never appends an identifier that already equals the
      # release name, so naming those keys `jellyfin` keeps every one of them
      # exactly as it is today. Two of those names are load-bearing beyond
      # tidiness: the `tls.jellyfin` Certificate is owned by an ownerReference
      # to the Ingress, so a rename would have Kubernetes garbage-collect it and
      # TLS would quietly stop renewing; and the `jellyfin-restart` release in
      # daily-restart.yaml restarts `deployment/jellyfin` by name every night.
      # See #3265.
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      # The k8s-at-home common library left this at the Kubernetes default of
      # true; app-template defaults it to false. Kept so the container still
      # sees the <SERVICE>_PORT_* variables for the namespace.
      enableServiceLinks: true
      annotations:
        # Carried across as-is. Note this names the `config` volume, which since
        # the Longhorn migration is the NFS transcode cache -- not the Longhorn
        # claim under the `data` key that actually holds /config. Probably not
        # what was intended, but changing which volume Velero backs up is a
        # behaviour change and does not belong in a chart migration.
        backup.velero.io/backup-volumes: config
      nodeSelector:
        # Only schedule where node-feature-discovery found an Intel display
        # controller, because the pod requests an i915 GPU below.
        feature.node.kubernetes.io/pci-0300_8086.present: 'true'
        storage: longhorn
      securityContext:
        supplementalGroups:
          - 816
          # video group, for /dev/dri access to the iGPU
          - 107
    controllers:
      # Keyed `jellyfin`, not `main`: see the global block above.
      jellyfin:
        containers:
          # Keyed `jellyfin` so the container keeps its name, which is the
          # `container` label on every log line in Loki.
          jellyfin:
            image:
              repository: jellyfin/jellyfin
              tag: 10.11.11
              pullPolicy: IfNotPresent
            env:
              TZ: "Australia/Sydney"
            # app-template does not derive container ports from services, so the
            # port the Service targets by name is declared explicitly.
            ports:
              - name: http
                containerPort: 8096
                protocol: TCP
            # Replicating the old chart's defaults exactly: TCP checks against
            # 8096, startup allowed 150s before it gives up.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8096
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  timeoutSeconds: 1
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8096
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  timeoutSeconds: 1
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8096
                  initialDelaySeconds: 0
                  failureThreshold: 30
                  timeoutSeconds: 1
                  periodSeconds: 5
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
                # Intel QuickSync hardware transcoding, handed out by the
                # intel-device-plugins i915 plugin. Requests and limits must
                # match -- it is a non-overcommittable extended resource.
                gpu.intel.com/i915: 1
              limits:
                gpu.intel.com/i915: 1
    service:
      # Keyed `jellyfin` so the Service keeps its name.
      jellyfin:
        controller: jellyfin
        ports:
          http:
            port: 8096
            targetPort: http
    ingress:
      # Keyed `jellyfin` so the Ingress keeps its name and the shim-owned
      # `tls.jellyfin` Certificate is not garbage-collected.
      jellyfin:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
        hosts:
          - host: jellyfin.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: jellyfin
                  port: 8096
        tls:
          - secretName: tls.jellyfin
            hosts:
              - jellyfin.${BASE_DOMAIN}
    # The externally-published hostname, as a Gateway API HTTPRoute rendered by
    # app-template itself rather than a hand-written manifest beside it.
    #
    # One hostname, both paths -- but by router PORT-FORWARD, not the tunnel:
    #
    #   LAN       internal record -> traefik-external's LB IP -> this route
    #   internet  DNS-only CNAME -> dynamic-DNS name -> port-forward -> this route
    #
    # Not the tunnel, because of Cloudflare's terms for Free/Pro/Business:
    #
    #   "Cloudflare reserves the right to disable or limit your access to or use
    #   of the CDN ... if you use or are suspected of using the CDN without such
    #   Paid Services to serve video or a disproportionate percentage of
    #   pictures, audio files, or other large files."
    #
    # A cfargotunnel.com target cannot be DNS-only, so tunnel traffic is proxied
    # by definition and streaming through it risks the ACCOUNT, not just this
    # host. The port-forward keeps the bytes off Cloudflare's network entirely.
    #
    # Accepted knowingly on this path: the WAN address is exposed, inbound 443 is
    # open, and there is no WAF or DDoS protection in front. The access log still
    # records the real remote peer -- traefik-external trusts X-Forwarded-For
    # only from 10.42.0.0/16, and an internet client's TCP peer is itself, so its
    # XFF is ignored rather than believed.
    #
    # The internal record needs no annotation: external-dns reads an HTTPRoute's
    # target from its GATEWAY's status.addresses, which Traefik populates with
    # traefik-external's LoadBalancer address.
    #
    # NOTE the jellyfin.${BASE_DOMAIN} Ingress above is untouched and still
    # served by the internal Traefik with an internal-CA cert. This is additive.
    route:
      external:
        # Live. The preconditions are met: the wildcard *.borgs.net Certificate
        # is issued (#3441), and the Gateway is programmed with
        # addresses=192.168.10.178 and websecure Programmed=True -- which only
        # became true after Gateway API went to v1.7.0 (#3449), because Traefik
        # 3.7 blocks its whole Gateway provider on a TLSRoute watch that no
        # v1.4.0 CRD could serve.
        #
        # This publishes jellyfin.borgs.net on the LAN only, and that is the
        # point of enabling it now: external-dns derives the internal record
        # from the GATEWAY's status.addresses, so the name resolves to
        # traefik-external and is served with the real Let's Encrypt wildcard --
        # testable end to end before any of the external plumbing exists.
        #
        # The public half is already half-built: dnsendpoint.yaml is live and
        # targets link1.${EXTERNAL_DOMAIN}, DNS-only. It publishes nothing yet,
        # because external-dns-cloudflare is still commented out of
        # cluster/core/network-system/dns/kustomization.yaml pending its API
        # token -- so the record exists as an object with no publisher.
        #
        # Nothing here opens an inbound path either way: that needs the router
        # port-forward of :443 to 192.168.10.178.
        enabled: true
        hostnames:
          - jellyfin.${EXTERNAL_DOMAIN}
        parentRefs:
          # sectionName pins it to the HTTPS listener, so it can never attach to
          # the chart's default HTTP one.
          - name: external
            namespace: network-system
            sectionName: websecure
        rules:
          - backendRefs:
              # `identifier` references the service defined in these values
              # rather than repeating a literal name, so a rename cannot leave a
              # dangling backendRef.
              - identifier: jellyfin
                port: 8096
      # The HTTP->HTTPS redirect for this host, as its own route on the `web`
      # listener. Per host rather than a blanket entrypoint redirect, so :80
      # still 404s for anything that has not opted in.
      #
      # A separate route and not another rule on the one above: a route's rules
      # apply to all of its parentRefs, so serving the backend on websecure and
      # redirecting on web cannot be expressed in a single route.
      #
      # 301, and no backendRef -- the filter terminates the request at Traefik.
      external-redirect:
        hostnames:
          - jellyfin.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: external
            namespace: network-system
            sectionName: web
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
    persistence:
      # Transcode cache, mounted directly from the NAS instead of via the
      # democratic-csi NFS provisioner. Same dataset, same data -- only the
      # provisioning path changes. See frigate's `media` volume for the pattern.
      #
      # Still keyed `config` even though it mounts at /cache: the key names the
      # pod volume, which the Velero annotation above refers to.
      config:
        enabled: true
        type: nfs
        server: nas.home
        path: /mnt/tank/k8s/nfs/pvc-d7d148b3-6168-44bd-b9be-91b8251a0de7
        globalMounts:
          - path: /cache
      data:
        # Adds helm.sh/resource-policy: keep. The live claim carries no such
        # annotation (#3266 only covered the app-template releases), so until
        # this lands a chart that stops rendering the PVC would have Helm delete
        # it -- and Longhorn would then destroy the volume.
        retain: true
        enabled: true
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 13Gi
        globalMounts:
          - path: /config
      media-movies:
        enabled: true
        type: nfs
        server: nas.home
        path: /mnt/tank/media/movies
        globalMounts:
          - path: /media/movies
      media-tv:
        enabled: true
        type: nfs
        server: nas.home
        path: /mnt/tank/media/tv
        globalMounts:
          - path: /media/tv
      media-music:
        enabled: true
        type: nfs
        server: nas.home
        path: /mnt/tank/media/music
        globalMounts:
          - path: /media/music
