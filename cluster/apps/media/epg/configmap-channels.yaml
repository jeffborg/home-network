---
# Shepherd's channel subscriptions and the xmltv_ids it publishes.
#
# Shepherd normally derives xmltv_ids from MythTV or invents them, which makes
# them local to one install. These are pinned to YourTV's channel ids instead:
# that is the id Shepherd's own grabbers key on, so it survives a channel being
# renamed, and it stays stable if the guide is ever rebuilt from a different
# source. Whatever consumes this -- TVHeadend now, MythTV later -- maps channels
# once against these ids.
#
# Generated -- do not edit by hand. From a checkout of jeffborg/shepherd:
#   util/check_channel_map.py --region 184 --dump-channels-conf '{id}.yourtv.au'
# Keys are the names Shepherd itself uses, resolved through the same
# translation its grabbers apply.
#
#   region:   184 (Newcastle)
#   channels: 33
#
# Newcastle broadcasts two channels called "7" and two called "Sky News
# Regional" (SD/HD pairs). Shepherd's config is keyed by channel name, so it
# can only hold one of each pair -- hence 33 rather than 35.
apiVersion: v1
kind: ConfigMap
metadata:
  name: epg-channels
  namespace: media
data:
  channels.conf: |
    $channels = {
      '10' => '289726.yourtv.au',
      '10 Comedy' => '422290.yourtv.au',
      '10 Drama' => '406681.yourtv.au',
      '10HD' => '431702.yourtv.au',
