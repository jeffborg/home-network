---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lidarr
  namespace: media
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 10m0s
  values:
    global:
      # app-template 5 only appends an identifier to a generated resource name
      # when more than one of that kind exists; the k8s-at-home charts always
      # appended it. Without this the PVC renders as `lidarr` instead of
      # `lidarr-config`, so the live claim is orphaned and a fresh empty one
      # bound -- and the Longhorn StorageClass reclaims with Delete, so the
      # music library database goes with it.
      #
      # The flag would normally also suffix the Deployment, Service and Ingress,
      # but app-template never appends an identifier that already equals the
      # release name, so naming those keys `lidarr` keeps every one of them
      # exactly as it is today. The Ingress name in particular has to hold: the
      # `tls.lidarr` Certificate is owned by an ownerReference to it, so a
      # rename would have Kubernetes garbage-collect the Certificate and TLS
      # would then quietly stop renewing. See #3265.
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      # The k8s-at-home common library left this at the Kubernetes default of
      # true; app-template defaults it to false. Kept so the container still
      # sees the <SERVICE>_PORT_* variables for the namespace.
      enableServiceLinks: true
      annotations:
        # Names the pod volume, which app-template still calls `config` after
        # the persistence key below -- so the Velero hook keeps working.
        backup.velero.io/backup-volumes: config
      securityContext:
        supplementalGroups:
          - 816
    controllers:
      # Keyed `lidarr`, not `main`: see the global block above.
      lidarr:
        containers:
          # Keyed `lidarr` so the container keeps its name, which is the
          # `container` label on every log line in Loki.
          lidarr:
            image:
              repository: ghcr.io/linuxserver/lidarr
              tag: "3.1.6"
              pullPolicy: IfNotPresent
            env:
              TZ: "Australia/Sydney"
              PUID: "816"
              PGID: "816"
              DOCKER_MODS: linuxserver/mods:lidarr-flac2mp3-3.0.2
              # Hand the login over to Authelia instead of doing one here, now that
              # this host sits behind the authelia-forwardauth middleware. Without it
              # you get two logins: Authelia's, then lidarr's own Forms page.
              #
              # `External` means the app performs no login of its own and trusts the
              # proxy in front of it. Verified against THIS image (3.1.6) in isolation:
              # with __AUTH__METHOD=Forms a fresh instance answers 302 to its login,
              # with External it answers 200 -- so the variable is read. The 200 alone
              # proves nothing, because a fresh instance defaults to None and is open
              # either way; the Forms contrast is what makes it conclusive.
              #
              # Note the value is NOT written into config.xml -- it is a runtime
              # overlay, which is why it cannot be lost when the app rewrites that
              # file.
              LIDARR__AUTH__METHOD: "External"
            # app-template does not derive container ports from services, so the
            # port the Service targets by name is declared explicitly.
            ports:
              - name: http
                containerPort: 8686
                protocol: TCP
            probes:
              liveness:
                enabled: true
                custom: true
                # The old chart's own default, carried across verbatim: a TCP
                # check is not enough for Lidarr, so this scrapes the API key
                # out of config.xml and hits /system/status with it. Note v1,
                # not the v3 the other *arr apps use.
                spec:
                  exec:
                    command:
                      - /usr/bin/env
                      - bash
                      - -c
                      - 'curl --fail localhost:8686/api/v1/system/status?apiKey=`IFS=\> && while read -d \< E C; do if [[ $E = "ApiKey" ]]; then echo $C; fi; done < /config/config.xml`'
                  failureThreshold: 5
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 10
              # TCP checks against 8686. Startup gets 5 min: a slow start (normally
              # ~10s) once looped for 3 days against the old chart's 150s.
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8686
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  timeoutSeconds: 1
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8686
                  initialDelaySeconds: 0
                  failureThreshold: 60
                  timeoutSeconds: 1
                  periodSeconds: 5
    service:
      # Keyed `lidarr` so the Service keeps its name -- the homepage widgets and
      # the other *arr apps reach this at http://lidarr:8686 from config stored
      # outside this repo.
      lidarr:
        controller: lidarr
        ports:
          http:
            port: 8686
            targetPort: http
    ingress:
      # Keyed `lidarr` so the Ingress keeps its name and the shim-owned
      # `tls.lidarr` Certificate is not garbage-collected.
      # Replaced by the `route` block below: this host is now a 301 to
      # lidarr.${EXTERNAL_DOMAIN} instead of serving the app.
      #
      # Left as `enabled: false` rather than deleted so the previous arrangement is
      # one word away. NOTE this garbage-collects the per-host Certificate below --
      # cert-manager's ingress-shim owns it by ownerReference to this Ingress. That
      # is deliberate: lidarr.${BASE_DOMAIN} is now served by the internal
      # Gateway, whose websecure listener carries its own lidarr-home certificate
      # (see gateway-certificates-internal.yaml).
      lidarr:
        enabled: false
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        hosts:
          - host: lidarr.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: lidarr
                  port: 8686
        tls:
          - secretName: tls.lidarr
            hosts:
              - lidarr.${BASE_DOMAIN}
    route:
      # lidarr.${EXTERNAL_DOMAIN} on the INTERNAL Gateway -- LAN only. Same
      # shape as the other media hosts: the internal Gateway rather than
      # `external`, because the router port-forwards :443 to traefik-external and
      # anything attached there is reachable from the internet by Host header
      # alone. No DNSEndpoint either, which is what publishing actually takes.
      internal:
        hostnames:
          - lidarr.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network-system
            sectionName: websecure
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authelia-forwardauth
            backendRefs:
              - identifier: lidarr
                port: 8686
      internal-http-redirect:
        hostnames:
          - lidarr.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network-system
            sectionName: web
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
      # The old host, 301 to the new one, on BOTH listeners -- a route's rules
      # apply to every parentRef, and the https half needs websecure because TLS
      # is terminated before a redirect can be issued.
      legacy-redirect:
        hostnames:
          - lidarr.${BASE_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network-system
            sectionName: web
          - name: internal
            namespace: network-system
            sectionName: websecure
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  hostname: lidarr.${EXTERNAL_DOMAIN}
                  statusCode: 301
    persistence:
      config:
        # Adds helm.sh/resource-policy: keep. The live claim carries no such
        # annotation (#3266 only covered the app-template releases), so until
        # this lands a chart that stops rendering the PVC would have Helm delete
        # it -- and Longhorn would then destroy the volume.
        retain: true
        enabled: true
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 3Gi
        globalMounts:
          - path: /config
      media-music:
        enabled: true
        type: nfs
        server: nas
        path: /mnt/tank/media/music
        globalMounts:
          - path: /media/music
      downloads:
        enabled: true
        type: nfs
        server: nas
        path: /mnt/tank/media/downloads
        globalMounts:
          - path: /media/downloads
      downloads-nzb:
        enabled: true
        type: nfs
        server: nas
        path: /mnt/tank/media/downloads_nzb
        globalMounts:
          - path: /media/downloads_nzb
