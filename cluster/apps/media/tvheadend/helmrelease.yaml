---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: tvheadend
  namespace: media
spec:
  chart:
    spec:
      # renovate: registryUrl=https://k8s-at-home.com/charts/
      chart: tvheadend
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
        namespace: flux-system
      version: 5.0.1 
  install: {}
  interval: 1m0s
  values:
    podAnnotations:
      backup.velero.io/backup-volumes: config2
    persistence:
      # Migration to Longhorn complete (verified byte-identical). The old
      # democratic-csi iSCSI volume is no longer mounted -- this was the last
      # freenas-iscsi-csi consumer in the cluster. Its PVC is retained
      # out-of-band via helm.sh/resource-policy=keep and deleted separately.
      config:
        enabled: false
      config2:
        enabled: true
        mountPath: /config
        storageClass: longhorn
        size: 2Gi
        accessMode: ReadWriteOnce
      # Mounted directly from the NAS instead of via the democratic-csi NFS
      # provisioner. Same datasets, same data -- only the provisioning path
      # changes. See frigate's `media` volume for the pattern.
      recordings:
        enabled: true
        type: custom
        volumeSpec:
          nfs:
            server: nas.home
            path: /mnt/tank/k8s/nfs/pvc-d1aa46aa-5848-4ea3-a727-0cfbd980845c
        mountPath: /recordings
        readOnly: false
      timeshift:
        enabled: true
        type: custom
        volumeSpec:
          nfs:
            server: nas.home
            path: /mnt/tank/k8s/nfs/pvc-0947b321-7c64-4f62-9de8-82a1b172c7c7
        mountPath: /timeshift
        readOnly: false
      # The official image doesn't ship /usr/bin/tv_grab_url (the linuxserver
      # image did), but the EPG Grabber Module already configured in /config
      # ("XMLTV URL grabber" + an Extra Arguments URL -- see d76adc28) depends
      # on that exact path existing. `type: custom` because the chart's
      # common library predates the configMap persistence type.
      tv-grab-url:
        enabled: true
        type: custom
        volumeSpec:
          configMap:
            name: tvheadend-tv-grab-url
            defaultMode: 0755
        mountPath: /usr/bin/tv_grab_url
        subPath: tv_grab_url
        readOnly: true
    service:
      main:
        ports:
          htsp:
            enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/hostname: tvh.${BASE_DOMAIN}
        type: LoadBalancer
        externalTrafficPolicy: Local

    ingress:
      main:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          hajimari.io/enable: 'true'
          hajimari.io/icon: 'home-automation'
          hajimari.io/appName: 'TV Head end'
        tls:
          - hosts:
            - tvheadend.${BASE_DOMAIN}
            secretName: tvheadend-tls
        hosts:
          - host: tvheadend.${BASE_DOMAIN}
            paths:
              - path: /
    env:
      TZ: Australia/Sydney
      # No /etc/passwd entry exists for an arbitrary runAsUser, so HOME must
      # be set explicitly -- otherwise anything doing a home-directory lookup
      # (getpwuid) falls over.
      HOME: /config
    image:
      repository: ghcr.io/tvheadend/tvheadend
      # Upstream publishes no versioned tags, only latest/master/edge (and
      # their -debian variants) -- see docker/README.md. Renovate can't
      # track this for updates without a digest, so `pullPolicy: Always`
      # plus the existing daily-restart.yaml (2am rollout-restart) is what
      # actually keeps this current, instead of a Renovate PR.
      tag: latest
      pullPolicy: Always

    # The official image's default config/data directory is
    # /var/lib/tvheadend (see docker/README.md), not /config. TVHeadend's
    # --config flag overrides that detection outright, so the existing PVC
    # mount path doesn't need to change.
    args:
      - --config
      - /config

    # to access tv tuner
    nodeSelector:
      feature.node.kubernetes.io/custom-dvb_usb_dib0700: 'true'

    # /dev/dvb/adapter*/frontend0 etc are mode crw-rw---- root:44 (confirmed
    # live), owned by neither our runAsUser 1001 nor its group -- that's what
    # broke adapter access after the image swap. This is a plain DAC group
    # check, not something `privileged: true` grants on its own to a
    # non-root uid (capabilities are a separate mechanism from file
    # permissions, and don't get carried into a non-root process's effective
    # set regardless of privileged mode). Adding gid 44 as a supplementary
    # group satisfies the normal permission check directly, without needing
    # to run as root.
    podSecurityContext:
      runAsUser: 1001
      runAsGroup: 1001
      supplementalGroups:
        - 44

    securityContext:
      privileged: true

    #podAnnotations:
    #  k8s.v1.cni.cncf.io/networks: |
    #    [{
    #      "name":"macvlan-home-static",
    #      "namespace": "system",
    #      "ips": ["192.168.58.201/24"]
    #    }]

    resources:
      requests:
        cpu: "0.3"
        memory: "256Mi"
      limits:
        memory: "512Mi"
