---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: tvheadend
  namespace: media
spec:
  chart:
    spec:
      # renovate: registryUrl=https://k8s-at-home.com/charts/
      chart: tvheadend
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
        namespace: flux-system
      version: 5.0.1 
  install: {}
  interval: 1m0s
  values:
    podAnnotations:
      backup.velero.io/backup-volumes: config,config2
    persistence:
      # Old democratic-csi iSCSI volume -- the last freenas-iscsi-csi consumer in the
      # cluster. Kept enabled and chart-managed so Helm never drops it from the
      # manifest; only the init container reads it now. The deprecated
      # volume.beta.kubernetes.io/storage-class annotation, size and accessMode are
      # all preserved verbatim so the rendered PVC is unchanged (the live PVC has no
      # spec.storageClassName at all -- it binds via that annotation).
      config:
        enabled: true
        annotations:
          volume.beta.kubernetes.io/storage-class: "freenas-iscsi-csi"
        size: 2Gi
        accessMode: ReadWriteOnce
        mountPath: /config-old
        readOnly: true
      # New Longhorn volume, mounted where tvheadend expects its config.
      config2:
        enabled: true
        mountPath: /config
        storageClass: longhorn
        size: 2Gi
        accessMode: ReadWriteOnce
      recordings:
        enabled: true
        size: 100Gi
        accessMode: ReadWriteMany
      timeshift:
        enabled: true
        size: 10.1Gi
        accessMode: ReadWriteMany

    # One-shot copy iSCSI -> Longhorn on first boot (block/xfs -> file). Guarded by a
    # sentinel file so a partial copy is retried rather than silently treated as done.
    # Remove this block (and disable the `config` volume) once the migration is
    # confirmed.
    initContainers:
      migrate-config:
        name: migrate-config
        image: busybox:1.36.1
        command:
          - /bin/sh
          - -c
          - |
            if [ -f /new/.migration-complete ]; then
              echo "already migrated, nothing to do"
              exit 0
            fi
            echo "copying /old -> /new"
            cp -a /old/. /new/
            touch /new/.migration-complete
            echo "migration complete"
        volumeMounts:
          - name: config
            mountPath: /old
            readOnly: true
          - name: config2
            mountPath: /new
    service:
      main:
        ports:
          htsp:
            enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/hostname: tvh.${BASE_DOMAIN}
        type: LoadBalancer
        externalTrafficPolicy: Local

    ingress:
      main:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          hajimari.io/enable: 'true'
          hajimari.io/icon: 'home-automation'
          hajimari.io/appName: 'TV Head end'
        tls:
          - hosts:
            - tvheadend.${BASE_DOMAIN}
            secretName: tvheadend-tls
        hosts:
          - host: tvheadend.${BASE_DOMAIN}
            paths:
              - path: /
    env:
      TZ: Australia/Sydney
    image:
      repository: ghcr.io/linuxserver/tvheadend
      tag: version-653bd040

    # to access tv tuner
    nodeSelector:
      feature.node.kubernetes.io/custom-dvb_usb_dib0700: 'true'

    securityContext:
      privileged: true

    #podAnnotations:
    #  k8s.v1.cni.cncf.io/networks: |
    #    [{
    #      "name":"macvlan-home-static",
    #      "namespace": "system",
    #      "ips": ["192.168.58.201/24"]
    #    }]

    resources:
      requests:
        cpu: "0.3"
        memory: "256Mi"
      limits:
        memory: "512Mi"
