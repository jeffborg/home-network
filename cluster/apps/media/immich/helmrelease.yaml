---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: media
spec:
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 10m
  values:
    controllers:
      server:
        # One server at a time: startup runs the DB migrations.
        strategy: Recreate
        pod:
          # Owns the library on the NAS, like the *arr apps (root is squashed).
          securityContext:
            runAsUser: 816
            runAsGroup: 816
            fsGroup: 816
        containers:
          server:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.4.1
            env:
              TZ: Australia/Sydney
              # Direct, not the pooler: migrations take session advisory locks.
              DB_HOSTNAME: postgres-rw.database-system.svc.cluster.local
              DB_DATABASE_NAME: immich
              DB_USERNAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-pgsql
                    key: password
              REDIS_HOSTNAME: immich-valkey
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
            ports:
              - name: http
                containerPort: 2283
            probes:
              liveness: &serverprobe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: 2283
                  periodSeconds: 10
                  failureThreshold: 3
              readiness: *serverprobe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: 2283
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
      machine-learning:
        pod:
          nodeSelector:
            feature.node.kubernetes.io/pci-0300_8086.present: 'true'
        containers:
          machine-learning:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              # OpenVINO build, for the Intel iGPU.
              tag: v3.4.1-openvino
            env:
              TZ: Australia/Sydney
              MACHINE_LEARNING_MODEL_REVISION: v2
            ports:
              - name: http
                containerPort: 3003
            probes:
              liveness: &mlprobe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 3003
                  periodSeconds: 10
                  failureThreshold: 3
              readiness: *mlprobe
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
                gpu.intel.com/i915: 1
              limits:
                memory: 6Gi
                gpu.intel.com/i915: 1
      valkey:
        containers:
          valkey:
            image:
              repository: docker.io/valkey/valkey
              tag: 9.1.4
            ports:
              - name: redis
                containerPort: 6379
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
    service:
      server:
        controller: server
        ports:
          http:
            port: 2283
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: 3003
      valkey:
        controller: valkey
        ports:
          redis:
            port: 6379
    # Internal-only for now: no DNSEndpoint, so only the LAN record exists.
    route:
      external:
        hostnames:
          - photos.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: external
            namespace: network-system
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: server
                port: 2283
      external-redirect:
        hostnames:
          - photos.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: external
            namespace: network-system
            sectionName: web
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
    persistence:
      # Immich-managed: uploads, thumbnails, encoded video. Its own dataset, as
      # Immich owns the layout; the only copy once iCloud is trimmed.
      library:
        type: nfs
        server: nas.home
        path: /mnt/tank/media/immich
        advancedMounts:
          server:
            server:
              - path: /data
      # Existing photos, indexed in place as an External Library; any layout.
      photos:
        type: nfs
        server: nas.home
        path: /mnt/tank/media/photos
        advancedMounts:
          server:
            server:
              - path: /external/photos
                readOnly: true
      # Downloaded models (~1 GiB); kept so a restart doesn't refetch them.
      model-cache:
        retain: true
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
        advancedMounts:
          machine-learning:
            machine-learning:
              - path: /cache
