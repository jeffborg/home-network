---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: media
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 10m0s
  values:
    global:
      # app-template 5 only appends an identifier to a generated resource name
      # when more than one of that kind exists; the k8s-at-home charts always
      # appended it. Without this the PVC renders as `radarr` instead of
      # `radarr-config`, so the live claim is orphaned and a fresh empty one
      # bound -- and the Longhorn StorageClass reclaims with Delete, so the
      # movie library database goes with it.
      #
      # The flag would normally also suffix the Deployment, Service and Ingress,
      # but app-template never appends an identifier that already equals the
      # release name, so naming those keys `radarr` keeps every one of them
      # exactly as it is today. The Ingress name in particular has to hold: the
      # `tls.radarr` Certificate is owned by an ownerReference to it, so a
      # rename would have Kubernetes garbage-collect the Certificate and TLS
      # would then quietly stop renewing. See #3265.
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      # The k8s-at-home common library left this at the Kubernetes default of
      # true; app-template defaults it to false. Kept so the container still
      # sees the <SERVICE>_PORT_* variables for the namespace.
      enableServiceLinks: true
      annotations:
        # Names the pod volume, which app-template still calls `config` after
        # the persistence key below -- so the Velero hook keeps working.
        backup.velero.io/backup-volumes: config
      securityContext:
        supplementalGroups:
          - 816
    controllers:
      # Keyed `radarr`, not `main`: see the global block above.
      radarr:
        containers:
          # Keyed `radarr` so the container keeps its name, which is the
          # `container` label on every log line in Loki.
          radarr:
            image:
              repository: ghcr.io/linuxserver/radarr
              tag: "7.0.3"
              pullPolicy: IfNotPresent
            env:
              TZ: "Australia/Sydney"
              PUID: "816"
              PGID: "816"
            # app-template does not derive container ports from services, so the
            # port the Service targets by name is declared explicitly.
            ports:
              - name: http
                containerPort: 7878
                protocol: TCP
            probes:
              liveness:
                enabled: true
                custom: true
                # The old chart's own default, carried across verbatim: a TCP
                # check is not enough for Radarr, so this scrapes the API key
                # out of config.xml and hits /system/status with it.
                spec:
                  exec:
                    command:
                      - /usr/bin/env
                      - bash
                      - -c
                      - 'curl --fail localhost:7878/api/v3/system/status?apiKey=`IFS=\> && while read -d \< E C; do if [[ $E = "ApiKey" ]]; then echo $C; fi; done < /config/config.xml`'
                  failureThreshold: 5
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 10
              # Replicating the old chart's defaults exactly: TCP checks against
              # 7878, startup allowed 150s before it gives up.
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 7878
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  timeoutSeconds: 1
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 7878
                  initialDelaySeconds: 0
                  failureThreshold: 30
                  timeoutSeconds: 1
                  periodSeconds: 5
    service:
      # Keyed `radarr` so the Service keeps its name -- seerr/ombi and the
      # homepage widgets reach this at http://radarr:7878 from config stored
      # outside this repo.
      radarr:
        controller: radarr
        ports:
          http:
            port: 7878
            targetPort: http
    ingress:
      # Keyed `radarr` so the Ingress keeps its name and the shim-owned
      # `tls.radarr` Certificate is not garbage-collected.
      # Replaced by the `route` block below: this host is now a 301 to
      # radarr.${EXTERNAL_DOMAIN} instead of serving the app.
      #
      # Left as `enabled: false` rather than deleted so the previous arrangement is
      # one word away. NOTE this garbage-collects the per-host Certificate below --
      # cert-manager's ingress-shim owns it by ownerReference to this Ingress. That
      # is deliberate: radarr.${BASE_DOMAIN} is now served by the internal
      # Gateway, whose websecure listener carries its own radarr-home certificate
      # (see gateway-certificates-internal.yaml).
      radarr:
        enabled: false
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        hosts:
          - host: radarr.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: radarr
                  port: 7878
        tls:
          - secretName: tls.radarr
            hosts:
              - radarr.${BASE_DOMAIN}
    route:
      # radarr.${EXTERNAL_DOMAIN} on the INTERNAL Gateway -- LAN only.
      #
      # The internal Gateway, not `external`: the router port-forwards :443 to
      # traefik-external, so anything attached to that Gateway is reachable from
      # the internet by Host header alone, with no DNS record needed. Attaching
      # here means the name resolves to traefik's own LB address and is served
      # only on the LAN.
      #
      # No DNSEndpoint and no tunnel rule, which is what publishing a
      # ${EXTERNAL_DOMAIN} host actually takes. The internal record comes free:
      # external-dns reads an HTTPRoute's target from its GATEWAY's
      # status.addresses.
      #
      # TLS is the Let's Encrypt *.${EXTERNAL_DOMAIN} wildcard already on that
      # listener -- publicly trusted, so no internal-CA trust needed on the
      # client, which is the point of moving off ${BASE_DOMAIN}.#
    # Behind Authelia. ExtensionRef is how a Gateway API route attaches a Traefik
    # middleware; it has no namespace field, so the Middleware must live in this
    # namespace -- see middleware-authelia.yaml. This host was previously
    # UNAUTHENTICATED on the LAN, so this is a tightening, not a port of
    # something that already existed.
      internal:
        hostnames:
          - radarr.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network-system
            sectionName: websecure
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authelia-forwardauth
            backendRefs:
              - identifier: radarr
                port: 7878
      # http:// -> https:// for the new host, as its own route on the `web`
      # listener. Per host rather than an entrypoint-wide redirect, so :80 still
      # 404s for anything that has not opted in.
      internal-http-redirect:
        hostnames:
          - radarr.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network-system
            sectionName: web
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
      # The old host, now a 301 to the new one.
      #
      # TWO parentRefs, one rule: a route's rules apply to every parentRef, so
      # attaching to both listeners redirects http:// and https:// callers with a
      # single filter. The https half needs the websecure listener because TLS is
      # terminated before a redirect can be issued -- which is why the
      # radarr-home certificate is on that listener.
      #
      # `path` is deliberately unset, so the original path is carried into the
      # Location header unchanged.
      legacy-redirect:
        hostnames:
          - radarr.${BASE_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network-system
            sectionName: web
          - name: internal
            namespace: network-system
            sectionName: websecure
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  hostname: radarr.${EXTERNAL_DOMAIN}
                  statusCode: 301
    persistence:
      config:
        # Adds helm.sh/resource-policy: keep. The live claim carries no such
        # annotation (#3266 only covered the app-template releases), so until
        # this lands a chart that stops rendering the PVC would have Helm delete
        # it -- and Longhorn would then destroy the volume.
        retain: true
        enabled: true
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 6Gi
        globalMounts:
          - path: /config
      media-movies:
        enabled: true
        type: nfs
        server: nas
        path: /mnt/tank/media/movies
        globalMounts:
          - path: /media/movies
      downloads:
        enabled: true
        type: nfs
        server: nas
        path: /mnt/tank/media/downloads
        globalMounts:
          - path: /media/downloads
      downloads-nzb:
        enabled: true
        type: nfs
        server: nas
        path: /mnt/tank/media/downloads_nzb
        globalMounts:
          - path: /media/downloads_nzb
