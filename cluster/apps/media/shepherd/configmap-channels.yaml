---
# Shepherd's channel subscriptions, with xmltv_ids set to the same canonical
# ids media/epg publishes.
#
# This is the whole reason Shepherd can be a source here. The publisher serves
# one source's file at a time, so if Shepherd used its own channel ids then
# TVHeadend would see different ids depending on which source last succeeded.
# Pinning them to <yourtv-id>.yourtv.au means a failover is invisible to
# consumers.
#
# Generated -- do not edit by hand. From a checkout of jeffborg/shepherd:
#   util/check_channel_map.py --region 184 --dump-channels-conf '{id}.yourtv.au'
# Keys are the names Shepherd itself uses, resolved through the same
# translation its grabbers apply.
#
#   region:   184 (Newcastle)
#   channels: 33
#
# Two channels media/epg knows are absent here: Newcastle has two called "7"
# and two called "Sky News Regional", and Shepherd's config is keyed by name,
# so it can only hold one of each pair. Those two appear only when xmltv.net
# is the live source.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shepherd-channels
  namespace: media
data:
  channels.conf: |
    $channels = {
      '10' => '289726.yourtv.au',
      '10 Comedy' => '422290.yourtv.au',
      '10 Drama' => '406681.yourtv.au',
