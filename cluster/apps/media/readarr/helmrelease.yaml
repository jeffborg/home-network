---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: readarr
  namespace: media
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 10m0s
  values:
    defaultPodOptions:
      enableServiceLinks: true
      annotations:
        backup.velero.io/backup-volumes: config
      securityContext:
        supplementalGroups:
          - 816
    controllers:
      readarr:
        containers:
          readarr:
            image:
              repository: ghcr.io/linuxserver/readarr
              tag: "nightly-0.4.19.2811-ls400"
              pullPolicy: IfNotPresent
            env:
              TZ: "Australia/Sydney"
              PUID: "816"
              PGID: "816"
              READARR__AUTH__METHOD: "External"
            ports:
              - name: http
                containerPort: 8787
                protocol: TCP
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /usr/bin/env
                      - bash
                      - -c
                      - 'curl --fail localhost:8787/api/v3/system/status?apiKey=`IFS=\> && while read -d \< E C; do if [[ $E = "ApiKey" ]]; then echo $C; fi; done < /config/config.xml`'
                  failureThreshold: 5
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8787
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  timeoutSeconds: 1
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8787
                  initialDelaySeconds: 0
                  failureThreshold: 30
                  timeoutSeconds: 1
                  periodSeconds: 5
    service:
      readarr:
        controller: readarr
        ports:
          http:
            port: 8787
            targetPort: http
    route:
      internal:
        hostnames:
          - readarr.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network-system
            sectionName: websecure
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authelia-forwardauth
            backendRefs:
              - identifier: readarr
                port: 8787
      internal-http-redirect:
        hostnames:
          - readarr.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network-system
            sectionName: web
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
    persistence:
      config:
        retain: true
        enabled: true
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /config
      media-books:
        enabled: true
        type: nfs
        server: nas
        path: /mnt/tank/media/books
        globalMounts:
          - path: /media/books
      downloads:
        enabled: true
        type: nfs
        server: nas
        path: /mnt/tank/media/downloads
        globalMounts:
          - path: /media/downloads
      downloads-nzb:
        enabled: true
        type: nfs
        server: nas
        path: /mnt/tank/media/downloads_nzb
        globalMounts:
          - path: /media/downloads_nzb