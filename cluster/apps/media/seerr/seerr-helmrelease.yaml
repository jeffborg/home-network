---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: media
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 10m0s
  values:
    defaultPodOptions:
      nodeSelector:
        storage: longhorn
      securityContext:
        fsGroup: 1000
    controllers:
      seerr:
        containers:
          app:
            env:
              TZ: Australia/Sydney
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: "v3.5.1"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
    service:
      app:
        controller: seerr
        ports:
          http:
            port: 5055
    ingress:
      main:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        hosts:
          - host: seerr.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: 5055
        tls:
          - secretName: tls.seerr
            hosts:
              - seerr.${BASE_DOMAIN}
    persistence:
      config:
        # Keeps the claim if the chart ever stops rendering it -- which is exactly
        # what the app-template 5 migration does (#3265), where the PVC moves to
        # `existingClaim` and would otherwise be pruned with its data.
        retain: true
        enabled: true
        storageClass: longhorn
        size: 1Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /app/config
