---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: media
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 10m0s
  values:
    global:
      # app-template 5 only appends the persistence/service key to a generated
      # resource name when more than one of that kind exists; 3.7.3 always
      # appended it. Without this the PVC would be created fresh as `seerr` and
      # the bound claim orphaned with its data, so this keeps every generated
      # name as it is today and leaves the PVC under Helm's management.
      #
      # Cost of the flag: Service and Ingress objects gain a `-main`/`-app`
      # suffix. Ingress object names are not referenced by anything (traefik
      # matches on host), and the chart points its own Ingress at the renamed
      # Service itself. See #3265.
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
    controllers:
      seerr:
        containers:
          app:
            env:
              TZ: Australia/Sydney
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: "v3.5.2"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: '1'
                memory: 512Mi
    service:
      app:
        controller: seerr
        ports:
          http:
            port: 5055
    ingress:
      # Replaced by the `route` block below: this host is now a 301 to
      # seerr.${EXTERNAL_DOMAIN} instead of serving the app.
      #
      # Left as `enabled: false` rather than deleted so the previous arrangement is
      # one word away. NOTE this garbage-collects the per-host Certificate below --
      # cert-manager's ingress-shim owns it by ownerReference to this Ingress. That
      # is deliberate: seerr.${BASE_DOMAIN} is now served by the internal
      # Gateway, whose websecure listener carries its own seerr-home certificate
      # (see gateway-certificates-internal.yaml).
      main:
        enabled: false
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        hosts:
          - host: seerr.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: 5055
        tls:
          - secretName: tls.seerr
            hosts:
              - seerr.${BASE_DOMAIN}
    route:
      # seerr.${EXTERNAL_DOMAIN} on the INTERNAL Gateway -- LAN only.
      #
      # The internal Gateway, not `external`: the router port-forwards :443 to
      # traefik-external, so anything attached to that Gateway is reachable from
      # the internet by Host header alone, with no DNS record needed. Attaching
      # here means the name resolves to traefik's own LB address and is served
      # only on the LAN.
      #
      # No DNSEndpoint and no tunnel rule, which is what publishing a
      # ${EXTERNAL_DOMAIN} host actually takes. The internal record comes free:
      # external-dns reads an HTTPRoute's target from its GATEWAY's
      # status.addresses.
      #
      # TLS is the Let's Encrypt *.${EXTERNAL_DOMAIN} wildcard already on that
      # listener -- publicly trusted, so no internal-CA trust needed on the
      # client, which is the point of moving off ${BASE_DOMAIN}.#
    # Deliberately NOT behind Authelia.
      internal:
        hostnames:
          - seerr.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network-system
            sectionName: websecure
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: 5055
      # http:// -> https:// for the new host, as its own route on the `web`
      # listener. Per host rather than an entrypoint-wide redirect, so :80 still
      # 404s for anything that has not opted in.
      internal-http-redirect:
        hostnames:
          - seerr.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network-system
            sectionName: web
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
      # The old host, now a 301 to the new one.
      #
      # TWO parentRefs, one rule: a route's rules apply to every parentRef, so
      # attaching to both listeners redirects http:// and https:// callers with a
      # single filter. The https half needs the websecure listener because TLS is
      # terminated before a redirect can be issued -- which is why the
      # seerr-home certificate is on that listener.
      #
      # `path` is deliberately unset, so the original path is carried into the
      # Location header unchanged.
      legacy-redirect:
        hostnames:
          - seerr.${BASE_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network-system
            sectionName: web
          - name: internal
            namespace: network-system
            sectionName: websecure
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  hostname: seerr.${EXTERNAL_DOMAIN}
                  statusCode: 301
    persistence:
      config:
        # Keeps the claim if the chart ever stops rendering it -- which is exactly
        # what the app-template 5 migration does (#3265), where the PVC moves to
        # `existingClaim` and would otherwise be pruned with its data.
        retain: true
        enabled: true
        storageClass: longhorn
        size: 1Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /app/config
