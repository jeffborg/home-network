---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: media
spec:
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 10m
  values:
    global:
      # app-template 5 only appends an identifier to a generated resource name
      # when more than one of that kind exists; the k8s-at-home charts always
      # appended it. flaresolverr has nothing persistent to orphan, but the flag
      # is set so this release follows the same naming rule as the rest of the
      # media migration (#3265). Naming the controller and service keys after
      # the release then costs nothing, because app-template never appends an
      # identifier that already equals the release name: zero renamed objects.
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      # byparr drives a headless Chromium to solve the challenges prowlarr and
      # jackett hand it, so it wants CPU and the 2Gi limit set below. It was
      # landing on pi1 with nothing stopping it.
      #
      # A HARD nodeSelector rather than the weighted nodeAffinity its media
      # siblings use, because a preference is exactly the wrong shape here: it
      # still permits a Pi whenever the amd64 nodes are busy, which is both the
      # likeliest moment and the one where a browser timing out hurts most. The
      # esphome release already uses this form.
      #
      # Accepted cost: if all three node-class=faster nodes are unavailable this
      # stays Pending instead of scheduling somewhere useless. For an indexer
      # helper that is the better failure -- a missing solver surfaces as an
      # indexer error, while a Pi-bound one surfaces as mysterious timeouts.
      nodeSelector:
        node-class: faster
      # The k8s-at-home common library left this at the Kubernetes default of
      # true; app-template defaults it to false. Kept so the container still
      # sees the <SERVICE>_PORT_* variables for the namespace.
      enableServiceLinks: true
    controllers:
      # Keyed `flaresolverr`, not `main`: see the global block above.
      flaresolverr:
        containers:
          # Keyed `flaresolverr` so the container keeps its name, which is the
          # `container` label on every log line in Loki.
          flaresolverr:
            image:
              repository: ghcr.io/thephaseless/byparr
              tag: "3.1.1"
              pullPolicy: IfNotPresent
            env:
              TZ: "Australia/Sydney"
              # Moved off 8191 so the haproxy queue below owns the Service port.
              PORT: "8192"
            ports:
              - name: byparr
                containerPort: 8192
                protocol: TCP
            # Replicating the old chart's defaults exactly: TCP checks against
            # the byparr port, startup allowed 150s before it gives up.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8192
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  timeoutSeconds: 1
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8192
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  timeoutSeconds: 1
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8192
                  initialDelaySeconds: 0
                  failureThreshold: 30
                  timeoutSeconds: 1
                  periodSeconds: 5
            # Each Cloudflare challenge launches its own Firefox (~1 GiB); haproxy caps it at two at once.
            resources:
              requests:
                cpu: "0.02"
                memory: "512Mi"
              limits:
                memory: "3Gi"
          # byparr has no concurrency limit, so bursts from prowlarr OOM-killed it.
          haproxy:
            image:
              repository: docker.io/library/haproxy
              tag: "3.4.8-alpine"
              pullPolicy: IfNotPresent
            ports:
              - name: http
                containerPort: 8191
                protocol: TCP
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8191
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8191
                  periodSeconds: 10
            resources:
              requests:
                cpu: "0.01"
                memory: "16Mi"
              limits:
                memory: "64Mi"
    configMaps:
      haproxy:
        data:
          # maxconn 2 queues the rest instead of starting a third Firefox.
          # `|+` and the trailing blank line: app-template strips one newline and
          # haproxy 3.3+ refuses a config whose last line has none.
          haproxy.cfg: |+
            global
              # Unset, haproxy sizes for ~262k connections and idles at ~55 MiB.
              maxconn 256

            defaults
              mode http
              timeout connect 5s
              timeout client 10m
              timeout server 10m
              timeout queue 10m

            frontend queue
              bind :8191
              default_backend byparr

            backend byparr
              server byparr 127.0.0.1:8192 maxconn 2

    persistence:
      haproxy-config:
        type: configMap
        identifier: haproxy
        advancedMounts:
          flaresolverr:
            haproxy:
              - path: /usr/local/etc/haproxy/haproxy.cfg
                subPath: haproxy.cfg
                readOnly: true
    service:
      # Keyed `flaresolverr` so the Service keeps its name -- prowlarr and
      # jackett reach this at http://flaresolverr:8191 via their own stored
      # config, which is not in this repo.
      flaresolverr:
        controller: flaresolverr
        ports:
          http:
            port: 8191
            targetPort: http
