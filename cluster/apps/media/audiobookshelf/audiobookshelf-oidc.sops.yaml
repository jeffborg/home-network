# Plaintext OIDC client secret for audiobookshelf (SOPS-encrypted).
#
# This is the SOURCE OF TRUTH. The hash is derived from this and stored in
# cluster/core/auth-system/authelia-oidc-audiobookshelf.sops.yaml.
#
# Generate with: authelia crypto hash generate argon2 --password '<secret>'
# Then update the hash in authelia-oidc-audiobookshelf.sops.yaml.
apiVersion: v1
kind: Secret
metadata:
    name: audiobookshelf-oidc
    namespace: media
type: Opaque
stringData:
    client-secret: ENC[AES256_GCM,data:PLACEHOLDER_REPLACE_WITH_SECRET,iv:PLACEHOLDER,tag:PLACEHOLDER,type:str]
sops:
    encrypted_regex: ((?i)(pass|secret($|[^N])|key|token|^data$|^stringData))
    lastmodified: "2026-11-18T00:00:00Z"
    mac: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER,type:str]
    pgp:
        - created_at: "2026-11-18T00:00:00Z"
          enc: |
            -----BEGIN PGP MESSAGE-----
            PLACEHOLDER
            -----END PGP MESSAGE-----
          fp: E1B9ED7DD949E306B657E2EB001154C49571BA66
        - created_at: "2026-11-18T00:00:00Z"
          enc: |
            -----BEGIN PGP MESSAGE-----
            PLACEHOLDER
            -----END PGP MESSAGE-----
          fp: DC28FBF0B880CCFC8CC1F5144447FB4C8CBA9DE0
    version: 3.13.2