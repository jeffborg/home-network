---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: media
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 10m0s
  values:
    global:
      # app-template 5 only appends an identifier to a generated resource name
      # when more than one of that kind exists; the k8s-at-home charts always
      # appended it. Without this the PVC renders as `sonarr` instead of
      # `sonarr-config`, so the live claim is orphaned and a fresh empty one
      # bound -- and the Longhorn StorageClass reclaims with Delete, so the
      # series library database goes with it.
      #
      # The flag would normally also suffix the Deployment, Service and Ingress,
      # but app-template never appends an identifier that already equals the
      # release name, so naming those keys `sonarr` keeps every one of them
      # exactly as it is today. The Ingress name in particular has to hold: the
      # `tls.sonarr` Certificate is owned by an ownerReference to it, so a
      # rename would have Kubernetes garbage-collect the Certificate and TLS
      # would then quietly stop renewing. See #3265.
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      # The k8s-at-home common library left this at the Kubernetes default of
      # true; app-template defaults it to false. Kept so the container still
      # sees the <SERVICE>_PORT_* variables for the namespace.
      enableServiceLinks: true
      annotations:
        # Names the pod volume, which app-template still calls `config` after
        # the persistence key below -- so the Velero hook keeps working.
        backup.velero.io/backup-volumes: config
      nodeSelector:
        storage: longhorn
      securityContext:
        supplementalGroups:
          - 816
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-class
                    operator: In
                    values:
                      - faster
    controllers:
      # Keyed `sonarr`, not `main`: see the global block above.
      sonarr:
        containers:
          # Keyed `sonarr` so the container keeps its name, which is the
          # `container` label on every log line in Loki.
          sonarr:
            image:
              repository: ghcr.io/linuxserver/sonarr
              tag: "4.0.20"
              pullPolicy: IfNotPresent
            env:
              TZ: "Australia/Sydney"
              PUID: "816"
              PGID: "816"
            # app-template does not derive container ports from services, so the
            # port the Service targets by name is declared explicitly.
            ports:
              - name: http
                containerPort: 8989
                protocol: TCP
            probes:
              liveness:
                enabled: true
                custom: true
                # The old chart's own default, carried across verbatim: a TCP
                # check is not enough for Sonarr, so this scrapes the API key
                # out of config.xml and hits /system/status with it.
                spec:
                  exec:
                    command:
                      - /usr/bin/env
                      - bash
                      - -c
                      - 'curl --fail localhost:8989/api/v3/system/status?apiKey=`IFS=\> && while read -d \< E C; do if [[ $E = "ApiKey" ]]; then echo $C; fi; done < /config/config.xml`'
                  failureThreshold: 5
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 10
              # Replicating the old chart's defaults exactly: TCP checks against
              # 8989, startup allowed 150s before it gives up.
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8989
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  timeoutSeconds: 1
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8989
                  initialDelaySeconds: 0
                  failureThreshold: 30
                  timeoutSeconds: 1
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
    service:
      # Keyed `sonarr` so the Service keeps its name -- seerr/ombi and the
      # homepage widgets reach this at http://sonarr:8989 from config stored
      # outside this repo.
      sonarr:
        controller: sonarr
        ports:
          http:
            port: 8989
            targetPort: http
    ingress:
      # Keyed `sonarr` so the Ingress keeps its name and the shim-owned
      # `tls.sonarr` Certificate is not garbage-collected.
      sonarr:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        hosts:
          - host: sonarr.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: sonarr
                  port: 8989
        tls:
          - secretName: tls.sonarr
            hosts:
              - sonarr.${BASE_DOMAIN}
    persistence:
      config:
        # Adds helm.sh/resource-policy: keep. The live claim carries no such
        # annotation (#3266 only covered the app-template releases), so until
        # this lands a chart that stops rendering the PVC would have Helm delete
        # it -- and Longhorn would then destroy the volume.
        retain: true
        enabled: true
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /config
      media-tv:
        enabled: true
        type: nfs
        server: nas
        path: /mnt/tank/media/tv
        globalMounts:
          - path: /media/tv
      downloads:
        enabled: true
        type: nfs
        server: nas
        path: /mnt/tank/media/downloads
        globalMounts:
          - path: /media/downloads
      downloads-nzb:
        enabled: true
        type: nfs
        server: nas
        path: /mnt/tank/media/downloads_nzb
        globalMounts:
          - path: /media/downloads_nzb
