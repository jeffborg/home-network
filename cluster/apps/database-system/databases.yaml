---
# Databases on the shared instance, one Database resource per consumer.
#
# Everything comes through this file. (A previous note claimed teslamate would
# arrive via a bootstrap import -- that only runs at cluster creation, so it was
# never possible after day one.)
#
# DRAFT: the five candidates below are commented out, to be enabled one at a
# time as each app is actually cut over. Each needs three things, and the
# database is the easy one:
#
#   1. this Database resource
#   2. a role in cluster.yaml `managed.roles` + a Secret in
#      postgres-roles.sops.yaml
#   3. the app pointed at
#      postgres-rw.database-system.svc.cluster.local:5432 -- and for most of
#      them, a data migration out of SQLite, which is per-app work and not
#      something this manifest can do
#
# Survey of what is actually on SQLite today, from the live pods:
#
#   auth-system/authelia          /config/db.sqlite3
#   home-automation/home-assistant /config/home-assistant_v2.db
#   home-automation/teslamate-grafana /var/lib/grafana/grafana.db
#   media/seerr                   /app/config/db/db.sqlite3
#   media/ombi                    /config/Ombi.db  (Ombi supports MySQL, NOT
#                                 postgres -- verify before counting it in)
#   monitoring-system/grafana     distroless, not inspectable; Grafana
#                                 supports postgres
#
# Home Assistant is the one with a real payoff -- its recorder database is the
# thing that grows and that SQLite handles worst -- and also the one with the
# most involved migration.
#
# ---------------------------------------------------------------------------
# NB each one is its own DOCUMENT. A leading `- ` makes the file a bare YAML
# sequence and kustomize rejects it: "missing Resource metadata".
#
# ---
# apiVersion: postgresql.cnpg.io/v1
# kind: Database
# metadata:
#   name: homeassistant
#   namespace: database-system
# spec:
#   name: homeassistant
#   owner: homeassistant
#   cluster:
#     name: postgres
# ---------------------------------------------------------------------------
# authelia / grafana / teslamate-grafana / seerr follow the same shape.
# ---------------------------------------------------------------------------

# Declaring the extensions here keeps the owning role non-superuser:
# earthdistance is untrusted, so only the operator can create it. Versions match
# 18.6's defaults, so a restored dump needs no ALTER EXTENSION.
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: teslamate
  namespace: database-system
spec:
  name: teslamate
  owner: teslamate
  cluster:
    name: postgres
  databaseReclaimPolicy: retain
  extensions:
    - name: cube
      ensure: present
      version: "1.5"
    - name: earthdistance
      ensure: present
      version: "1.2"
    # Query-level timings, so tuning follows which queries are slow rather
    # than aggregate cache ratios. Needs the shared_preload_libraries entry
    # in cluster.yaml; without it CREATE EXTENSION fails.
    - name: pg_stat_statements
      ensure: present
---
# Immich can only create these as superuser, so the operator does. vchord
# needs `vector` first. A vchord image bump leaves the installed extension at
# its old version until it is ALTER EXTENSION ... UPDATEd.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich
  namespace: database-system
spec:
  name: immich
  owner: immich
  cluster:
    name: postgres
  databaseReclaimPolicy: retain
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: present
    - name: cube
      ensure: present
    - name: earthdistance
      ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pricebuddy
  namespace: database-system
spec:
  name: pricebuddy
  owner: pricebuddy
  cluster:
    name: postgres
  databaseReclaimPolicy: retain
