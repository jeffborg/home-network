# MariaDB credentials for the MythTV database.
#
# MARIADB_ROOT_PASSWORD is for socket-only use: MARIADB_ROOT_HOST is set to
# localhost in the HelmRelease, so root cannot connect over TCP at all. That is
# deliberate given this Service is a LoadBalancer -- the only account reachable
# over the network is the scoped mythtv one below.
#
# Reach root with:
#   kubectl -n database-system exec -it deploy/mariadb -- mariadb -uroot -p
