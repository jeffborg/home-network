---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Secret and ConfigMap first: the HelmRelease's pod will not start without
  # either, and the init script only ever runs on an empty data directory.
  - secret.sops.yaml
  - configmap-init.yaml
  - helmrelease.yaml
  - middleware-authelia.yaml
  - phpmyadmin.yaml
  - backup-cronjob.yaml
