---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tesla-proxy
  namespace: home-automation
# note values documented here https://bjw-s-labs.github.io/helm-charts/docs/app-template/
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    timeout: 5m
  interval: 10m0s
  values:
    global:
      # app-template 5 only appends an identifier to a generated resource name
      # when more than one of that kind exists; 0.2.2 always appended it to the
      # PVC. Without this the claim is created fresh as `tesla-proxy` and the
      # bound `tesla-proxy-config` orphaned with its data -- and unlike the
      # 3.7.3 releases in #3266 this claim has no helm.sh/resource-policy: keep,
      # so the name is the only protection.
      #
      # The flag would also suffix the Service/Ingress/Deployment, except that
      # app-template never appends an identifier equal to the release name, so
      # the controller/service/ingress keys below are all named `tesla-proxy`.
      # That matters here beyond the usual: Home Assistant is configured to talk
      # to the `tesla-proxy` Service by name, and its config lives in an opaque
      # PVC that is not in git, so the Service name cannot change.
      # Net result: nothing is renamed.
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      # 0.2.2 left this on; 5.3.0 defaults it off, so keep it to preserve the
      # service-link env vars in the pod.
      enableServiceLinks: true
    controllers:
      tesla-proxy:
        strategy: Recreate
        containers:
          app:
            image:
              repository: iainbullock/tesla_http_proxy
              tag: "v1.0.7.4"
              pullPolicy: IfNotPresent
            # app-template 5 derives no containerPorts from the Services, and
            # the hand-written `tesla-proxy-nginx` Service (nginx-service.yaml)
            # targets the nginx container port *by name*, so every port the pod
            # has today is declared explicitly here.
            ports:
              - name: http
                containerPort: 8099
                protocol: TCP
              - name: https
                containerPort: 443
                protocol: TCP
            # all three probes were disabled on the main container in 0.2.2, and
            # 5.3.0 disables them by default -- nothing to declare.
          nginx:
            image:
              repository: nginx
              tag: "1.31.8-perl"
              pullPolicy: IfNotPresent
            ports:
              - name: nginx
                containerPort: 80
                protocol: TCP
            probes:
              liveness:
                enabled: true
                port: 80
              readiness:
                enabled: true
                port: 80
              startup:
                enabled: true
                port: 80
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      # keyed `tesla-proxy` so the Service keeps its plain name under the flag.
      # Home Assistant resolves this name; see the global comment above.
      tesla-proxy:
        controller: tesla-proxy
        ports:
          https:
            port: 443
          http:
            port: 8099
            primary: true
    ingress:
      # keyed `tesla-proxy` so the Ingress keeps its plain name under the flag --
      # cert-manager's ingress-shim owns tesla-proxy-tls by ownerReference to
      # this Ingress, so a rename would garbage-collect the Certificate.
      tesla-proxy:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
        tls:
          - hosts:
            - tesla-proxy.${BASE_DOMAIN}
            secretName: tesla-proxy-tls
        hosts:
          - host: tesla-proxy.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: tesla-proxy
                  port: 8099
    # Published externally through the cloudflared tunnel, as a Gateway API
    # HTTPRoute on traefik-external.
    #
    # backendRef is a literal name, not an identifier: tesla-proxy-nginx is a hand-written Service in nginx-service.yaml, not one the chart renders, so there is no identifier to reference.
    #
    # Until now the tunnel reached this app's Service directly over plain HTTP,
    # with its routing table living only in the Cloudflare dashboard. Putting a
    # route here moves that hop behind traefik-external, which means the
    # publicly-trusted *.borgs.net wildcard, one access log with the real client
    # IP, and somewhere to attach middleware -- the second layer of defence the
    # tunnel sits in front of.
    #
    # Attaching is two-sided and both sides are explicit: the Gateway permits
    # `from: All` AND this names the Gateway. Neither alone is enough.
    #
    # The internal record needs no annotation: external-dns reads an HTTPRoute's
    # target from its GATEWAY's status.addresses, which Traefik populates with
    # traefik-external's LoadBalancer address.
    route:
      external:
        hostnames:
          - tesla.${EXTERNAL_DOMAIN}
        parentRefs:
          # sectionName pins it to the HTTPS listener, so it can never attach to
          # the chart's default HTTP one.
          - name: external
            namespace: network-system
            sectionName: websecure
        rules:
          - backendRefs:
              - name: tesla-proxy-nginx
                port: 80
      # The HTTP->HTTPS redirect for this host, as its own route on the `web`
      # listener. Per host rather than a blanket entrypoint redirect, so :80
      # still 404s for anything that has not opted in.
      #
      # A separate route and not another rule on the one above: a route's rules
      # apply to all of its parentRefs, so serving the backend on websecure and
      # redirecting on web cannot be expressed in a single route.
      #
      # 301, and no backendRef -- the filter terminates the request at Traefik.
      external-redirect:
        hostnames:
          - tesla.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: external
            namespace: network-system
            sectionName: web
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
    persistence:
      config:
        # Keeps the claim if the chart ever stops rendering it. 0.2.2 had no
        # `retain` option, which is why this PVC was not covered by #3266.
        retain: true
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 1Gi
        # 0.2.2's `subPath:` list, plus the nginx container's own mount of the
        # same claim, become per-container advancedMounts.
        advancedMounts:
          tesla-proxy:
            app:
              - path: /data
                subPath: .
              - path: /share
                subPath: share
            nginx:
              - path: /share/nginx
                subPath: share/nginx
      secret-config:
        enabled: true
        type: secret
        name: tesla-command-proxy
        advancedMounts:
          tesla-proxy:
            app:
              - path: /data/config.sh
                subPath: config
                readOnly: true
      app-run:
        enabled: true
        type: configMap
        name: tesla-proxy-app
        advancedMounts:
          tesla-proxy:
            app:
              - path: /app/run.py
                subPath: run.py
                readOnly: true
      nginx-config:
        enabled: true
        type: configMap
        name: tesla-proxy-nginx
        # mounted on the nginx container only -- 0.2.2 expressed this as
        # `mountPath: "-"` plus an explicit volumeMount on the sidecar.
        advancedMounts:
          tesla-proxy:
            nginx:
              - path: /etc/nginx/conf.d/default.conf
                subPath: nginx.conf
                readOnly: true
    configMaps:
      app:
        enabled: true
        data:
          run.py: |
            import os
            import sys
            import uuid
            import logging
            import argparse
            import requests
            from flask import Flask, request, render_template, cli, redirect
            from werkzeug.exceptions import HTTPException

            logging.basicConfig(
                format="[%(asctime)s] %(name)s:%(levelname)s: %(message)s",
                level=logging.INFO,
                datefmt="%H:%M:%S",
            )
            logger = logging.getLogger("main")

            app = Flask(__name__)

            SCOPES = "openid offline_access vehicle_device_data vehicle_cmds vehicle_charging_cmds vehicle_location"
            AUDIENCES = {
                "North America, Asia-Pacific": "https://fleet-api.prd.na.vn.cloud.tesla.com",
                "Europe, Middle East, Africa": "https://fleet-api.prd.eu.vn.cloud.tesla.com",
                "China": "https://fleet-api.prd.cn.vn.cloud.tesla.cn",
            }
            BLUE = "\u001b[34m"
            RESET = "\x1b[0m"

            parser = argparse.ArgumentParser()

            parser.add_argument(
                "--client-id",
                help="Client ID. Required if not provided in environment variable CLIENT_ID",
                default=os.environ.get("CLIENT_ID"),
            )
            parser.add_argument(
                "--client-secret",
                help="Client secret. Required if not provided in environment variable CLIENT_SECRET",
                default=os.environ.get("CLIENT_SECRET"),
            )
            parser.add_argument(
                "--domain",
                help="Domain. Required if not provided in environment variable DOMAIN",
                default=os.environ.get("DOMAIN"),
            )
            parser.add_argument(
                "--region",
                choices=AUDIENCES.keys(),
                help="Region. Required if not provided in environment variable REGION",
                default=os.environ.get("REGION"),
            )
            parser.add_argument(
                "--proxy-host",
                help="Proxy host. Required if not provided in environment variable PROXY_HOST",
                default=os.environ.get("PROXY_HOST"),
            )

            args = parser.parse_args()

            if (
                not args.client_id
                or not args.client_secret
                or not args.domain
                or not args.region
                or not args.proxy_host
            ):
                parser.print_help()
                sys.exit(1)


            @app.errorhandler(Exception)
            def handle_exception(e):
                """Exception handler for HTTP requests"""
                logger.error(e)
                # pass through HTTP errors
                if isinstance(e, HTTPException):
                    return e

                # now you're handling non-HTTP exceptions only
                return "Unknown Error", 500


            @app.route("/")
            def index():
                """Web UI"""
                return render_template(
                    "index.html",
                    domain=args.domain,
                    client_id=args.client_id,
                    scopes=SCOPES,
                    randomstate=uuid.uuid4().hex,
                    randomnonce=uuid.uuid4().hex,
                )


            @app.route("/callback")
            def callback():
                """Handle POST callback from Tesla server to complete OAuth"""

                logger.info("callback args: %s", request.args)
                # sometimes I don't get a valid code, not sure why
                try:
                    code = request.args["code"]
                except KeyError:
                    logger.error("args: %s", request.args)
                    return "Invalid code!", 400

                # Exchange code for refresh_token
                req = requests.post(
                    "https://auth.tesla.com/oauth2/v3/token",
                    headers={"Content-Type": "application/x-www-form-urlencoded"},
                    data={
                        "grant_type": "authorization_code",
                        "client_id": args.client_id,
                        "client_secret": args.client_secret,
                        "code": code,
                        "audience": AUDIENCES[args.region],
                        "redirect_uri": f"https://{args.domain}/callback",
                    },
                    timeout=30,
                )

                output = (
                    "Info to enter into Tesla Custom component:\n"
                    f"Refresh token  : {BLUE}{req.json()['refresh_token']}{RESET}\n"
                    f"Proxy URL      : {BLUE}https://{args.proxy_host}:4430{RESET}\n"
                    f"SSL certificate: {BLUE}/share/home-assistant/selfsigned.pem{RESET}\n"
                    f"Client ID      : {BLUE}{args.client_id}{RESET}\n"
                )

                logger.info(output)

                req.raise_for_status()
                with open("/data/refresh_token", "w", encoding="utf-8") as f:
                    f.write(req.json()["refresh_token"])
                with open("/data/access_token", "w", encoding="utf-8") as f:
                    f.write(req.json()["access_token"])

                return render_template("callback.html")


            @app.route("/shutdown")
            def shutdown():
                """Shutdown Flask server so the HTTP proxy can start"""
                os._exit(0)


            @app.route("/register-partner-account")
            def register_partner_account():
                """Register the partner account with Tesla API to enable API access"""

                logger.info("*** Generating Partner Authentication Token ***")

                req = requests.post(
                    "https://auth.tesla.com/oauth2/v3/token",
                    headers={"Content-Type": "application/x-www-form-urlencoded"},
                    data={
                        "grant_type": "client_credentials",
                        "client_id": args.client_id,
                        "client_secret": args.client_secret,
                        "scope": SCOPES,
                        "audience": AUDIENCES[args.region],
                    },
                    timeout=30,
                )
                if req.status_code >= 400:
                    logger.error("HTTP %s: %s", req.status_code, req.reason)
                    return redirect(f"/?error={req.status_code}", code=302)

                logger.info(req.text)
                tesla_api_token = req.json()["access_token"]

                # register Tesla account to enable API access
                logger.info("*** Registering Tesla account ***")
                req = requests.post(
                    f"{AUDIENCES[args.region]}/api/1/partner_accounts",
                    headers={
                        "Authorization": "Bearer " + tesla_api_token,
                        "Content-Type": "application/json",
                    },
                    data='{"domain": "%s"}' % args.domain,
                    timeout=30,
                )
                if req.status_code >= 400:
                    logger.error("Error %s: %s", req.status_code, req.reason)
                    return redirect(f"/?error={req.status_code}", code=302)
                logger.info(req.text)

                return redirect("/?success=1", code=302)


            if __name__ == "__main__":
                logger.info("*** Starting Flask server... ***")
                cli.show_server_banner = lambda *_: None
                app.run(port=8099, debug=False, host="0.0.0.0")
      nginx:
        enabled: true
        data:
          nginx.conf: |
            server {
                listen 80;
                listen [::]:80;
                server_name tesla.home; # Change to match your own FQDN
                root /share/nginx;
                # static public key for Tesla
                location /.well-known/appspecific/ {
                    try_files /com.tesla.3p.public-key.pem =404;
                }
                    # temporary Flask app for initial auth
                location / {
                    proxy_pass http://127.0.0.1:8099; # Change to hostname or IP of your Docker host
                }
            }
