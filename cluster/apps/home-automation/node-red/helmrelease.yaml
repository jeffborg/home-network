---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-red
  namespace: home-automation
spec:
  chart:
    spec:
      # renovate: registryUrl=https://k8s-at-home.com/charts/
      chart: node-red
      version: 10.3.2
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
        namespace: flux-system
  install:
    timeout: 5m
  interval: 10m0s
  values:
    podAnnotations:
      backup.velero.io/backup-volumes: data2
    image:
      repository: nodered/node-red
      tag: 3.1.15
    env:
      TZ: Australia/Sydney
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
    persistence:
      # Migration to Longhorn complete (verified byte-identical, and flows.json
      # md5 matched an off-cluster backup). The old democratic-csi NFS volume is
      # no longer mounted; its PVC is retained out-of-band via
      # helm.sh/resource-policy=keep and deleted separately.
      data:
        enabled: false
      data2:
        enabled: true
        mountPath: /data
        storageClass: longhorn
        size: 1Gi
        accessMode: ReadWriteOnce

    ingress:
      main:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd          
          hajimari.io/enable: 'true'
          hajimari.io/icon: 'home-automation'
          hajimari.io/appName: 'node-red'
        tls:
          - hosts:
            - node-red.${BASE_DOMAIN}
            secretName: node-red-tls
        hosts:
          - host: node-red.${BASE_DOMAIN}
            paths:
              - path: /
