---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-red
  namespace: home-automation
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    timeout: 5m
  interval: 10m0s
  values:
    global:
      # app-template 5 only appends an identifier to a generated resource name
      # when more than one of that kind exists; the old charts always appended
      # it. Without this the PVC is created fresh as `node-red` and the bound
      # `node-red-data2` is orphaned with flows.json and the whole /data tree.
      #
      # Naming the controller, service and ingress keys after the release then
      # stops the flag suffixing those, because the chart does not append an
      # identifier equal to the release name. Net result: nothing is renamed.
      alwaysAppendIdentifierToResourceName: true
    controllers:
      # Keyed `node-red`, not `main`: see the global block above.
      node-red:
        type: deployment
        strategy: Recreate
        pod:
          annotations:
            # Names the pod volume, which is why the persistence key below has
            # to stay `data2`.
            backup.velero.io/backup-volumes: data2
          # The old chart left both at the k8s-at-home defaults; app-template
          # defaults them the other way. Kept as they are today rather than
          # quietly changing the pod's environment.
          enableServiceLinks: true
          automountServiceAccountToken: true
        containers:
          app:
            # Without this the container is renamed to `app`, which would change
            # the `container` label on every log line in Loki.
            nameOverride: node-red
            image:
              repository: nodered/node-red
              # Step 1 of 2: 3.1.15 -> 4.1.17, then 5.x separately (#2731).
              #
              # The `-22` suffix is not optional: the 4.x maintenance line
              # publishes only Node-suffixed tags (plain ones stop at 4.1.9), and
              # -22 gives Node 22.23.4. That clears the >=20 the two most-used
              # palette modules now require, so this bump is what unblocks
              # updating them rather than the other way round.
              #
              # Renovate treats the suffix as a compatibility family, so it will
              # offer 4.x.y-22 patches and will not jump to 5.x by itself.
              tag: 4.1.17-22
              pullPolicy: IfNotPresent
            env:
              TZ: Australia/Sydney
              # The four below were chart defaults rather than settings of ours,
              # so they are spelled out here to leave the container's
              # environment byte-identical. FLOWS is the one that matters: with
              # it unset Node-RED falls back to a settings.js `flowFile`, which
              # this install does not define.
              FLOWS: flows.json
              NODE_OPTIONS:
              NODE_RED_ENABLE_PROJECTS:
              NODE_RED_ENABLE_SAFE_MODE:
            ports:
              # The old chart declared this; app-template does not generate
              # container ports from services, so it is declared explicitly to
              # keep the pod spec identical.
              - name: http
                containerPort: 1880
                protocol: TCP
            resources:
              requests:
                cpu: 200m
                memory: 256Mi
            # Replicating the old chart's defaults exactly: TCP checks against
            # 1880, startup allowed 150s before it gives up.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 1880
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 1
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 1880
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 1
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 1880
                  initialDelaySeconds: 0
                  failureThreshold: 30
                  periodSeconds: 5
                  timeoutSeconds: 1
    service:
      # Keyed `node-red` so this Service stays named plainly `node-red` under
      # the flag above. Node-RED's own flows are reachable at
      # http://node-red:1880 from inside the cluster, and the flows themselves
      # live in the PVC rather than in git.
      node-red:
        controller: node-red
        primary: true
        ports:
          http:
            port: 1880
            targetPort: http
            primary: true
    ingress:
      # Keyed `node-red` for the same reason, and because cert-manager's
      # ingress-shim owns `node-red-tls` by ownerReference to this Ingress --
      # renaming it would prune the Ingress and garbage-collect the Certificate.
      node-red:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd,home-automation-oauth2-signin@kubernetescrd,home-automation-oauth2-auth@kubernetescrd
          hajimari.io/enable: 'true'
          hajimari.io/icon: 'home-automation'
          hajimari.io/appName: 'node-red'
        tls:
          - hosts:
            - node-red.${BASE_DOMAIN}
            secretName: node-red-tls
        hosts:
          - host: node-red.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: node-red
                  port: http
    persistence:
      # Migration to Longhorn complete (verified byte-identical, and flows.json
      # md5 matched an off-cluster backup). The old democratic-csi NFS volume is
      # no longer mounted; its PVC is retained out-of-band via
      # helm.sh/resource-policy=keep and deleted separately. The old chart
      # carried a `data: {enabled: false}` stanza to suppress its default claim;
      # app-template has no default persistence, so there is nothing to suppress.
      data2:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        size: 1Gi
        accessMode: ReadWriteOnce
        # Keeps the claim if the chart ever stops rendering it.
        retain: true
        globalMounts:
          - path: /data
