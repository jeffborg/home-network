---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: node-red
  namespace: home-automation
spec:
  chart:
    spec:
      # renovate: registryUrl=https://k8s-at-home.com/charts/
      chart: node-red
      version: 10.3.2
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
        namespace: flux-system
  install:
    timeout: 5m
  interval: 10m0s
  values:
    podAnnotations:
      backup.velero.io/backup-volumes: data,data2
    image:
      repository: nodered/node-red
      tag: 3.1.15
    env:
      TZ: Australia/Sydney
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
    persistence:
      # Old democratic-csi NFS volume. Kept enabled and chart-managed so Helm never
      # drops it from the manifest; only the init container reads it now. accessMode
      # and size are preserved verbatim -- the chart hard-requires accessMode, and
      # changing either would patch an immutable field on the bound PVC.
      data:
        enabled: true
        accessMode: ReadWriteOnce
        size: 1Gi
        mountPath: /data-old
        readOnly: true
      # New Longhorn volume, mounted where node-red expects its data.
      data2:
        enabled: true
        mountPath: /data
        storageClass: longhorn
        size: 1Gi
        accessMode: ReadWriteOnce

    # One-shot copy NFS -> Longhorn on first boot. Guarded by a sentinel file so a
    # partial copy is retried rather than silently treated as done. Remove this
    # block (and disable the `data` volume) once the migration is confirmed.
    initContainers:
      migrate-data:
        name: migrate-data
        image: busybox:1.36.1
        command:
          - /bin/sh
          - -c
          - |
            if [ -f /new/.migration-complete ]; then
              echo "already migrated, nothing to do"
              exit 0
            fi
            echo "copying /old -> /new"
            cp -a /old/. /new/
            touch /new/.migration-complete
            echo "migration complete"
        volumeMounts:
          - name: data
            mountPath: /old
            readOnly: true
          - name: data2
            mountPath: /new
    ingress:
      main:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd          
          hajimari.io/enable: 'true'
          hajimari.io/icon: 'home-automation'
          hajimari.io/appName: 'node-red'
        tls:
          - hosts:
            - node-red.${BASE_DOMAIN}
            secretName: node-red-tls
        hosts:
          - host: node-red.${BASE_DOMAIN}
            paths:
              - path: /
