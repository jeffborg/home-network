---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: evcc-optimizer
  namespace: home-automation
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    timeout: 5m
  interval: 10m0s
  values:
    controllers:
      evcc-optimizer:
        # Stateless (no PVC) — roll new pod up before tearing the old one down so
        # evcc never loses the optimizer during an image bump (app-template
        # defaults to Recreate, which drops it for the gap).
        strategy: RollingUpdate
        containers:
          app:
            image:
              # evcc/optimizer publishes only `latest` + git-SHA tags (no semver), so
              # pin `latest` by digest for reproducibility and let renovate raise a PR
              # when upstream pushes a new build instead of it changing silently.
              # NB: this MUST be the multi-arch manifest-list digest (amd64+arm64) — a
              # per-arch sub-digest CrashLoops when the pod lands on a Pi (arm64) node.
              repository: evcc/optimizer
              # renovate: datasource=docker depName=evcc/optimizer versioning=docker
              tag: latest@sha256:d90be3578e703e07697afd25a1eb914fa2fb90d38c63f24bc628525cfdbc78ee
              pullPolicy: IfNotPresent
            env:
              TZ: "Australia/Sydney"
              # Solver time budget per solve (image default 10s). evcc only runs the
              # optimizer once every ~5 min, so latency is a non-issue — give it more
              # time to reach `optimal` instead of stopping at `feasible`.
              OPTIMIZER_TIME_LIMIT: "30"
              # The image bakes in `--workers 4` via GUNICORN_CMD_ARGS, which overrides
              # WEB_CONCURRENCY, so overriding the whole arg string is the only way to
              # drop to 1 worker (evcc calls the optimizer only periodically; cuts RSS
              # to ~1/4). Deliberately do NOT pass `--config python:optimizer.gunicorn_conf`
              # here: some published `latest` builds ship without that module and forcing
              # it crashes with "No module named 'optimizer.gunicorn_conf'". It is only an
              # optional reaper for solvers left by a *killed* worker — negligible with a
              # single worker and comfortable memory. Keeping the args build-agnostic means
              # renovate digest bumps won't break us.
              GUNICORN_CMD_ARGS: >-
                --workers 1 --max-requests 32
                --access-logfile - --access-logformat '%(m)s %(U)s %(s)s %(D)s'
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /optimize/health
                    port: 7050
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /optimize/health
                    port: 7050
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                # raised from 200m so the single-threaded ~10s solve isn't throttled
                cpu: "1"
                memory: 256Mi
    service:
      app:
        controller: evcc-optimizer
        ports:
          http:
            port: 7050
