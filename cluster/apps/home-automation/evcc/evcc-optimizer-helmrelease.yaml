---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: evcc-optimizer
  namespace: home-automation
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    timeout: 5m
  interval: 10m0s
  values:
    controllers:
      evcc-optimizer:
        containers:
          app:
            image:
              repository: evcc/optimizer
              tag: latest
              pullPolicy: Always
            env:
              TZ: "Australia/Sydney"
              # The image bakes in `--workers 4` via GUNICORN_CMD_ARGS, which overrides
              # WEB_CONCURRENCY. Each worker loads its own solver, so 4 workers is the
              # bulk of the memory. evcc only calls the optimizer periodically, so a
              # single worker is enough; override to 1 (cuts RSS to ~1/4) and pin it
              # against future `latest` builds; keep the image's other gunicorn flags.
              GUNICORN_CMD_ARGS: >-
                --workers 1 --max-requests 32
                --config python:optimizer.gunicorn_conf
                --access-logfile - --access-logformat '%(m)s %(U)s %(s)s %(D)s'
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /optimize/health
                    port: 7050
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /optimize/health
                    port: 7050
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                # raised from 200m so the single-threaded ~10s solve isn't throttled
                cpu: "1"
                memory: 256Mi
    service:
      app:
        controller: evcc-optimizer
        ports:
          http:
            port: 7050
