---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: frigate
  namespace: home-automation
spec:
  chart:
    spec:
      # renovate: registryUrl=https://k8s-at-home.com/charts/
      chart: frigate
      version: 8.2.2
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
        namespace: flux-system
  install: {}
  interval: 10m0s
  values:
    image:
      repository: ghcr.io/blakeblackshear/frigate
      tag: "0.18.0"
    nodeSelector:
      kubernetes.io/arch: amd64
      storage: longhorn
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: feature.node.kubernetes.io/usb-ff_18d1_9302.present
              operator: In
              values:
              - 'true'
          - matchExpressions:
            - key: feature.node.kubernetes.io/usb-fe_1a6e_089a.present
              operator: In
              values:
              - 'true'
    resources:
      limits:
        cpu: 3
        memory: 4Gi
      requests:
        cpu: 512m
        memory: 2.5Gi
    ingress:
      main:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          hajimari.io/enable: 'true'
          hajimari.io/icon: 'home-automation'
          hajimari.io/appName: 'Frigate'
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
          # hajimari.io/url
        tls:
          - hosts:
            - frigate.${BASE_DOMAIN}
            secretName: frigate-tls
        hosts:
          - host: frigate.${BASE_DOMAIN}
            paths:
              - path: /
      go2rtc:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        tls:
          - hosts:
            - go2rtc.frigate.${BASE_DOMAIN}
            secretName: go2rtc-frigate-tls
        hosts:
          - host: go2rtc.frigate.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  name: frigate
                  port: 1984
    service:
      main:
        ports:
          rtsp:
            enabled: true
            port: 8554
          rtmp:
            enabled: false
          go2rtc:
            enabled: true
            port: 1984
      # TCP and UDP live in separate Services on purpose, copying what
      # network/pihole already does for DNS (pihole-dns-tcp + pihole-dns-udp
      # sharing 192.168.10.174 via allow-shared-ip).
      #
      # One Service carrying both protocols on 8555 cannot be maintained:
      # Service.spec.ports merges on `port` alone
      # (x-kubernetes-patch-merge-key), so a strategic-merge patch resolves to
      # the FIRST entry with that port and any later entry sharing it is
      # unreachable. That is why #3087's targetPort fix landed on rtmp-tcp and
      # silently missed rtmp-udp, leaving kube-proxy writing
      # "frigate-webrtc:rtmp-udp has no endpoints -j REJECT".
      #
      # One port per Service means no duplicate merge keys, and MetalLB
      # co-locates the pair on a single address.
      webrtc:
        enabled: true
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: webrtc.frigate.${BASE_DOMAIN}
          metallb.universe.tf/allow-shared-ip: frigate-webrtc
        externalTrafficPolicy: Local
        ports:
          rtmp-tcp:
            enabled: true
            port: 8555
            targetPort: 8555
            protocol: TCP
      webrtc-udp:
        enabled: true
        type: LoadBalancer
        annotations:
          metallb.universe.tf/allow-shared-ip: frigate-webrtc
        externalTrafficPolicy: Local
        ports:
          rtmp-udp:
            enabled: true
            port: 8555
            targetPort: 8555
            protocol: UDP
    env:
      TZ: Australia/Sydney
    envFrom:
      - secretRef:
          name: frigate-secrets
    # probes:
    #     liveness:
    #       custom: true
    #       spec:
    #         httpGet:
    #           port: 5000
    #           path: /api/
    #         initialDelaySeconds: 0
    #         failureThreshold: 3
    #         timeoutSeconds: 1
    #         periodSeconds: 10
    #     readiness:
    #       custom: true
    #       spec:
    #         httpGet:
    #           port: 5000
    #           path: /api/
    #         initialDelaySeconds: 0
    #         failureThreshold: 3
    #         timeoutSeconds: 1
    #         periodSeconds: 10
    #     # startup:
    #     #   custom: true
    #     #   spec:
    #     #     tcpSocket:
    #     #       port: 5000
    #     #     initialDelaySeconds: 0
    #     #     failureThreshold: 30
    #     #     timeoutSeconds: 1
    #     #     periodSeconds: 5
    podAnnotations:
      configmap.reloader.stakater.com/reload: "frigate-config"
    persistence:
      data:
        enabled: true
        mountPath: /config
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 2Gi
        # Renders helm.sh/resource-policy: keep. This volume holds config.yaml,
        # the recordings database and the JWT secret, and the PV's reclaim
        # policy is Delete — so if a future chart change stopped rendering this
        # PVC, Helm would delete it on upgrade and Longhorn would destroy the
        # data with it. Already applied to the live object by hand; this keeps
        # it in git so it cannot be lost on the next reconcile.
        retain: true
      media:
        enabled: true
        type: custom
        volumeSpec:
          nfs:
            server: nas.home
            path: /mnt/tank/k8s/nfs/pvc-f67a755a-6983-415c-a706-c7d235b395dd
        mountPath: /media/frigate
        readOnly: false
        # accessMode: ReadWriteMany
        # existingClaim: frigate-media
      usb:
        enabled: true
        type: hostPath
        hostPath: /dev/usb
      # video11:
      #   enabled: true
      #   type: hostPath
      #   hostPath: /dev/video11
      # video12:
      #   enabled: true
      #   type: hostPath
      #   hostPath: /dev/video12
      # video13:
      #   enabled: true
      #   type: hostPath
      #   hostPath: /dev/video13
      # video14:
      #   enabled: true
      #   type: hostPath
      #   hostPath: /dev/video14
      # video15:
      #   enabled: true
      #   type: hostPath
      #   hostPath: /dev/video15
      # video16:
      #   enabled: true
      #   type: hostPath
      #   hostPath: /dev/video16
    securityContext:
      privileged: true
      # capabilities:
      #   add:
      #     - CAP_SYS_ADMIN
    podSecurityContext:
      supplementalGroups:
        - 44
    configmap:
      config:
        enabled: false
