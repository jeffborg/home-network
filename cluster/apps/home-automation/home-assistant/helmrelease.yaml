---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-automation
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    timeout: 10m
  interval: 10m0s
  values:
    global:
      # app-template 5 only appends an identifier to a generated resource name
      # when more than one of that kind exists; the old charts always appended
      # it. Without this the PVC is created fresh as `home-assistant` and the
      # bound `home-assistant-config2` is orphaned -- which is the entire HA
      # configuration, the recorder database and every integration's config
      # entry. None of it is in git.
      #
      # Naming the controller, primary service and primary ingress keys after
      # the release then stops the flag suffixing those, because the chart does
      # not append an identifier equal to the release name. The codeserver
      # objects and both ConfigMaps already render their current names.
      alwaysAppendIdentifierToResourceName: true
      #
      # `global.nameOverride` is deliberately left alone. app-template defaults
      # it to the release name, which keeps `app.kubernetes.io/name:
      # home-assistant` on the pod -- and the hand-written Service in
      # nginx-service.yaml selects on exactly that label plus
      # app.kubernetes.io/instance. Setting nameOverride here would silently
      # leave `home-assistant-nginx` with no endpoints.
    defaultPodOptions:
      nodeSelector:
        storage: longhorn
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-class
                    operator: In
                    values:
                      - faster
      # The old chart left both at the k8s-at-home defaults; app-template
      # defaults them the other way. Kept as they are today rather than quietly
      # changing the pod's environment -- HA is the last place to want an
      # unexplained change.
      enableServiceLinks: true
      automountServiceAccountToken: true
    controllers:
      # Keyed `home-assistant`, not `main`: see the global block above.
      home-assistant:
        type: deployment
        strategy: Recreate
        pod:
          annotations:
            # Names the pod volume, which is why the persistence key below has
            # to stay `config2`.
            backup.velero.io/backup-volumes: config2
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"macvlan-home-static",
                "namespace": "network-system",
                "ips": ["${HOMEASSISTANT_IP}/24"]
              }]
        containers:
          app:
            # Without this the container is renamed to `app`, which would change
            # the `container` label on every log line in Loki and break
            # `kubectl exec -c home-assistant`.
            nameOverride: home-assistant
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.10.4
              pullPolicy: IfNotPresent
            env:
              TZ: Australia/Sydney
            ports:
              # The old chart declared this; app-template does not generate
              # container ports from services, so it is declared explicitly to
              # keep the pod spec identical.
              - name: http
                containerPort: 8123
                protocol: TCP
            resources:
              requests:
                cpu: 300m
                memory: 1500Mi
              # Deliberately no CPU limit: HA's event loop is single-threaded and
              # CFS quota throttling in 100ms slices is the wrong medicine for it.
            probes:
              liveness:
                enabled: true
                custom: true
                # HA is single-threaded and the official image's s6 `finish`
                # script halts the container on ANY exit, so the kubelet owns
                # restarts. The chart default (timeout 1s, 3 failures, 10s
                # period) kills it after only 30s of unresponsiveness --
                # shorter than HA's own shutdown, so a UI-initiated restart
                # gets SIGTERMed mid-shutdown (exit 143) instead of exiting
                # cleanly with 100.
                spec:
                  tcpSocket:
                    port: 8123
                  initialDelaySeconds: 0
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 12
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8123
                  initialDelaySeconds: 0
                  timeoutSeconds: 1
                  periodSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8123
                  initialDelaySeconds: 0
                  timeoutSeconds: 1
                  ## This means it has a maximum of 20*60=1200 seconds to start up before it fails
                  periodSeconds: 20
                  failureThreshold: 60
          # Was `addons.codeserver` on the old chart, which rendered a sidecar in
          # this same Deployment. app-template has no addon concept, so it is
          # written out as an ordinary container -- same image, same args
          # (including the `--port`/workingDir pair the addon template appended),
          # same root securityContext, and still no probes.
          #
          # `addons.netshoot.enabled: false` is simply dropped; it rendered
          # nothing.
          codeserver:
            image:
              repository: codercom/code-server
              tag: 4.109.5
              pullPolicy: IfNotPresent
            args:
              - --auth
              - "none"
              - --user-data-dir
              - "/config/.vscode"
              - --extensions-dir
              - "/config/.vscode"
              - --port
              - "12321"
              - "/config"
            ports:
              - name: codeserver
                containerPort: 12321
                protocol: TCP
            securityContext:
              runAsUser: 0
          # Both of the following were `additionalContainers` on the old chart.
          # They become ordinary containers here; their volumeMounts move into
          # `persistence.*.advancedMounts` below, since app-template owns the
          # pod's volume list.
          nginx:
            image:
              repository: nginx
              tag: 1.31.8-alpine
              pullPolicy: IfNotPresent
            ports:
              - name: nginx
                containerPort: 80
                protocol: TCP
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 80
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  timeoutSeconds: 1
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 80
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  timeoutSeconds: 1
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 80
                  initialDelaySeconds: 0
                  failureThreshold: 30
                  timeoutSeconds: 1
                  periodSeconds: 5
          # Clears the Zigbee coordinator's serial framing state while HA is down,
          # so ZHA connects on its first attempt instead of burning 5-8 minutes of
          # config-entry backoff. See the flush.py docstring below.
          zigbee-flush:
            image:
              repository: python
              # renovate: datasource=docker depName=python
              tag: 3.15-alpine
              pullPolicy: IfNotPresent
            command:
              - python3
              - /scripts/flush.py
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
    service:
      # Keyed `home-assistant` so this Service stays named plainly
      # `home-assistant`. That is mandatory, not preferable: appdaemon's HA_URL
      # and both ha-mcp Deployments point at http://home-assistant:8123, and so
      # does every integration configured inside HA's own config entries, which
      # live in the PVC and cannot be fixed from this repo.
      home-assistant:
        controller: home-assistant
        primary: true
        ports:
          http:
            port: 8123
            targetPort: http
            primary: true
      codeserver:
        controller: home-assistant
        ports:
          codeserver:
            port: 12321
            targetPort: codeserver
      # There is no `nginx` service key here on purpose. `home-assistant-nginx`
      # is a hand-written Service in nginx-service.yaml, outside this release,
      # and adding one here would collide with it on the same name.
      #
      # `hap` was commented out on the old chart (HomeKit over a LoadBalancer);
      # it is dropped rather than translated, since it rendered nothing.
    ingress:
      # Keyed `home-assistant`/`codeserver` so both keep their current names.
      # That is not cosmetic: cert-manager's ingress-shim owns `homeassistant-tls`
      # and `homeassistant-code-server-tls` by ownerReference to these Ingresses,
      # so a rename prunes the Ingress and Kubernetes garbage-collects the
      # Certificate with it. TLS would keep working on the old secret and simply
      # stop renewing.
      home-assistant:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          hajimari.io/enable: 'true'
          hajimari.io/icon: 'home-automation'
          hajimari.io/appName: 'Home Assistant'
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
          # hajimari.io/url
        tls:
          - hosts:
            - homeassistant.${BASE_DOMAIN}
            - ha.${BASE_DOMAIN}
            secretName: homeassistant-tls
        hosts:
          - host: homeassistant.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: home-assistant
                  port: http
          - host: ha.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: home-assistant
                  port: http
      codeserver:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd,home-automation-oauth2-signin@kubernetescrd,home-automation-oauth2-auth@kubernetescrd
        tls:
          - hosts:
            - config.homeassistant.${BASE_DOMAIN}
            secretName: homeassistant-code-server-tls
        hosts:
          - host: config.homeassistant.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: codeserver
                  port: codeserver
    persistence:
      config2:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 8Gi
        # Keeps the claim if the chart ever stops rendering it.
        retain: true
        # advancedMounts, not globalMounts: all four containers use this claim
        # but three of them want something other than a plain /config.
        advancedMounts:
          home-assistant:
            app:
              - path: /config
            codeserver:
              - path: /config
            nginx:
              - path: /share/nginx
                subPath: tesla
                readOnly: true
            zigbee-flush:
              - path: /config
                readOnly: true
      zigbee-flush:
        type: configMap
        identifier: zigbee-flush
        # The old chart used `mountPath: "-"` to mean "declare the volume but do
        # not mount it anywhere automatically"; advancedMounts is how that is
        # expressed here, and it lands the file only in the container that runs it.
        advancedMounts:
          home-assistant:
            zigbee-flush:
              - path: /scripts/flush.py
                subPath: flush.py
                readOnly: true
      nginx-config:
        type: configMap
        identifier: nginx-config
        advancedMounts:
          home-assistant:
            nginx:
              - path: /etc/nginx/conf.d/default.conf
                subPath: nginx.conf
                readOnly: true
      # The original `config` claim (mountPath /config-old,
      # existingClaim: default-homeassistant-home-assistant-config) was already
      # disabled before this migration and its PVC is long gone, so there is
      # nothing left to carry across. app-template has no default persistence,
      # so no `enabled: false` stanza is needed to suppress one.
    configMaps:
      zigbee-flush:
        enabled: true
        data:
          flush.py: |
            #!/usr/bin/env python3
            """Clear the Zigbee coordinator's serial framing state while HA is down.

            Home Assistant's shutdown truncates its final write to the ZNP coordinator, so
            the radio's UART parser is left waiting mid-frame and silently swallows the
            first ~30-40 bytes the next session writes. ZHA sends only two 5-byte pings per
            connect attempt before its 15s timeout expires, so several attempts are eaten
            before one is answered -- and HA's config-entry backoff (5/10/20/40/80/160s)
            stretches that into a 5-8 minute Zigbee outage after every restart.

            Writing a few hundred filler bytes into the bridge while nothing else is
            connected satisfies that stale length byte; the frame then fails its checksum
            and is discarded, and the next ping is answered in milliseconds, so ZHA loads on
            its first attempt.

            The coordinator's address comes from Home Assistant's own config entry, so there
            is nothing to configure here and it follows the entry if the bridge moves.
            """

            import json
            import socket
            import time

            CONFIG_ENTRIES = "/config/.storage/core.config_entries"
            HA_ADDR = ("127.0.0.1", 8123)
            FILLER = b"\x00" * 300  # comfortably more than a 250-byte maximum ZNP frame
            SETTLE_SECONDS = 3  # HTTP may stop listening a moment before ZHA closes its socket
            POLL_SECONDS = 2


            def log(message):
                print(f"zigbee-flush: {message}", flush=True)


            def coordinator_address():
                """(host, port) for the ZHA coordinator, or None when it is not over TCP."""
                try:
                    with open(CONFIG_ENTRIES) as handle:
                        entries = json.load(handle)["data"]["entries"]
                except (OSError, ValueError, KeyError) as err:
                    # HA rewrites this file atomically, so a failed read is worth retrying.
                    log(f"cannot read config entries: {err}")
                    return None
                for entry in entries:
                    if entry.get("domain") != "zha":
                        continue
                    path = entry.get("data", {}).get("device", {}).get("path", "")
                    if not path.startswith("socket://"):
                        log(f"ZHA is not socket-attached ({path or 'no path'}), nothing to do")
                        return None
                    host, _, port = path[len("socket://") :].partition(":")
                    return host, int(port or 8888)
                log("no ZHA config entry found")
                return None


            def listening(address, timeout=2):
                try:
                    with socket.create_connection(address, timeout=timeout):
                        return True
                except OSError:
                    return False


            def flush():
                address = coordinator_address()
                if address is None:
                    return
                for attempt in (1, 2, 3):
                    try:
                        with socket.create_connection(address, timeout=5) as sock:
                            sock.sendall(FILLER)
                            time.sleep(0.5)
                    except OSError as err:
                        log(f"flush attempt {attempt} failed: {err}")
                        time.sleep(5)
                        continue
                    log(f"wrote {len(FILLER)} filler bytes to the coordinator bridge")
                    return
                log("could not reach the bridge; ZHA falls back to its own retries")


            def main():
                # A pod start means the previous HA process is already gone, so anything it
                # left wedged is ours to clear before ZHA's first connect attempt.
                was_up = listening(HA_ADDR)
                if not was_up:
                    log("Home Assistant is not listening yet; flushing before ZHA connects")
                    flush()
                while True:
                    up = listening(HA_ADDR)
                    if was_up and not up:
                        log("Home Assistant stopped listening")
                        time.sleep(SETTLE_SECONDS)
                        flush()
                    was_up = up
                    time.sleep(POLL_SECONDS)


            if __name__ == "__main__":
                main()
      nginx-config:
        enabled: true
        data:
          nginx.conf: |
            server {
                listen 80;
                listen [::]:80;
                server_name tesla.home; # Change to match your own FQDN
                root /share/nginx;
                # static public key for Tesla
                location /.well-known/appspecific/ {
                    try_files /com.tesla.3p.public-key.pem =404;
                }
            }
