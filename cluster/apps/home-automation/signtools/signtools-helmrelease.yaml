---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: signtools
  namespace: home-automation
# note values documented here https://bjw-s-labs.github.io/helm-charts/docs/app-template/
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    timeout: 5m
  interval: 10m0s
  values:
    global:
      # app-template 5 only appends an identifier to a generated resource name
      # when more than one of that kind exists; 0.2.2 always appended it to the
      # PVC. Without this the claim is created fresh as `signtools` and the bound
      # `signtools-data` orphaned with its data -- and unlike the 3.7.3 releases
      # in #3266 this claim has no helm.sh/resource-policy: keep, so the name is
      # the only protection.
      #
      # The flag would also suffix the Service/Ingress/Deployment, except that
      # app-template never appends an identifier equal to the release name, so
      # the controller/service/ingress keys below are all named `signtools`.
      # Net result: nothing is renamed.
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      # 0.2.2 left this on; 5.3.0 defaults it off, so keep it to preserve the
      # service-link env vars in the pod.
      enableServiceLinks: true
    controllers:
      signtools:
        # Restart when the config Secret changes. signtools reads its config
        # once, at startup, so a Secret edit alone would land the new file in
        # the pod and change nothing until something else happened to restart
        # it -- the same trap cloudflared hit in #3455. The mount path change in
        # this commit rolls the pod once by itself; this is for every edit after.
        #
        # On the POD template, not the Deployment: `controllers.*.annotations`
        # annotates the Deployment object, and while Reloader reads either, the
        # pod-template form is the one proven to work in this cluster -- the live
        # cloudflared Deployment carries it there and nowhere else, and Reloader
        # logged "Changes detected in 'cloudflared-config' ... updated
        # 'cloudflared'" off it.
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: signtools/signtools
              tag: "3.1.0"
              pullPolicy: IfNotPresent
            args:
              - -config
              - /data/signer-cfg.yml
            env:
              TZ: "Australia/Sydney"
            # 0.2.2 enabled all three TCP probes on the primary port by default;
            # 5.3.0 enables none, so they are declared explicitly to keep the
            # pod spec as it is today.
            probes:
              liveness:
                enabled: true
                port: 8080
              readiness:
                enabled: true
                port: 8080
              startup:
                enabled: true
                port: 8080
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      # keyed `signtools` so the Service keeps its plain name under the flag
      signtools:
        controller: signtools
        ports:
          http:
            port: 8080
            primary: true
    ingress:
      # DISABLED. signtools.${BASE_DOMAIN} is now a redirect expressed as an
      # HTTPRoute on the internal Gateway (see `route.internal-redirect` below),
      # not an Ingress carrying a redirectRegex middleware.
      #
      # Gateway API has a first-class RequestRedirect filter that takes a
      # hostname, so the regex, its capture group and the doubled-dollar escape
      # all disappear. With `path` left unset the original path is carried into
      # the Location header as-is, which is what the regex capture was for.
      #
      # NOTE this garbage-collects signtools-tls. cert-manager's ingress-shim
      # owns that Certificate by ownerReference to this Ingress, so removing the
      # Ingress removes the Certificate and its Secret. That is fine and
      # deliberate: the internal Gateway presents the `*.${BASE_DOMAIN}` wildcard
      # from #3466, which covers this host, so nothing needs the per-host
      # certificate any more.
      #
      # Left as `enabled: false` rather than deleted so the previous arrangement
      # is one word away if the route turns out to misbehave.
      signtools:
        enabled: false
    route:
      external:
        hostnames:
          - signtools.${EXTERNAL_DOMAIN}
        parentRefs:
          # sectionName pins it to the HTTPS listener, so it can never attach to
          # the chart's default HTTP one.
          - name: external
            namespace: network-system
            sectionName: websecure
        rules:
          # UNPROTECTED, deliberately. INSTALL.md is explicit that these paths
          # must not sit behind a reverse-proxy auth layer, or iOS devices and
          # the builder stop working:
          #
          #   /apps/*/        OTA manifests and the signed IPA download
          #   /jobs, /jobs/*  builder polling and job status
          #   /jobs/*/tus/    the builder uploading the signed app
          #   /files/*        asset delivery
          #
          # None of them is unauthenticated in a meaningful sense -- the builder
          # presents its own key and the app ids are unguessable -- but none can
          # perform an interactive login either.
          #
          # Confirmed against the live service, which already exempts exactly
          # these from its own basic auth: `/` answers 401 with
          # `www-authenticate: basic`, while /apps/, /jobs and /files/ answer
          # 404/400 with no challenge at all.
          #
          # Listed first for readability. Gateway API resolves by longest
          # matching prefix rather than by order, so /apps beats / regardless.
          - matches:
              - path:
                  type: PathPrefix
                  value: /apps
              - path:
                  type: PathPrefix
                  value: /jobs
              - path:
                  type: PathPrefix
                  value: /files
            backendRefs:
              - identifier: signtools
                port: 8080
          # Everything else -- the web UI -- behind Authelia.
          #
          # ExtensionRef is how a Gateway API route attaches a Traefik
          # middleware, and it applies PER RULE, which is the whole reason this
          # route is split. It has no namespace field, so the Middleware has to
          # live in this namespace; see middleware.yaml.
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authelia-forwardauth
            backendRefs:
              - identifier: signtools
                port: 8080
      # signtools.${BASE_DOMAIN} -> signtools.${EXTERNAL_DOMAIN}, on the
      # INTERNAL Gateway.
      #
      # The public host is already canonical: the service's own config generates
      # its OTA manifest URLs against https://signtools.${EXTERNAL_DOMAIN}, so an
      # internal link handed an iOS device manifests pointing somewhere else.
      #
      # TWO parentRefs, one filter. A route's rules apply to every parentRef, so
      # attaching to both listeners redirects http:// and https:// visitors with
      # a single rule -- no separate redirect route and no entrypoint-wide
      # redirect. The https case needs the websecure listener because TLS is
      # terminated before the redirect can be issued, which is why #3466 puts a
      # `*.${BASE_DOMAIN}` wildcard on that listener.
      #
      # `path` is deliberately unset: the original request path is then carried
      # into the Location header unchanged, which is what the old middleware's
      # regex capture group existed to do.
      internal-redirect:
        hostnames:
          - signtools.${BASE_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network-system
            sectionName: web
          - name: internal
            namespace: network-system
            sectionName: websecure
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  hostname: signtools.${EXTERNAL_DOMAIN}
                  statusCode: 301
      # The HTTP->HTTPS redirect for this host, as its own route on the `web`
      # listener. Per host rather than a blanket entrypoint redirect, so :80
      # still 404s for anything that has not opted in.
      #
      # A separate route and not another rule on the one above: a route's rules
      # apply to all of its parentRefs, so serving the backend on websecure and
      # redirecting on web cannot be expressed in a single route.
      #
      # 301, and no backendRef -- the filter terminates the request at Traefik.
      external-redirect:
        hostnames:
          - signtools.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: external
            namespace: network-system
            sectionName: web
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
    persistence:
      signtools-config:
        enabled: true
        type: secret
        name: signtools-config
        globalMounts:
          # /data/signer-cfg.yml, matching the `-config` argument. It used to
          # mount at /signer-cfg.yml, which the app never reads -- so this
          # Secret was inert and the live configuration was an unmanaged copy
          # inside the PVC. That is why disabling basic_auth in git had no
          # effect until now.
          #
          # A subPath mount onto a path inside the /data volume mount overlays
          # just that one file; the rest of the PVC is untouched. The copy the
          # app was reading is still on disk, shadowed rather than deleted, so
          # reverting this line restores the previous behaviour exactly.
          - path: /data/signer-cfg.yml
            subPath: signer-cfg.yml
            readOnly: false
      data:
        # Keeps the claim if the chart ever stops rendering it. 0.2.2 had no
        # `retain` option, which is why this PVC was not covered by #3266.
        retain: true
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 5Gi
        globalMounts:
          - path: /data
