---
# Overrides the datasource provisioning file baked into teslamate/grafana.
#
# WHY: Grafana applies a provisioned datasource only when the file's `version`
# is HIGHER than the row already in grafana.db. The image ships version 1; the
# stored row was at 3, so every restart read the file, found 1 < 3 and silently
# skipped it -- no error, nothing in the logs. DATABASE_HOST had been correct
# since the move to the shared Postgres and never took effect: the row still
# said `teslamate-db:5432`, and once that StatefulSet was scaled to 0 every
# dashboard query burned the full 120s TCP timeout against a dead Service.
#
# Mounting over the image's file is safe here specifically: that file is static
# (it contains the literal string $DATABASE_HOST, which Grafana expands when it
# reads it) rather than generated by the entrypoint, so a read-only mount does
# not break startup.
#
# uid MUST stay PC98BA2F4D77E1A42 -- 26 stored dashboards reference it.
#
# Everything here except url/version is copied from the live row so
# re-provisioning does not quietly drop it. The password in particular: the
# image's file defines none, and the stored row has one in secure_json_data,
# so omitting secureJsonData would wipe it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: teslamate-grafana-datasource
  namespace: home-automation
data:
  datasource.yml: |
    apiVersion: 1

    datasources:
      - name: TeslaMate
        uid: PC98BA2F4D77E1A42
        type: postgres
        access: proxy
        url: $DATABASE_HOST:$DATABASE_PORT
        user: $DATABASE_USER
        isDefault: true
        basicAuth: false
        withCredentials: false
        editable: true
        secureJsonData:
          password: $DATABASE_PASS
        jsonData:
          database: $DATABASE_NAME
          sslmode: $DATABASE_SSL_MODE
          postgresVersion: 1500
          maxOpenConns: 100
          maxIdleConns: 100
          maxIdleConnsAuto: true
          connMaxLifetime: 14400
        # Bumped past the stored row's 3. Raise it again for any future change
        # to this file, or Grafana will skip it exactly as it skipped the
        # image's.
        version: 10
