# The teslamate Postgres password, copied into this namespace.
#
# A copy rather than a reference because secrets are namespace-scoped: CNPG
# requires the role's password in the cluster's namespace (database-system) and
# the apps that use it live here. Same duplication, and same reason, as
# cluster/core/database-system/backup-credentials.sops.yaml.
#
# Kept SEPARATE from the existing `teslamate` secret rather than added to it,
# so that the old bitnamilegacy credential and the new CNPG one never sit in one
# object -- during the cutover both are live, and conflating them makes rollback
# ambiguous.
#
# If this is ever rotated, update
# cluster/apps/database-system/postgres-roles.sops.yaml too.
