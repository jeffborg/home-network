---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teslamate-grafana
  namespace: home-automation
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    timeout: 5m
  interval: 10m0s
  values:
    global:
      # app-template 5 only appends an identifier to a generated resource name
      # when more than one of that kind exists; 0.2.2 always appended it.
      # Without this the PVC is created fresh as `teslamate-grafana` and the
      # bound `teslamate-grafana-config` orphaned with the Grafana database.
      #
      # Naming the controller, service and ingress keys after the release then
      # stops the flag suffixing those, because the chart does not append an
      # identifier equal to the release name. Net result: nothing is renamed.
      # See #3265.
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      # The old chart left this at the Kubernetes default of true. app-template
      # defaults it to false; keep the old behaviour rather than quietly
      # changing the container's environment.
      enableServiceLinks: true
      securityContext:
        # Grafana's own group; it owns /var/lib/grafana on the PVC.
        fsGroup: 472
    controllers:
      # Keyed `teslamate-grafana`, not `main`: see the global block above.
      teslamate-grafana:
        strategy: Recreate
        containers:
          app:
            image:
              repository: teslamate/grafana
              tag: "4.5.0"
              pullPolicy: IfNotPresent
            env:
              DATABASE_USER: teslamate
              DATABASE_PASS:
                valueFrom:
                  secretKeyRef:
                    name: teslamate-pgsql
                    key: password
              DATABASE_NAME: teslamate
              # -ro: the two replicas directly. A pooler was tried here and
              # removed -- the 120s timeouts it was meant to fix turned out to
              # be the datasource provisioning gate, not connection churn.
              DATABASE_HOST: postgres-ro.database-system.svc.cluster.local
              # Authelia SSO, same shape as the main grafana.
              #
              # root_url is NOT optional: Grafana builds its OIDC redirect_uri from it,
              # and the default is http://<host>:3000/ -- wrong scheme and port, so the
              # callback lands on a URL that does not exist.
              GF_SERVER_ROOT_URL: https://teslamate-grafana.${BASE_DOMAIN}
              # The image sets use_browser_locale=true and language=detect, and
              # en-US is the ONLY English locale Grafana ships -- so an English
              # browser always lands on US formatting and no browser setting can
              # change it. Explicit formats instead.
              GF_DATE_FORMATS_USE_BROWSER_LOCALE: "false"
              GF_DATE_FORMATS_FULL_DATE: "DD/MM/YYYY HH:mm:ss"
              GF_DATE_FORMATS_INTERVAL_HOUR: "DD/MM HH:mm"
              GF_DATE_FORMATS_INTERVAL_DAY: "DD/MM"
              # Not auto-login: that would skip the form and make the local admin
              # account unreachable from a browser.
              GF_AUTH_OAUTH_AUTO_LOGIN: "false"
              GF_AUTH_SIGNOUT_REDIRECT_URL: https://auth.${EXTERNAL_DOMAIN}/logout
              GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
              GF_AUTH_GENERIC_OAUTH_NAME: Authelia
              GF_AUTH_GENERIC_OAUTH_ICON: signin
              GF_AUTH_GENERIC_OAUTH_CLIENT_ID: teslamate-grafana
              GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
              GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.${EXTERNAL_DOMAIN}/api/oidc/authorization
              GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.${EXTERNAL_DOMAIN}/api/oidc/token
              GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.${EXTERNAL_DOMAIN}/api/oidc/userinfo
              GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
              GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
              # No tls_client_ca: auth.${EXTERNAL_DOMAIN} serves the Let's Encrypt
              # wildcard, which the image already trusts. Using auth.${BASE_DOMAIN}
              # here would need the internal CA mounted instead.
              # Authelia group -> Grafana role. Not strict, so a user in neither group
              # still gets in as a Viewer rather than being refused.
              GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
              GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'admins') && 'GrafanaAdmin' || 'Viewer'"
              GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "false"
            envFrom:
              # GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              - secretRef:
                  name: teslamate-grafana-oidc
            # 0.2.2 rendered these three TCP probes by default and
            # app-template 5 renders none, so they are spelled out here to
            # keep the pod's readiness behaviour identical. Thresholds match
            # what is live: 3/10s for liveness and readiness, 30/5s for
            # startup.
            probes:
              liveness:
                enabled: true
                type: TCP
                port: 3000
              readiness:
                enabled: true
                type: TCP
                port: 3000
              startup:
                enabled: true
                type: TCP
                port: 3000
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      # Keyed `teslamate-grafana` so the Service keeps that name rather than
      # becoming `teslamate-grafana-main`.
      teslamate-grafana:
        controller: teslamate-grafana
        ports:
          http:
            port: 3000
    persistence:
      # Shadows the image's datasource provisioning file. subPath so only that
      # one file is replaced, leaving the rest of the directory intact.
      datasource:
        enabled: true
        type: configMap
        name: teslamate-grafana-datasource
        globalMounts:
          - path: /etc/grafana/provisioning/datasources/datasource.yml
            subPath: datasource.yml
            readOnly: true
      config:
        # Keeps the claim if the chart ever stops rendering it, so its data
        # cannot be pruned along with a chart change (#3266).
        retain: true
        enabled: true
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /var/lib/grafana
    ingress:
      # Keyed `teslamate-grafana` for the same reason as the service. Keeping
      # the Ingress name also keeps its Certificate: cert-manager's
      # ingress-shim owns `teslamate-grafana-tls` by ownerReference to this
      # Ingress, so a renamed Ingress is pruned and the Certificate
      # garbage-collected with it (#3265).
      teslamate-grafana:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        tls:
          - hosts:
            - teslamate-grafana.${BASE_DOMAIN}
            secretName: teslamate-grafana-tls
        hosts:
          - host: teslamate-grafana.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: teslamate-grafana
                  port: 3000
