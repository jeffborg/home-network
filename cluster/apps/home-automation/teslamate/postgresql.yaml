---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: teslamate-db
  namespace: home-automation
spec:
  chart:
    spec:
      # renovate: registryUrl=https://charts.bitnami.com/bitnami
      chart: postgresql
      # 16.2.1 is the last version before oct:// ? need to update flux?
      version: 16.2.1
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  install:
    timeout: 5m
  interval: 10m0s
  values:
    nameOverride: teslamate-db
    image:
      repository: bitnamilegacy/postgresql
      tag: 17.5.0-debian-12-r20
    auth:
      username: teslamate
      existingSecret: teslamate
      database: teslamate
    primary:
      # Replaces the chart's "nano" resourcesPreset, which the chart itself says
      # to override for production. The preset gave cpu 150m / memory 192Mi, and
      # both were wrong:
      #   memory  peak 191Mi against a 192Mi limit - 99.5% of the ceiling
      #   cpu     6m average but bursty, throttled in 37% of CFS periods
      # No cpu limit, because the throttling came from quota slicing a bursty
      # workload, not from a real shortage; the request still reserves the share.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      nodeSelector:
        storage: longhorn
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-class
                    operator: In
                    values:
                      - faster
      persistence:
        storageClass: longhorn
        size: 5Gi
