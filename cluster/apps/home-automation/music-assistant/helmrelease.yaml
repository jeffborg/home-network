---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: music-assistant
  namespace: home-automation
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    timeout: 5m
  interval: 10m0s
  values:
    controllers:
      music-assistant:
        type: deployment
        # The SQLite databases in /data (library.db, auth.db) must not be opened
        # by two pods at once.
        strategy: Recreate
        pod:
          annotations:
            backup.velero.io/backup-volumes: data
            # A real LAN address on VLAN 58, the same macvlan the Home Assistant
            # pods use. Two reasons it has to be here rather than on the cluster
            # network: players fetch audio from the stream server directly, and
            # discovery of Chromecast/Sonos/AirPlay is mDNS multicast, which does
            # not cross from pod networking onto the LAN. A LoadBalancer fixes
            # reachability but not multicast, so it cannot replace this.
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"macvlan-home-static",
                "namespace": "network-system",
                "ips": ["192.168.58.201/24"]
              }]
          securityContext:
            # Music Assistant's image runs as root, which cannot read the music
            # library: nas:/mnt/tank/media/music is mode 0770 owned by 816:816
            # with no world bits, and the NFS export is root_squash (root maps to
            # 8675309). So it has to actually be 816, not merely in group 816.
            # Verified 2.10.9 starts clean as 816 and writes its databases.
            runAsUser: 816
            runAsGroup: 816
            fsGroup: 816
            supplementalGroups:
              - 816
        containers:
          app:
            nameOverride: music-assistant
            image:
              repository: ghcr.io/music-assistant/server
              tag: 2.10.9
              pullPolicy: IfNotPresent
            env:
              TZ: Australia/Sydney
            ports:
              - name: http
                containerPort: 8095
                protocol: TCP
              # The stream server. Players fetch audio from here directly, so
              # this is the port that has to be reachable from the LAN -- see the
              # LoadBalancer below.
              - name: stream
                containerPort: 8097
                protocol: TCP
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # Transcoding with ffmpeg is the expensive part; this is a
                # starting guess, not a measured figure.
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8095
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8095
                  initialDelaySeconds: 0
                  failureThreshold: 3
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8095
                  initialDelaySeconds: 0
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      # A plain ClusterIP. This only has to back the Ingress below -- players and
      # the stream server reach the pod on its macvlan address (192.168.58.201),
      # so the MetalLB LoadBalancer this used to carry was redundant and is given
      # back to the pool.
      music-assistant:
        controller: music-assistant
        primary: true
        ports:
          http:
            port: 8095
            targetPort: http
            primary: true
          stream:
            port: 8097
            targetPort: stream
    ingress:
      # Convenience TLS entry for the web UI from a browser; players and the Home
      # Assistant integration use the macvlan address instead.
      #
      # Deliberately NOT behind oauth2/Authelia: Music Assistant 2.10 has its own
      # authentication (it generates a JWT secret and runs an auth manager), so
      # the proxy added a second login for no gain -- and it cannot protect the
      # macvlan address anyway, which is reachable on the LAN regardless. Dropping
      # it also removes the need for the per-host /oauth2 Ingress and the Authelia
      # redirect_uri registration.
      music-assistant:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
          hajimari.io/enable: 'true'
          hajimari.io/icon: 'music'
          hajimari.io/appName: 'music-assistant'
        tls:
          - hosts:
              - music-assistant.${BASE_DOMAIN}
            secretName: music-assistant-tls
        hosts:
          - host: music-assistant.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: music-assistant
                  port: http
    # Published externally through the cloudflared tunnel, as a Gateway API
    # HTTPRoute on traefik-external.
    #
    # Only the 8095 http port. The 8097 stream port is not published; it is used by players on the LAN.
    #
    # Until now the tunnel reached this app's Service directly over plain HTTP,
    # with its routing table living only in the Cloudflare dashboard. Putting a
    # route here moves that hop behind traefik-external, which means the
    # publicly-trusted *.borgs.net wildcard, one access log with the real client
    # IP, and somewhere to attach middleware -- the second layer of defence the
    # tunnel sits in front of.
    #
    # Attaching is two-sided and both sides are explicit: the Gateway permits
    # `from: All` AND this names the Gateway. Neither alone is enough.
    #
    # The internal record needs no annotation: external-dns reads an HTTPRoute's
    # target from its GATEWAY's status.addresses, which Traefik populates with
    # traefik-external's LoadBalancer address.
    route:
      external:
        # Explicit, because this release does not set
        # alwaysAppendIdentifierToResourceName. app-template only appends the
        # identifier when more than one item of a kind exists, so with a single
        # route the object would be named `music-assistant` -- identical to the
        # Service and Deployment, which is needlessly confusing to debug. The
        # other four releases set that flag and get `-external` for free.
        suffix: external
        hostnames:
          - music.${EXTERNAL_DOMAIN}
        parentRefs:
          # sectionName pins it to the HTTPS listener, so it can never attach to
          # the chart's default HTTP one.
          - name: external
            namespace: network-system
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: music-assistant
                port: 8095
      # The HTTP->HTTPS redirect for this host, as its own route on the `web`
      # listener. Per host rather than a blanket entrypoint redirect, so :80
      # still 404s for anything that has not opted in.
      #
      # A separate route and not another rule on the one above: a route's rules
      # apply to all of its parentRefs, so serving the backend on websecure and
      # redirecting on web cannot be expressed in a single route.
      #
      # 301, and no backendRef -- the filter terminates the request at Traefik.
      external-redirect:
        hostnames:
          - music.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: external
            namespace: network-system
            sectionName: web
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        size: 5Gi
        accessMode: ReadWriteOnce
        # Holds library.db, auth.db and the artwork cache -- none of it in git.
        retain: true
        globalMounts:
          - path: /data
      # The existing library, read-only: Music Assistant only ever needs to read
      # it, and read-only also means a misconfigured provider cannot reorganise
      # the files lidarr manages.
      media-music:
        enabled: true
        type: nfs
        server: nas
        path: /mnt/tank/media/music
        globalMounts:
          - path: /media/music
            readOnly: true
