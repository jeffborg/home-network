---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: netbootxyz
  namespace: network
spec:
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 10m
  values:
    defaultPodOptions:
      # no host pin: with externalTrafficPolicy: Local the VIP follows the pod,
      # and every node is prepped with the TFTP conntrack helper (see README)
      nodeSelector:
        storage: longhorn
      securityContext:
        fsGroup: 1000
    controllers:
      netbootxyz:
        # single writer: the menu editor is not multi-writer safe and /config is RWO
        strategy: Recreate
        containers:
          app:
            image:
              # lscr.io/linuxserver/netbootxyz is deprecated upstream; this is the
              # image the netboot.xyz project itself publishes
              repository: ghcr.io/netbootxyz/netbootxyz
              tag: "0.7.6-nbxyz24"
              pullPolicy: IfNotPresent
            env:
              TZ: "Australia/Sydney"
              PUID: "1000"
              PGID: "1000"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 20
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
    service:
      # boot path: TFTP + the nginx menu/asset server. Deliberately NOT behind the
      # ingress so a PXE boot never depends on DNS or TLS.
      boot:
        controller: netbootxyz
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          external-dns.alpha.kubernetes.io/hostname: boot.netboot.${BASE_DOMAIN}
        ports:
          tftp:
            port: 69
            protocol: UDP
            targetPort: 69
            primary: true
          assets:
            port: 80
            protocol: TCP
            targetPort: 80
      webui:
        controller: netbootxyz
        primary: true
        ports:
          http:
            port: 3000
            targetPort: 3000
    ingress:
      main:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          hajimari.io/enable: 'true'
          hajimari.io/icon: 'server-network'
          hajimari.io/appName: 'netboot.xyz'
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        hosts:
          - host: netboot.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: webui
                  port: 3000
        tls:
          - secretName: tls.netbootxyz
            hosts:
              - netboot.${BASE_DOMAIN}
    persistence:
      config:
        enabled: true
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          netbootxyz:
            app:
              - path: /config
