---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uisp
  namespace: network
# note values documented here https://bjw-s-labs.github.io/helm-charts/docs/app-template/
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    timeout: 5m
  interval: 10m0s
  values:
    global:
      # app-template 5 only appends an identifier to a generated resource name
      # when more than one of that kind exists; 0.2.2 always appended it to the
      # PVC. Without this the claim is created fresh as `uisp` and the bound
      # `uisp-config` orphaned with its data -- and unlike the 3.7.3 releases in
      # #3266 this claim has no helm.sh/resource-policy: keep, so the name is the
      # only protection.
      #
      # The flag would also suffix the Service/Ingress/Deployment, except that
      # app-template never appends an identifier equal to the release name, so
      # the controller/service/ingress keys below are all named `uisp`.
      # Net result: nothing is renamed.
      alwaysAppendIdentifierToResourceName: true
    defaultPodOptions:
      # 0.2.2 left this on; 5.3.0 defaults it off, so keep it to preserve the
      # service-link env vars in the pod.
      enableServiceLinks: true
      nodeSelector:
        storage: longhorn
        kubernetes.io/hostname: node1
    controllers:
      uisp:
        strategy: Recreate
        containers:
          app:
            image:
              repository: nico640/docker-unms
              tag: "3.1.70"
              pullPolicy: IfNotPresent
            env:
              TZ: "Australia/Sydney"
            # 0.2.2 enabled all three TCP probes on the primary port (443) by
            # default; 5.3.0 enables none, so they are declared explicitly to
            # keep the pod spec as it is today.
            probes:
              liveness:
                enabled: true
                port: 443
              readiness:
                enabled: true
                port: 443
              startup:
                enabled: true
                port: 443
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      # keyed `uisp` so the Service keeps its plain name under the flag -- it is
      # a LoadBalancer whose VIP is published to DNS by the annotation below, so
      # a rename would churn the address record.
      uisp:
        controller: uisp
        annotations:
          external-dns.alpha.kubernetes.io/hostname: uisp-external.${BASE_DOMAIN}
        type: LoadBalancer
        externalTrafficPolicy: Local
        ports:
          http:
            port: 80
          https:
            port: 443
            primary: true
          netflow:
            port: 2055
            protocol: UDP
    ingress:
      # keyed `uisp` so the Ingress keeps its plain name under the flag --
      # cert-manager's ingress-shim owns uisp-tls by ownerReference to this
      # Ingress, so a rename would garbage-collect the Certificate.
      uisp:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
          traefik.ingress.kubernetes.io/service.serversscheme: https
        tls:
          - hosts:
            - uisp.${BASE_DOMAIN}
            secretName: uisp-tls
        hosts:
          - host: uisp.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: uisp
                  port: 443
    persistence:
      config:
        # Keeps the claim if the chart ever stops rendering it. 0.2.2 had no
        # `retain` option, which is why this PVC was not covered by #3266.
        retain: true
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 5Gi
        globalMounts:
          - path: /config
