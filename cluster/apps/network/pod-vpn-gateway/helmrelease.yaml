# HelmRelease.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpn-gateway
  namespace: network
  labels: {}
spec:
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://angelnu.github.io/helm-charts
      chart: pod-gateway
      version: 7.1.1
      sourceRef:
        kind: HelmRepository
        name: angelnu-helm-charts
        namespace: flux-system
      interval: 10m
  # Pods in the `vpn` namespace egress through the OpenVPN tunnel. Targeting is by
  # the `routed-gateway: "true"` label on the vpn namespace (set in
  # cluster/core/namespaces/vpn-namespace.yaml).
  #
  # The tunnel sidecar is gluetun, replacing dperson/openvpn-client (last pushed
  # 2021-03-31) -- see #3325. pod-gateway still owns the firewall: gluetun only
  # brings up tun0.
  values:
    controllers:
      main:
        initContainers:
          # gluetun refuses a custom OpenVPN config whose `remote` is a hostname:
          #   extracting from remote line: host is not an IP address:
          #   nl-am-smart.serverlocation.co
          # It parses the file before any OPENVPN_ENDPOINT_IP override applies, so
          # that env var is not a way round it. The hostname is a 4-address pool on
          # a 600s TTL, so hardcoding one address into the ConfigMap would discard
          # the provider's failover and silently rot when they renumber.
          #
          # So resolve it at pod start and emit one `remote` line per A record --
          # openvpn then keeps its own failover across all four. Fails the pod
          # rather than writing a config with no remote.
          vpnresolve:
            image:
              repository: ghcr.io/angelnu/pod-gateway
              tag: v1.13.0
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                HOST=nl-am-smart.serverlocation.co
                ips=$(getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u)
                if [ -z "$ips" ]; then
                  echo "FATAL: could not resolve $HOST" >&2
                  exit 1
                fi
                while IFS= read -r line; do
                  case "$line" in
                    "remote $HOST "*)
                      for ip in $ips; do echo "remote $ip 1194"; done
                      ;;
                    *)
                      printf '%s\n' "$line"
                      ;;
                  esac
                done < /vpn/vpn.conf > /run/vpn/custom.conf
                echo "resolved $HOST -> $(echo $ips | tr '\n' ' ')"
        containers:
          main:
            image:
              repository: ghcr.io/angelnu/pod-gateway
              tag: v1.13.0
          gluetun:
            # The chart predefines a `gluetun` stub with enabled:false, so it has
            # to be switched on explicitly. `dependsOn: main` is the chart's own
            # default and only orders the container array -- the firewall ordering
            # that actually matters is handled by gateway_init.sh being an
            # initContainer, so pod-gateway's rules are always in place first.
            enabled: true
            dependsOn: main
            image:
              # Digest-pinned, matching the chart's own default and the exact
              # image this was validated against. Worth keeping pinned here: the
              # repo now lives at github.com/passteque/gluetun (transferred off
              # qdm12, who still authors the releases and owns gluetun-wiki),
              # and the ghcr path keeps the old owner's name. A digest makes who
              # owns the path irrelevant.
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3
            env:
              VPN_SERVICE_PROVIDER: custom
              VPN_TYPE: openvpn
              # The server negotiates AES-256-CBC, and OpenVPN 2.6 refuses any
              # data-channel cipher absent from --data-ciphers, whose default is
              # AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305:
              #
              #   Error: negotiated cipher not allowed - AES-256-CBC not in
              #     AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
              #   OPTIONS ERROR: failed to import crypto options
              #
              # tun0 comes up and is then torn down, so the tunnel loops and the
              # vpn namespace has no egress at all. The profile's `cipher
              # AES-256-CBC` line is NOT enough -- in 2.6 that only sets the
              # fallback, it does not add to the permitted list.
              #
              # Comma-separated, not colon: gluetun passes a colon-joined value
              # to --cipher (singular) and openvpn then rejects the whole string
              # as one unknown cipher name. GCM is listed first so a server that
              # offers it still wins.
              OPENVPN_CIPHERS: AES-256-GCM,AES-256-CBC
              # The chart's gluetun stub is written for wireguard and defaults
              # VPN_INTERFACE to wg0. Left alone it renders into the pod and
              # gluetun builds wg0, while pod-gateway routes and firewalls on
              # tun0 -- so traffic would be dropped with everything looking up.
              # Must stay in step with settings.VPN_INTERFACE below.
              VPN_INTERFACE: tun0
              OPENVPN_CUSTOM_CONFIG: /run/vpn/custom.conf
              # pod-gateway's dnsmasq already binds 127.0.0.1:53 (and
              # 172.16.0.1:53), which is exactly where gluetun's built-in resolver
              # wants to listen. Pointing DNS_ADDRESS at an external resolver is
              # what disables that server -- verified it then binds nothing on :53.
              # DOT must go off with it, or gluetun rejects the config outright:
              # "upstream type dot must be plain if the built-in DNS server is
              # disabled". DNS_ADDRESS=127.0.0.1 is rejected for the same reason.
              # gluetun needs no DNS of its own here: it is handed IP addresses.
              DOT: "off"
              DNS_ADDRESS: 10.43.0.10
              OPENVPN_USER:
                valueFrom:
                  secretKeyRef:
                    name: vpn-gateway-secrets
                    key: username
              OPENVPN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: vpn-gateway-secrets
                    key: password
            securityContext:
              capabilities:
                # gluetun needs no SYS_MODULE (dperson's image used it to load the
                # tun module itself); it mknods /dev/net/tun with the default
                # capability set.
                add: [NET_ADMIN]
      webhook:
        # Reloader restarts the webhook when cert-manager rotates its serving cert
        # (the admission controller reads the cert only at startup).
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/angelnu/gateway-admision-controller
              tag: v3.12.0
    persistence:
      # The profile is a ConfigMap (configmap.yaml) rather than a Secret: it is the
      # provider's publicly published profile. Only the resolver reads it.
      vpnconfig:
        type: configMap
        name: vpn-gateway-vpnconfig
        advancedMounts:
          main:
            vpnresolve:
              - path: /vpn/vpn.conf
                subPath: vpn.conf
      # Hands the rewritten config from the resolver to gluetun.
      vpnrun:
        type: emptyDir
        advancedMounts:
          main:
            vpnresolve:
              - path: /run/vpn
            gluetun:
              - path: /run/vpn
    routed_namespaces:
      - vpn
    settings:
      # The v1.13.0 image defaults GATEWAY_ENABLE_DNSSEC=true in its baked
      # /default_config/settings.sh, which v1.5.0 did not. With it on, the
      # gateway's dnsmasq validates every answer against its upstream -- which
      # here is CoreDNS, then pihole. Neither serves a usable root DNSKEY, so
      # dnsmasq rejects everything:
      #
      #   dnssec-query[DNSKEY] . to 10.43.0.10
      #   reply . is BOGUS DNSKEY
      #   validation ghcr.io.lan is BOGUS
      #
      # which broke all external resolution for the vpn namespace while leaving
      # internal cluster lookups working (those are answered from the
      # DNS_LOCAL_CIDRS server= line, not validated). Our settings.sh is sourced
      # after the image's, so setting it false here wins.
      GATEWAY_ENABLE_DNSSEC: "false"
      NOT_ROUTED_TO_GATEWAY_CIDRS: "10.43.0.0/16" # services stay on the k8s gateway
      VPN_INTERFACE: tun0
      VPN_BLOCK_OTHER_TRAFFIC: true
      VPN_TRAFFIC_PORT: 1194
      VPN_LOCAL_CIDRS: "10.42.0.0/16 10.43.0.0/16 192.168.0.0/16"
    networkpolicies:
      main:
        enabled: true
        controller: main
        policyTypes:
          - Egress
        rules:
          egress:
            # Allow only VPN traffic to the Internet
            - to:
                - ipBlock:
                    cidr: 0.0.0.0/0
              ports:
                - port: 1194
                  protocol: UDP
            # Allow any traffic within k8s
            - to:
                - ipBlock:
                    cidr: 10.42.0.0/16
                - ipBlock:
                    cidr: 10.43.0.0/16
