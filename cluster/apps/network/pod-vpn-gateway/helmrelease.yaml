# HelmRelease.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpn-gateway
  namespace: network
  labels: {}
spec:
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://angelnu.github.io/helm-charts
      chart: pod-gateway
      version: 7.1.1
      sourceRef:
        kind: HelmRepository
        name: angelnu-helm-charts
        namespace: flux-system
      interval: 10m
  # Migrated from the archived k8s-at-home pod-gateway 5.3.0 to the maintained
  # angelnu chart (bjw-s common lib). Same job: pods in the `vpn` namespace egress
  # through the OpenVPN tunnel. The gateway pod runs the pod-gateway container plus
  # a dperson/openvpn-client sidecar (NET_ADMIN+SYS_MODULE) that brings up tun0 from
  # the mounted vpn.conf; VPN_INTERFACE=tun0 + VPN_BLOCK_OTHER_TRAFFIC makes it fail
  # closed. Targeting is by the `routed-gateway: "true"` label on the vpn namespace
  # (already set in cluster/core/namespaces/vpn-namespace.yaml).
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/angelnu/pod-gateway
              tag: v1.13.0
          # gluetun, not dperson/openvpn-client: that image was last pushed
          # 2021-03-31 (amd64 layer 2020-07-07) and was referenced as `latest`,
          # so an unmaintained 4-year-old binary was terminating the tunnel and
          # holding the credentials. gluetun is actively maintained (pushed
          # within the last week), multi-arch including arm64, and is what this
          # chart's own values example uses. Pinned by digest for the same
          # reason `latest` was wrong.
          gluetun:
            # The chart ships `gluetun` as a predefined container stub with
            # enabled: false, so values merged into it are silently dropped
            # without this. dependsOn: main is already the chart default.
            enabled: true
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            env:
              # Custom provider: gluetun reads the profile from the mounted file
              # rather than knowing our provider. VPN_TYPE stays openvpn, so the
              # interface is tun0 and settings.VPN_INTERFACE below still matches.
              VPN_SERVICE_PROVIDER: custom
              VPN_TYPE: openvpn
              # Must be set explicitly: the chart's gluetun stub defaults this
              # to wg0 because its example is wireguard. Leaving it would have
              # gluetun watching an interface that never comes up, while
              # settings.VPN_INTERFACE below correctly said tun0 -- the two have
              # to agree.
              VPN_INTERFACE: tun0
              OPENVPN_CUSTOM_CONFIG: /gluetun/custom.conf
              # Credentials come from env, not from auth-user-pass in the
              # profile -- see the secret note below.
              # NB: vpn-gateway-secrets currently holds a single `auth` key
              # (the two-line auth-user-pass file the old chart fed to
              # openvpn). It has to be split into `username` and `password`
              # for this -- see the TODO below.
              OPENVPN_USER:
                valueFrom:
                  secretKeyRef:
                    name: vpn-gateway-secrets
                    key: username
              OPENVPN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: vpn-gateway-secrets
                    key: password
            securityContext:
              capabilities:
                # NET_ADMIN only. dperson needed SYS_MODULE to load the tun
                # module itself; gluetun expects /dev/net/tun to be provided.
                add: [NET_ADMIN]
      webhook:
        # Reloader restarts the webhook when cert-manager rotates its serving cert
        # (the admission controller reads the cert only at startup).
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/angelnu/gateway-admision-controller
              tag: v3.12.0
    # TODO(before merge): create the SOPS secret `vpn-gateway-vpnconfig` in the
    # `network` namespace with a single key `vpn.conf` holding the OpenVPN
    # profile -- remote/<ca>/<tls-auth>, but WITHOUT an auth-user-pass line.
    # gluetun takes the credentials from OPENVPN_USER/OPENVPN_PASSWORD above,
    # which means vpn-gateway-secrets must gain `username` and `password` keys:
    # today it has only `auth`, the two-line file the old chart passed to
    # openvpn, and that shape does not fit a secretKeyRef per credential.
    # Rotate the tls-auth key while doing this -- the current one is committed
    # in plaintext in the file this replaces, and this repo is public.
    persistence:
      vpnconfig:
        type: secret
        name: vpn-gateway-vpnconfig
        advancedMounts:
          main:
            gluetun:
              - path: /gluetun/custom.conf
                subPath: vpn.conf
      # gluetun needs the tun device; it does not create it. The old image
      # carried SYS_MODULE and loaded the module itself.
      tun:
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        advancedMounts:
          main:
            gluetun:
              - path: /dev/net/tun
    routed_namespaces:
      - vpn
    settings:
      NOT_ROUTED_TO_GATEWAY_CIDRS: "10.43.0.0/16" # services stay on the k8s gateway
      VPN_INTERFACE: tun0
      VPN_BLOCK_OTHER_TRAFFIC: true
      VPN_TRAFFIC_PORT: 1194
      VPN_LOCAL_CIDRS: "10.42.0.0/16 10.43.0.0/16 192.168.0.0/16"
    networkpolicies:
      main:
        enabled: true
        controller: main
        policyTypes:
          - Egress
        rules:
          egress:
            # Allow only VPN traffic to the Internet
            - to:
                - ipBlock:
                    cidr: 0.0.0.0/0
              ports:
                - port: 1194
                  protocol: UDP
            # Allow any traffic within k8s
            - to:
                - ipBlock:
                    cidr: 10.42.0.0/16
                - ipBlock:
                    cidr: 10.43.0.0/16
