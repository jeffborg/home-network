# HelmRelease.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpn-gateway
  namespace: network
  labels: {}
spec:
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://angelnu.github.io/helm-charts
      chart: pod-gateway
      version: 7.1.1
      sourceRef:
        kind: HelmRepository
        name: angelnu-helm-charts
        namespace: flux-system
      interval: 10m
  # Migrated from the archived k8s-at-home pod-gateway 5.3.0 to the maintained
  # angelnu chart (bjw-s common lib). Same job: pods in the `vpn` namespace egress
  # through the OpenVPN tunnel. The gateway pod runs the pod-gateway container plus
  # a dperson/openvpn-client sidecar (NET_ADMIN+SYS_MODULE) that brings up tun0 from
  # the mounted vpn.conf; VPN_INTERFACE=tun0 + VPN_BLOCK_OTHER_TRAFFIC makes it fail
  # closed. Targeting is by the `routed-gateway: "true"` label on the vpn namespace
  # (already set in cluster/core/namespaces/vpn-namespace.yaml).
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/angelnu/pod-gateway
              tag: v1.13.0
          # Same container the old chart injected, configured the same way, so
          # this PR changes the chart and nothing about the tunnel. dperson's
          # entrypoint splits $VPN_AUTH on ';' and falls through to treating a
          # newline-separated value as user then pass, which is the shape the
          # existing `auth` key already has -- verified against the running
          # /vpn/vpn.auth. Replacing this image is tracked separately; it was
          # last pushed 2021-03-31.
          openvpn:
            # The chart only predefines a `gluetun` container stub, so a
            # container added under any other key needs enabling explicitly.
            enabled: true
            dependsOn: main
            image:
              repository: dperson/openvpn-client
              tag: latest
            env:
              # The old chart generated a <release>-openvpn Secret holding
              # VPN_AUTH and wired it with envFrom. Same variable, read straight
              # from the secret we already keep it in.
              VPN_AUTH:
                valueFrom:
                  secretKeyRef:
                    name: vpn-gateway-secrets
                    key: auth
            securityContext:
              capabilities:
                # Matches the live container: SYS_MODULE is what lets this image
                # load the tun module itself.
                add: [NET_ADMIN, SYS_MODULE]
      webhook:
        # Reloader restarts the webhook when cert-manager rotates its serving cert
        # (the admission controller reads the cert only at startup).
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/angelnu/gateway-admision-controller
              tag: v3.12.0
    # TODO(before merge): create the SOPS secret `vpn-gateway-vpnconfig` in the
    # `network` namespace with a single key `vpn.conf` holding the OpenVPN
    # profile -- remote/<ca>/<tls-auth>, but WITHOUT an auth-user-pass line.
    # gluetun takes the credentials from OPENVPN_USER/OPENVPN_PASSWORD above,
    # which means vpn-gateway-secrets must gain `username` and `password` keys:
    # today it has only `auth`, the two-line file the old chart passed to
    # openvpn, and that shape does not fit a secretKeyRef per credential.
    # Rotate the tls-auth key while doing this -- the current one is committed
    # in plaintext in the file this replaces, and this repo is public.
    persistence:
      # The profile is a ConfigMap (configmap.yaml) rather than a Secret: it is
      # the provider's publicly published profile. Mounted at the same path the
      # old chart used, so openvpn sees exactly what it sees today.
      vpnconfig:
        type: configMap
        name: vpn-gateway-vpnconfig
        advancedMounts:
          main:
            openvpn:
              - path: /vpn/vpn.conf
                subPath: vpn.conf
    routed_namespaces:
      - vpn
    settings:
      # The v1.13.0 image defaults GATEWAY_ENABLE_DNSSEC=true in its baked
      # /default_config/settings.sh, which v1.5.0 did not. With it on, the
      # gateway's dnsmasq validates every answer against its upstream -- which
      # here is CoreDNS, then pihole. Neither serves a usable root DNSKEY, so
      # dnsmasq rejects everything:
      #
      #   dnssec-query[DNSKEY] . to 10.43.0.10
      #   reply . is BOGUS DNSKEY
      #   validation ghcr.io.lan is BOGUS
      #
      # which broke all external resolution for the vpn namespace while leaving
      # internal cluster lookups working (those are answered from the
      # DNS_LOCAL_CIDRS server= line, not validated). Our settings.sh is sourced
      # after the image's, so setting it false here wins.
      GATEWAY_ENABLE_DNSSEC: "false"
      NOT_ROUTED_TO_GATEWAY_CIDRS: "10.43.0.0/16" # services stay on the k8s gateway
      VPN_INTERFACE: tun0
      VPN_BLOCK_OTHER_TRAFFIC: true
      VPN_TRAFFIC_PORT: 1194
      VPN_LOCAL_CIDRS: "10.42.0.0/16 10.43.0.0/16 192.168.0.0/16"
    networkpolicies:
      main:
        enabled: true
        controller: main
        policyTypes:
          - Egress
        rules:
          egress:
            # Allow only VPN traffic to the Internet
            - to:
                - ipBlock:
                    cidr: 0.0.0.0/0
              ports:
                - port: 1194
                  protocol: UDP
            # Allow any traffic within k8s
            - to:
                - ipBlock:
                    cidr: 10.42.0.0/16
                - ipBlock:
                    cidr: 10.43.0.0/16
