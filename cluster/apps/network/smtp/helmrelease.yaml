---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: smtp
  namespace: network
spec:
  interval: 10m
  chart:
    spec:
      # renovate: registryUrl=https://bokysan.github.io/docker-postfix/
      chart: mail
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: docker-postfix
        namespace: flux-system
      interval: 10m0s
  install: {}
  values:
    pod:
      annotations:
        configmap.reloader.stakater.com/reload: "smtp-mail"
    config:
      general:
        RELAYHOST: ${SMTP_HOST}
        RELAYHOST_USERNAME: ${SMTP_USER}
        MASQUERADED_DOMAINS: ${EXTERNAL_DOMAIN}
        ALLOWED_SENDER_DOMAINS: ${EXTERNAL_DOMAIN}
        ALLOW_EMPTY_SENDER_DOMAINS: 'true'
        # LOG_FORMAT: json
        # INBOUND_DEBUGGING: '1'
      postfix:
        hostname: smtp-internal.${EXTERNAL_DOMAIN}
    secret:
      RELAYHOST_PASSWORD: ${SMTP_PASS}
    persistence:
      storageClass: longhorn
    nodeSelector:
      storage: longhorn
    # See configmap-sasl-xoauth2.yaml: gives the bundled sasl-xoauth2 plugin the
    # config file it looks for, so it stops warning on every delivery.
    extraVolumes:
      - name: sasl-xoauth2-config
        configMap:
          name: smtp-sasl-xoauth2
    extraVolumeMounts:
      - name: sasl-xoauth2-config
        mountPath: /etc/sasl-xoauth2.conf
        subPath: sasl-xoauth2.conf
        readOnly: true
    service:
      type: LoadBalancer
      spec:
        externalTrafficPolicy: Local
      annotations:
        external-dns.alpha.kubernetes.io/hostname: smtp.${BASE_DOMAIN}

