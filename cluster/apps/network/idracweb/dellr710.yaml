---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idrac-r710
  namespace: network
spec:
  selector:
    matchLabels:
      app: idrac-r710
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: idrac-r710
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: idrac-r710
        image: domistyle/idrac6:v1.0
        resources:
          limits:
            # 384Mi, not 300Mi: worst case is ~128M heap + 64M direct buffers
            # + ~40M metaspace + 32M code cache + ~20M for Xvfb/x11vnc/nginx,
            # and cgroup v2 counts the ~85M of page cache the jar downloads
            # leave behind. 300Mi left no margin at all.
            memory: "384Mi"
            cpu: "500m"
          # Without explicit requests, Kubernetes defaults them to equal the
          # limits, which made this the node's only Guaranteed pod at 500m
          # despite drawing ~11m.
          requests:
            memory: "100Mi"
            cpu: "50m"
        env:
          # This image pins Zulu 8u362, which predates the cgroups-v2 support
          # added in 8u372. UseContainerSupport reports true but silently reads
          # the *host* /proc/meminfo, so on this 32G node the JVM sized
          # MaxHeapSize at 7.8G and InitialHeapSize at 498M against a 300Mi
          # limit -- the GC saw no reason to collect and the pod was OOMKilled
          # roughly every three hours.
          #
          # startapp.sh execs `java -cp avctKVM.jar ...` directly and honours no
          # JAVA_OPTS, so JAVA_TOOL_OPTIONS is the only injection point that
          # does not mean overriding the s6 entrypoint. Values must be absolute:
          # the percentage flags (MaxRAMPercentage et al) would be percentages
          # of the host's 32G on this JVM, which is the bug, not the fix.
          #
          # ActiveProcessorCount is the CPU-side half of the same blindness --
          # nproc reports 8 regardless of the 500m limit, which bought us 8
          # ParallelGC threads and 4 JIT compiler threads.
          - name: JAVA_TOOL_OPTIONS
            value: >-
              -Xms32m
              -Xmx128m
              -XX:MaxMetaspaceSize=96m
              -XX:CompressedClassSpaceSize=64m
              -XX:ReservedCodeCacheSize=32m
              -XX:MaxDirectMemorySize=64m
              -XX:ActiveProcessorCount=1
              -XX:+UseSerialGC
              -XX:CICompilerCount=2
          - name: KEEP_APP_RUNNING
            value: "1"
          - name: VNC_PASSWORD
            valueFrom:
              secretKeyRef:
                key: vncPassword
                name: idrac-passwords
          - name: IDRAC_HOST
            valueFrom:
              secretKeyRef:
                key: host
                name: idrac-passwords
          - name: IDRAC_USER
            valueFrom:
              secretKeyRef:
                key: username
                name: idrac-passwords
          - name: IDRAC_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: idrac-passwords
        # The default timeoutSeconds of 1 was too tight for a 500m-CPU pod and
        # logged 77 liveness / 118 readiness timeouts over 38h; with no initial
        # delay the probes also fired while startapp.sh was still pulling
        # avctKVM.jar off the iDRAC.
        readinessProbe:
          httpGet:
            path: /
            port: 5800
          initialDelaySeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 5800
          initialDelaySeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        ports:
        - containerPort: 5800
        - containerPort: 5900
        # subPath replaces the single file instead of masking the rest of
        # /opt/noVNC/app. The trade-off is that a subPath mount does not track
        # ConfigMap updates: roll the deployment after editing the JS.
        volumeMounts:
        - name: novnc-error-handler
          mountPath: /opt/noVNC/app/error-handler.js
          subPath: error-handler.js
          readOnly: true
      volumes:
      - name: novnc-error-handler
        configMap:
          name: idrac-r710-novnc
          defaultMode: 420
---
apiVersion: v1
kind: Service
metadata:
  name: idrac-r710-web
  namespace: network
spec:
  selector:
    app: idrac-r710
  ports:
  - port: 5800
    targetPort: 5800
---
apiVersion: v1
kind: Service
metadata:
  name: idrac-r710-vnc
  namespace: network
spec:
  selector:
    app: idrac-r710
  ports:
  - port: 5900
    targetPort: 5900
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idrac-r710
  namespace: network
  labels:
    name: idrac-r710
  annotations:
    cert-manager.io/cluster-issuer: ca-issuer
    traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
spec:
  tls:
    - secretName: "tls.idrac-r710"
      hosts:
        - "dellr710.${BASE_DOMAIN}"
  rules:
  - host: dellr710.${BASE_DOMAIN}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: idrac-r710-web
            port: 
              number: 5800
