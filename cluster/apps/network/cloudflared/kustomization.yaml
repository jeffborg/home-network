# kustomization.yml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - deployment.yaml
    - config.yaml
    - credentials.sops.yaml
    # The old tunnel token. KEPT, not deleted: it is the rollback path -- revert
    # the deployment and it works again with no Cloudflare-side action. It also
    # holds an unrelated `mac` key.
    - secret.sops.yaml
