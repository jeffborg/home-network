---
# start.${BASE_DOMAIN} - replaces hajimari, whose upstream was archived in 2023
# (app v0.3.1) and whose search provider is not settable from chart values.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: web-util
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 10m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        type: deployment
        # Reloader restarts this Deployment when homepage-config changes.
        #
        # Without it, editing services.yaml changed nothing visible: the
        # generator sets `disableNameSuffixHash: true`, so the ConfigMap name
        # never changes, so the pod template never changes, so Flux has no
        # reason to roll the pod -- and homepage reads its config only at
        # startup. The pod was 7 days old while the ConfigMap already held the
        # new entry.
        #
        # The kustomization already carried `reloader.stakater.com/match: "true"`
        # on the generated ConfigMap, but that is the wrong half of the pair:
        # `match` only filters which mounted ConfigMaps count for a workload
        # that is ALREADY annotated, and reloader here runs without
        # --auto-reload-all. So nothing was watching this.
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.8.0
            env:
              TZ: Australia/Sydney
              # Required from v1.0: homepage rejects any request whose Host
              # header is not listed here, and the failure looks like a broken
              # app rather than a config error.
              HOMEPAGE_ALLOWED_HOSTS: start.${BASE_DOMAIN}
            probes:
              # The Host header matters: kubelet probes by pod IP, which
              # HOMEPAGE_ALLOWED_HOSTS rejects with a 400, so an ordinary
              # httpGet fails the probe while the app is perfectly healthy
              # through the ingress.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                    httpHeaders:
                      - name: Host
                        value: start.${BASE_DOMAIN}
                  periodSeconds: 20
                  failureThreshold: 3
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      main:
        primary: true
        controller: main
        ports:
          http:
            port: 3000
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        hosts:
          - host: start.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - start.${BASE_DOMAIN}
            secretName: start-tls
    persistence:
      config:
        type: configMap
        name: homepage-config
        # Mounted file by file, not as a directory. Homepage creates
        # /app/config/logs at startup, so a read-only mount over the whole
        # directory makes it serve HTTP 500 - verified against v1.4.5 before
        # settling on this.
        globalMounts:
          - path: /app/config/settings.yaml
            subPath: settings.yaml
            readOnly: true
          - path: /app/config/services.yaml
            subPath: services.yaml
            readOnly: true
          - path: /app/config/widgets.yaml
            subPath: widgets.yaml
            readOnly: true
          - path: /app/config/bookmarks.yaml
            subPath: bookmarks.yaml
            readOnly: true
          - path: /app/config/docker.yaml
            subPath: docker.yaml
            readOnly: true
          - path: /app/config/kubernetes.yaml
            subPath: kubernetes.yaml
            readOnly: true
