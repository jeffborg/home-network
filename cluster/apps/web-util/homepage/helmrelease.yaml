---
# start.${EXTERNAL_DOMAIN} - replaces hajimari, whose upstream was archived in 2023
# (app v0.3.1) and whose search provider is not settable from chart values.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: web-util
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 10m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        type: deployment
        # Reloader restarts this Deployment when homepage-config changes.
        #
        # Without it, editing services.yaml changed nothing visible: the
        # generator sets `disableNameSuffixHash: true`, so the ConfigMap name
        # never changes, so the pod template never changes, so Flux has no
        # reason to roll the pod -- and homepage reads its config only at
        # startup. The pod was 7 days old while the ConfigMap already held the
        # new entry.
        #
        # The kustomization already carried `reloader.stakater.com/match: "true"`
        # on the generated ConfigMap, but that is the wrong half of the pair:
        # `match` only filters which mounted ConfigMaps count for a workload
        # that is ALREADY annotated, and reloader here runs without
        # --auto-reload-all. So nothing was watching this.
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.8.0
            env:
              TZ: Australia/Sydney
              # Required from v1.0: homepage rejects any request whose Host
              # header is not listed here, and the failure looks like a broken
              # app rather than a config error.
              HOMEPAGE_ALLOWED_HOSTS: start.${EXTERNAL_DOMAIN}
            probes:
              # The Host header matters: kubelet probes by pod IP, which
              # HOMEPAGE_ALLOWED_HOSTS rejects with a 400, so an ordinary
              # httpGet fails the probe while the app is perfectly healthy
              # through the ingress.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                    httpHeaders:
                      - name: Host
                        value: start.${EXTERNAL_DOMAIN}
                  periodSeconds: 20
                  failureThreshold: 3
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      main:
        primary: true
        controller: main
        ports:
          http:
            port: 3000
    ingress:
      # Replaced by the `route` block below: this host is now a 301 to
      # start.${EXTERNAL_DOMAIN} instead of serving the app.
      #
      # Left as `enabled: false` rather than deleted so the previous arrangement is
      # one word away. NOTE this garbage-collects the per-host Certificate below --
      # cert-manager's ingress-shim owns it by ownerReference to this Ingress. That
      # is deliberate: start.${BASE_DOMAIN} is now served by the internal
      # Gateway, whose websecure listener carries its own start-home certificate
      # (see gateway-certificates-internal.yaml).
      main:
        enabled: false
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: ca-issuer
          traefik.ingress.kubernetes.io/router.middlewares: network-system-https-redirectscheme@kubernetescrd
        hosts:
          - host: start.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - start.${BASE_DOMAIN}
            secretName: start-tls
    route:
      # start.${EXTERNAL_DOMAIN} on the INTERNAL Gateway -- LAN only.
      #
      # The internal Gateway, not `external`: the router port-forwards :443 to
      # traefik-external, so anything attached to that Gateway is reachable from
      # the internet by Host header alone, with no DNS record needed. Attaching
      # here means the name resolves to traefik's own LB address and is served
      # only on the LAN.
      #
      # No DNSEndpoint and no tunnel rule, which is what publishing a
      # ${EXTERNAL_DOMAIN} host actually takes. The internal record comes free:
      # external-dns reads an HTTPRoute's target from its GATEWAY's
      # status.addresses.
      #
      # TLS is the Let's Encrypt *.${EXTERNAL_DOMAIN} wildcard already on that
      # listener -- publicly trusted, so no internal-CA trust needed on the
      # client, which is the point of moving off ${BASE_DOMAIN}.#
    # Deliberately NOT behind Authelia.
      internal:
        hostnames:
          - start.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network-system
            sectionName: websecure
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http
      # http:// -> https:// for the new host, as its own route on the `web`
      # listener. Per host rather than an entrypoint-wide redirect, so :80 still
      # 404s for anything that has not opted in.
      internal-http-redirect:
        hostnames:
          - start.${EXTERNAL_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network-system
            sectionName: web
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
      # The old host, now a 301 to the new one.
      #
      # TWO parentRefs, one rule: a route's rules apply to every parentRef, so
      # attaching to both listeners redirects http:// and https:// callers with a
      # single filter. The https half needs the websecure listener because TLS is
      # terminated before a redirect can be issued -- which is why the
      # start-home certificate is on that listener.
      #
      # `path` is deliberately unset, so the original path is carried into the
      # Location header unchanged.
      legacy-redirect:
        hostnames:
          - start.${BASE_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network-system
            sectionName: web
          - name: internal
            namespace: network-system
            sectionName: websecure
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  hostname: start.${EXTERNAL_DOMAIN}
                  statusCode: 301
    persistence:
      config:
        type: configMap
        name: homepage-config
        # Mounted file by file, not as a directory. Homepage creates
        # /app/config/logs at startup, so a read-only mount over the whole
        # directory makes it serve HTTP 500 - verified against v1.4.5 before
        # settling on this.
        globalMounts:
          - path: /app/config/settings.yaml
            subPath: settings.yaml
            readOnly: true
          - path: /app/config/services.yaml
            subPath: services.yaml
            readOnly: true
          - path: /app/config/widgets.yaml
            subPath: widgets.yaml
            readOnly: true
          - path: /app/config/bookmarks.yaml
            subPath: bookmarks.yaml
            readOnly: true
          - path: /app/config/docker.yaml
            subPath: docker.yaml
            readOnly: true
          - path: /app/config/kubernetes.yaml
            subPath: kubernetes.yaml
            readOnly: true
